<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2b50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Blindleia Darts">
  <title>Blindleia Darts</title>
  <link rel="manifest" href="./api/pwa-manifest.php">
  <link rel="icon" href="./static/club-logos/blindleia-dartklubb-logo.svg?v=20260831-1305" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./static/club-logos/blindleia-dartklubb-logo.png?v=20260831-1305">
  <script>
    (() => {
      const isTest = /(^|[.-])test([.-]|$)/i.test(window.location.hostname)
        || new URLSearchParams(window.location.search).get("pwa") === "test";
      if (!isTest) return;
      document.documentElement.dataset.appEnv = "test";
      document.title = "Blindleia Darts TEST";
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#f3c23c");
      document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", "Blindleia Darts TEST");
    })();
  </script>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0c2340;background:#f3f6fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f7f9fc,#edf2f8)}
    .boot{width:min(420px,calc(100% - 32px));display:grid;justify-items:center;gap:14px;padding:32px;text-align:center;border:1px solid #dbe3ed;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(17,42,73,.09)}
    .logo{width:64px;height:64px;border-radius:14px;background:#fff url("./static/club-logos/blindleia-dartklubb-logo.png") center/contain no-repeat}
    html[data-app-env="test"] .logo{background-color:#fff8d8;outline:4px solid #f3c23c;outline-offset:2px}
    html[data-app-env="test"] .boot{border-color:#e2c34f;box-shadow:inset 0 3px 0 #f3c23c,0 18px 50px rgba(17,42,73,.09)}
    h1{margin:0;font-size:24px}.boot p{margin:0;color:#697c94;line-height:1.5}.error{color:#9e303a}.retry{display:inline-flex;align-items:center;justify-content:center;margin-top:6px;padding:10px 14px;border:0;border-radius:10px;background:#2f6fed;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body data-canonical-router="1">
  <main class="boot" id="portalBoot">
    <span class="logo" aria-hidden="true"></span>
    <h1>Blindleia Darts</h1>
    <p id="portalBootText">Åpner portalen …</p>
  </main>

  <script type="module">
    const VERSION = "20260904-admin-load-02";
    const app = (await import(`./packages/ui-assets/app-core.js?v=${VERSION}`)).default;
    const bootText = document.getElementById("portalBootText");
    const rootPath = window.location.pathname.endsWith("/")
      ? window.location.pathname
      : window.location.pathname.replace(/[^/]*$/, "");

    function requestedRoute() {
      return app.router.route(window.location.hash);
    }

    function normalizeRoute(route, user) {
      if (route.surface === "admin" && !app.session.isAdmin(user)) {
        const next = `${rootPath}#profile`;
        history.replaceState(null, "", next);
        return { surface: "player", view: "profile", hash: "#profile" };
      }
      const canonical = app.router.href(route.surface, route.view);
      if (window.location.hash !== canonical) history.replaceState(null, "", `${rootPath}${canonical}`);
      return { ...route, hash: canonical };
    }

    function rewriteChildHtml(html, surface) {
      const childPrefix = `${rootPath}${surface}/`.replace(/\/{2,}/g, "/");
      const rootPrefix = rootPath.replace(/\/{2,}/g, "/");

      let output = String(html)
        .replace(/((?:href|src)=["'])\.\/([^"']+)/g, (_, start, rest) => `${start}${childPrefix}${rest}`)
        .replace(/((?:href|src)=["'])\.\.\/([^"']+)/g, (_, start, rest) => `${start}${rootPrefix}${rest}`)
        .replace(/portal-menu\.js(?:\?v=[^"']*)?(?=["'])/g, `portal-menu.js?v=${VERSION}`)
        .replace(/tournament-loader\.js(?:\?v=[^"']*)?(?=["'])/g, `tournament-loader.js?v=${VERSION}`);

      if (surface === "admin") {
        output = output
          .replaceAll(`href="${rootPrefix}player/#statistics"`, `href="${rootPrefix}#statistics"`)
          .replaceAll(`href="${rootPrefix}player/"`, `href="${rootPrefix}#home"`)
          .replaceAll(`href='${rootPrefix}player/#statistics'`, `href='${rootPrefix}#statistics'`)
          .replaceAll(`href='${rootPrefix}player/'`, `href='${rootPrefix}#home'`);

        // Heavy section-specific admin modules used to run on every admin route.
        // Strip them from the canonical shell and let admin-section-loader import
        // them only when the user actually opens that section. This keeps the
        // tournament room from competing with member, payment and Scolia queries.
        output = output.replace(
          /<script\b[^>]*\bsrc=["'][^"']*(?:member-onboarding-admin|payment-settings|scolia-admin)\.js[^"']*["'][^>]*>\s*<\/script>/gi,
          ""
        );
        const closeScript = `<${"/"}script>`;
        const closeBody = `<${"/"}body>`;
        output = output.replace(
          /<\/body>/i,
          `<script src="${childPrefix}admin-section-loader.js?v=${VERSION}" type="module">${closeScript}${closeBody}`
        );
      } else {
        output = output
          .replaceAll(`href="${rootPrefix}admin/#overview"`, `href="${rootPrefix}#club"`)
          .replaceAll(`href='${rootPrefix}admin/#overview'`, `href='${rootPrefix}#club'`);
      }

      const sharedStyles = [
        `<link rel="stylesheet" href="${rootPrefix}packages/ui-assets/brand-tokens.css?v=${VERSION}">`,
        `<link rel="stylesheet" href="${rootPrefix}packages/ui-assets/blindleia-system.css?v=${VERSION}">`,
        `<link rel="stylesheet" href="${rootPrefix}packages/ui-assets/admin-canonical-fixes.css?v=${VERSION}">`,
      ].join("");
      output = output.replace(/<\/head>/i, `${sharedStyles}</head>`);
      output = output.replace(
        /<body([^>]*)>/i,
        `<body$1 data-bd-surface="${surface}" data-canonical-root="1" data-canonical-surface="${surface}">`
      );
      return output;
    }

    async function boot() {
      const initial = requestedRoute();
      if (bootText) bootText.textContent = initial.surface === "admin" ? "Kontrollerer tilgang …" : "Åpner portalen …";

      const user = await app.session.resolve();
      const route = normalizeRoute(initial, user);
      const surface = route.surface;
      if (bootText) bootText.textContent = surface === "admin" ? "Åpner klubbdrift …" : "Åpner portalen …";

      const source = new URL(`${surface}/index.html`, new URL(rootPath, window.location.origin));
      source.searchParams.set("canonical", VERSION);
      const response = await fetch(source.href, { cache: "no-store" });
      if (!response.ok) throw new Error(`Kunne ikke laste ${surface === "admin" ? "klubbdrift" : "portalen"} (${response.status}).`);

      const html = rewriteChildHtml(await response.text(), surface);
      document.open();
      document.write(html);
      document.close();
    }

    boot().catch((error) => {
      const root = document.getElementById("portalBoot");
      if (!root) return;
      root.innerHTML = `<span class="logo" aria-hidden="true"></span><h1>Blindleia Darts</h1><p class="error">${String(error.message || error)}</p><button class="retry" type="button">Prøv igjen</button>`;
      root.querySelector(".retry")?.addEventListener("click", () => window.location.reload());
    });
  </script>
</body>
</html>
