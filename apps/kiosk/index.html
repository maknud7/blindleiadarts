<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blindleia Darts Kiosk</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brandline">
        <img class="brand-logo" src="../static/club-logos/blindleia-dartklubb-logo.png" alt="Blindleia Dartklubb logo">
        <div>
          <p class="eyebrow">Kiosk V1</p>
          <h1>Board-side matchflyt</h1>
        </div>
      </div>
      <form id="kioskSetupForm" class="setup">
        <input id="kioskCodeInput" placeholder="Kiosk-kode, f.eks. BOARD-1">
        <button type="submit">Koble til kiosk</button>
      </form>
    </header>

    <main class="layout">
      <section class="scorecard">
        <div class="score-header">
          <div id="kioskMeta" class="meta"></div>
          <div class="actions">
            <button id="refreshButton" class="ghost">Oppdater</button>
            <button id="startMatchButton" class="hidden">Start kamp</button>
            <button id="undoButton" class="ghost">Undo siste visit</button>
          </div>
        </div>
        <div id="stateArea" class="state-area"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Visit Input</p>
            <h2>Legg inn score</h2>
          </div>
        </div>
        <form id="visitForm" class="visit-form">
          <input id="scoreInput" name="score" type="number" min="0" max="180" placeholder="Score">
          <select id="dartsUsedInput" name="darts_used">
            <option value="3">3 darts</option>
            <option value="2">2 darts</option>
            <option value="1">1 dart</option>
          </select>
          <button type="submit">Registrer visit</button>
        </form>

        <div class="quick-grid">
          <button class="quick" data-score="26">26</button>
          <button class="quick" data-score="45">45</button>
          <button class="quick" data-score="60">60</button>
          <button class="quick" data-score="81">81</button>
          <button class="quick" data-score="100">100</button>
          <button class="quick" data-score="121">121</button>
          <button class="quick" data-score="140">140</button>
          <button class="quick" data-score="180">180</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
