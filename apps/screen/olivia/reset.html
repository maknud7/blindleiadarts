<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f4ed">
  <title>Oppdaterer Barna</title>
  <style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ed;color:#1f2933;margin:0;min-height:100vh;display:grid;place-items:center}.box{max-width:440px;padding:28px;text-align:center}h1{font-size:1.6rem}p{color:#667079;line-height:1.5}</style>
</head>
<body>
  <main class="box"><h1>Oppdaterer Barna …</h1><p>Rydder gammel app-cache og åpner siste versjon.</p></main>
  <script>
  (async()=>{
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r=>r.scope.includes('/screen/olivia/')).map(r=>r.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('family-children-')||k.startsWith('olivia-school-')).map(k=>caches.delete(k)));
      }
    }catch(e){console.error(e)}
    location.replace('./?fresh=20260910-0735');
  })();
  </script>
</body>
</html>
