<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="0; url=../live/">
  <meta name="robots" content="noindex">
  <title>Blindleia Darts · Live</title>
  <link rel="stylesheet" href="./screen-ux.css">
  <script>
    (() => {
      const target = new URL('../live/', window.location.href);
      const club = new URLSearchParams(window.location.search).get('club');
      if (club) target.searchParams.set('club', club);
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <main class="retired-screen">
    <p>Kamper på skivene vises nå på Live.</p>
    <a href="../live/">Åpne Blindleia Live</a>
  </main>
</body>
</html>
