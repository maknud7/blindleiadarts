<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blindleia Darts Screen</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="screen-shell">
    <header class="screen-header">
      <div class="brandline">
        <div class="brand-badge">
          <img id="brandLogo" class="brand-logo hidden" alt="Klubblogo">
          <span id="brandFallback" class="brand-fallback">KL</span>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">Venue Screen</p>
          <h1 id="brandTitle">Blindleia Dartklubb</h1>
          <p id="tournamentLabel" class="tournament-label">Ingen aktiv turnering</p>
        </div>
      </div>
      <div class="header-side">
        <div id="headerMeta" class="header-meta"></div>
        <button id="refreshButton" class="ghost-button" type="button">Oppdater</button>
      </div>
    </header>

    <main class="screen-layout">
      <section class="screen-panel live-panel">
        <div class="panel-head">
          <h2>Live kamper</h2>
          <p class="panel-subtitle">Skiver i lokalet akkurat nå</p>
        </div>
        <div id="boardsGrid" class="boards-grid"></div>
      </section>

      <aside class="screen-panel side-panel">
        <section class="side-module">
          <div class="panel-head compact">
            <h2>Neste kamper</h2>
            <p class="panel-subtitle">Det som står for tur</p>
          </div>
          <div id="nextMatches" class="stack"></div>
        </section>
      </aside>
    </main>

    <section id="fallbackPanel" class="fallback-panel hidden">
      <div class="fallback-card">
        <img id="fallbackLogo" class="fallback-logo hidden" alt="Klubblogo">
        <div id="fallbackLogoMark" class="fallback-mark">KL</div>
        <h2 id="fallbackTitle">Velkommen</h2>
        <p id="fallbackMessage">Ingen aktiv turnering akkurat nå.</p>
      </div>
    </section>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
