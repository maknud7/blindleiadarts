<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blindleia Darts Screen</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Venue Screen V1</p>
        <h1>Live oversikt for klubb og boards</h1>
      </div>
      <div class="controls">
        <select id="clubSelect"></select>
        <button id="refreshButton">Oppdater</button>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Kiosker</h2>
        <div id="kioskGrid" class="kiosk-grid"></div>
      </section>

      <section class="card">
        <h2>Turneringer</h2>
        <div id="tournamentList" class="stack"></div>
      </section>

      <section class="card">
        <h2>Siste kamper</h2>
        <div id="recentMatches" class="stack"></div>
      </section>
    </main>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
