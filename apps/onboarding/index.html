<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f8fb">
  <meta name="color-scheme" content="light">
  <title>Kom i gang · Blindleia Darts</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <header class="brandline">
        <div class="brand-badge" aria-hidden="true">
          <img src="../static/club-logos/blindleia-dartklubb-logo.png" alt="">
        </div>
        <div class="brand-copy">
          <p class="eyebrow">Blindleia Darts</p>
          <strong>Spillerkonto</strong>
        </div>
      </header>

      <div class="intro-block">
        <span class="step-pill">Kom i gang</span>
        <h1 id="title">Aktiver kontoen din</h1>
        <p id="intro" class="muted" aria-live="polite">Kontrollerer invitasjonslenken …</p>
      </div>

      <div id="message" class="message hidden" role="alert" aria-live="assertive"></div>

      <form id="onboardingForm" class="form hidden" novalidate>
        <div id="nameFields" class="name-fields hidden">
          <div class="field-group">
            <label for="firstName">Fornavn</label>
            <input id="firstName" type="text" autocomplete="given-name" maxlength="100">
          </div>
          <div class="field-group">
            <label for="lastName">Etternavn</label>
            <input id="lastName" type="text" autocomplete="family-name" maxlength="120">
          </div>
        </div>

        <div class="field-group">
          <label for="email">E-postadresse</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
          <small>Dette blir e-postadressen du logger inn med.</small>
        </div>

        <div class="field-group">
          <label for="password">Velg passord</label>
          <div class="password-field">
            <input id="password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="passwordHelp">
            <button class="visibility-toggle" type="button" data-toggle-password="password" aria-label="Vis passord" aria-pressed="false">Vis</button>
          </div>
        </div>

        <div class="field-group">
          <label for="passwordConfirm">Gjenta passord</label>
          <div class="password-field">
            <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="10" required>
            <button class="visibility-toggle" type="button" data-toggle-password="passwordConfirm" aria-label="Vis gjentatt passord" aria-pressed="false">Vis</button>
          </div>
        </div>

        <div id="passwordHelp" class="requirements" aria-live="polite">
          <span id="passwordLengthCheck">Minst 10 tegn</span>
          <span id="passwordMatchCheck">Passordene er like</span>
        </div>

        <button id="submitButton" class="primary-action" type="submit">Send inn</button>
        <p id="formNote" class="form-note"></p>
      </form>

      <div id="success" class="success hidden" tabindex="-1">
        <div class="success-mark" aria-hidden="true">✓</div>
        <p class="eyebrow">Ferdig</p>
        <h2 id="successTitle">Registreringen er sendt inn</h2>
        <p id="successText">Klubben kobler registreringen til medlemskapet ditt.</p>
        <a id="successLink" class="primary-action" href="../player/#profile">Gå til Min side</a>
      </div>
    </section>
  </main>
  <script src="./app.js?v=20260826-1845" type="module"></script>
</body>
</html>
