name: Scolia Queue Virtual Test

on:
  workflow_dispatch:

permissions:
  contents: read

# Automatic DB-stress validation now runs the queue test after the mixed-load
# test in one serialized workflow. This standalone workflow remains available
# for targeted manual diagnosis and shares the same DB concurrency group.
concurrency:
  group: shared-db-ci
  cancel-in-progress: false

jobs:
  virtual-queue:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: PHP syntax check
        run: |
          php -l apps/api/src/Support/Config.php
          php -l apps/api/src/Support/DatabaseConnectionGate.php
          php -l infra/deploy/generate_api_config.php
          php -l infra/sql/scolia_queue_virtual_test.php

      - name: Wait for matching TEST release
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 60); do
            release="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq "$EXPECTED_SHA" <<<"$release"; then
              echo "Matching TEST release is live."
              exit 0
            fi
            sleep 5
          done
          echo "Virtual queue test refused to compete with an in-flight TEST deploy." >&2
          exit 1

      - name: Migrate isolated TEST database
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.CI_DB_USERNAME || secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Generate isolated TEST API config
        run: php infra/deploy/generate_api_config.php --output=apps/api/config.php
        env:
          APP_ENV: test
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          STATIC_BASE_URL: ${{ vars.TEST_STATIC_BASE_URL || vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          SCREEN_DEFAULT_CLUB_SLUG: blindleia-dartklubb
          REALTIME_WEBSOCKET_URL: ''
          REALTIME_PUBLISH_URL: ''
          REALTIME_PUBLISH_SECRET: ''
          SCOLIA_BRIDGE_SECRET: virtual-test-only
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.CI_DB_USERNAME || secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_test_
          HARDWARE_TABLE_PREFIX: bd_test_
          DB_MAX_CONCURRENT_CONNECTIONS: '1'
          DB_CONNECTION_SLOT_START: '8'
          DB_CONNECTION_WAIT_MS: '15000'
          MEMBERS_SQLCONNECT_PATH: /tmp/unused-members-sqlconnect.php
          CHALLONGE_CLIENT_ID: ''
          CHALLONGE_CLIENT_SECRET: ''
          CHALLONGE_DEFAULT_SCOPES: ''
          CHALLONGE_REDIRECT_URI: ''

      - name: Run 10-board virtual Scolia queue test
        run: php infra/sql/scolia_queue_virtual_test.php
