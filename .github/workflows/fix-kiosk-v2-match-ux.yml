name: Fix Kiosk v2 match UX

on:
  push:
    branches: [fix/kiosk-v2-match-ux]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kiosk-v2-match-ux
          fetch-depth: 0
      - name: Apply kiosk UX parity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/platform-v2/src/kiosk/KioskWorkspace.tsx')
          s = p.read_text()

          def repl(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              s = s.replace(old, new, 1)

          repl(
              '<PlayerTile player={match.player_a} active={playerAActive} preview={playerAActive ? preview : null} /><div className="vs-mark">Leg {match.current_leg || 1}</div><PlayerTile player={match.player_b} active={playerBActive} preview={playerBActive ? preview : null} />',
              '<PlayerTile player={match.player_a} active={playerAActive} /><div className="vs-mark">Leg {match.current_leg || 1}</div><PlayerTile player={match.player_b} active={playerBActive} />',
              'static player score tiles',
          )
          repl(
              'score={score} busy={busy} onMode={onMode}',
              'score={score} preview={preview} busy={busy} onMode={onMode}',
              'manual preview prop',
          )
          repl(
              'function ManualScoreSurface({ throwing, inputMode, multiplier, darts, score, busy, onMode, onMultiplier, onDart, onDartBack, onDartSubmit, onScore, onSubmit }: {\n  throwing: PlayerScore | null;\n  inputMode: InputMode;\n  multiplier: Multiplier;\n  darts: ManualDart[];\n  score: string;\n  busy: boolean;',
              'function ManualScoreSurface({ throwing, inputMode, multiplier, darts, score, preview, busy, onMode, onMultiplier, onDart, onDartBack, onDartSubmit, onScore, onSubmit }: {\n  throwing: PlayerScore | null;\n  inputMode: InputMode;\n  multiplier: Multiplier;\n  darts: ManualDart[];\n  score: string;\n  preview: RemainingPreview | null;\n  busy: boolean;',
              'manual surface signature',
          )
          repl(
              '<div className="panel-head scoring-head"><div><h3>{throwing?.display_name || "Registrer kast"}</h3><p>{inputMode === "sum" ? "Sum for tre piler" : `Per pil · sum ${dartTotal}`}</p></div><div className="manual-mode-switch">',
              '<div className="panel-head scoring-head"><div><h3>Registrer kast</h3><p>{inputMode === "sum" ? "Sum for tre piler" : `Per pil · sum ${dartTotal}`}</p></div>{preview && <div className={`score-after-preview ${preview.state}`}><span>{preview.state === "bust" ? "Bust · scoren står" : preview.state === "checkout" ? "Checkout" : "Etter kast"}</span><strong>{preview.remaining}</strong></div>}<div className="manual-mode-switch">',
              'remove duplicate player name',
          )
          repl(
              'function PlayerTile({ player, active, preview }: { player: PlayerScore; active: boolean; preview?: RemainingPreview | null }) {\n  const remaining = active && preview ? preview.remaining : player.remaining;\n  const footer = active && preview\n    ? preview.state === "bust"\n      ? "Bust · scoren står"\n      : preview.state === "checkout"\n        ? "Checkout"\n        : "Igjen · live"\n    : `${player.legs_won} legs`;\n  return <article className={`player-tile ${active ? "active" : ""}`}><p>{active ? "Kaster" : `${player.legs_won} legs`}</p><h2>{player.display_name}</h2><div className="remaining">{remaining}</div><p>{footer}</p></article>;\n}',
              'function PlayerTile({ player, active }: { player: PlayerScore; active: boolean }) {\n  return <article className={`player-tile ${active ? "active" : ""}`}><p>{active ? "Kaster" : `${player.legs_won} legs`}</p><h2>{player.display_name}</h2><div className="remaining">{player.remaining}</div><p>{player.legs_won} legs</p></article>;\n}',
              'canonical player tile',
          )

          p.write_text(s)

          p = Path('apps/platform-v2/src/kiosk/main.tsx')
          s = p.read_text()
          s = s.replace('import { RecentVisitEditor } from "./RecentVisitEditor";\n', '')
          s = s.replace('import "./recent-visit-editor.css";\n', '')
          s = s.replace('        <KioskWorkspace />\n        <RecentVisitEditor />', '        <KioskWorkspace />')
          p.write_text(s)

          p = Path('apps/platform-v2/src/kiosk/kiosk-tablet.css')
          s = p.read_text()
          old = '''.visits {\n  flex: 0 0 68px;\n  min-height: 0;\n  height: 68px;\n  margin-top: 6px;\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 5px;\n  overflow: hidden;\n}'''
          new = '''.visits {\n  flex: 0 0 68px;\n  min-height: 0;\n  height: 68px;\n  margin-top: 6px;\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 5px;\n  overflow: hidden;\n}'''
          if old not in s:
              raise SystemExit('visits grid anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('\n.visit:nth-child(n+4) {\n  display: none;\n}\n', '\n')
          p.write_text(s)

          p = Path('apps/platform-v2/src/kiosk/kiosk-interactions.css')
          s = p.read_text()
          s += r'''

/* Keep canonical match score fixed while typing. Pending score is previewed only in scoring controls. */
.score-after-preview {
  flex: 0 0 auto;
  min-width: 104px;
  display: grid;
  grid-template-columns: auto auto;
  align-items: baseline;
  gap: 5px;
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f6fafc;
  white-space: nowrap;
}
.score-after-preview span {
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.score-after-preview strong { font-size: 20px; line-height: 1; }
.score-after-preview.bust { border-color: #efc6c2; background: #fff6f5; }
.score-after-preview.checkout { border-color: #a8d5bc; background: #f1fbf5; }
@media (orientation: portrait) and (max-width: 600px) {
  .score-after-preview { min-width: 86px; padding: 4px 6px; }
  .score-after-preview span { font-size: 8px; }
  .score-after-preview strong { font-size: 18px; }
}
'''
          p.write_text(s)
          PY

          rm -f apps/platform-v2/src/kiosk/RecentVisitEditor.tsx apps/platform-v2/src/kiosk/recent-visit-editor.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/platform-v2/src/kiosk
          git commit -m "Fix Kiosk v2 match scoring UX"
          git push origin HEAD:fix/kiosk-v2-match-ux
