name: Backend v2 Equipment PROD Post-deploy

on:
  push:
    branches:
      - develop
    paths:
      - '.github/prod-release-request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-v2-equipment-prod-postdeploy
  cancel-in-progress: false

jobs:
  verify-prod-frontdoor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4

      - name: Resolve expected release
        id: request
        run: |
          set -Eeuo pipefail
          test -f .github/prod-release-request
          sha="$(awk -F= '$1=="release_sha" {print $2}' .github/prod-release-request | tail -1 | tr -d '[:space:]')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify PROD Render is exact and write-armed
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
          HOST_URL: https://blindleia-backend-v2-readonly.onrender.com
        run: |
          set -Eeuo pipefail
          health="$(curl -fsS --max-time 30 "${HOST_URL%/}/health")"
          jq -e --arg sha "$EXPECTED_SHA" '.ok == true and .environment == "prod" and .mode == "prod-canary" and .writes_armed == true and .runtime_prefix == "bd_prod_" and .identity_prefix == "bd_prod_" and .hardware_prefix == "bd_prod_" and .max_connections == 1 and .connection_mode == "idle-reuse" and .release_sha == $sha' <<<"$health" >/dev/null
          ready="$(curl -fsS --max-time 30 "${HOST_URL%/}/ready")"
          jq -e '.ok == true and .environment == "prod" and .writes_armed == true and (.checked_tables | type == "array") and (.checked_tables | length > 0)' <<<"$ready" >/dev/null

      - name: Wait for exact canonical PROD release
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
          PROD_BASE_URL: https://blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          root="${PROD_BASE_URL%/}"
          for attempt in $(seq 1 90); do
            release="$(curl -fsS --max-time 20 "$root/release.json?cb=$RANDOM" || true)"
            if jq -e --arg sha "$EXPECTED_SHA" '.environment == "prod" and .sha == $sha' <<<"$release" >/dev/null 2>&1; then
              echo 'Exact production release is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Canonical PROD did not publish the requested release in time.' >&2
          exit 1

      - name: Verify canonical equipment frontdoor uses Node
        env:
          PROD_BASE_URL: https://blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          root="${PROD_BASE_URL%/}"
          clubs="$(curl -fsS --max-time 30 "$root/api/v1/clubs")"
          club_id="$(jq -r '.data.items[] | select(.slug == "blindleia-dartklubb") | .id' <<<"$clubs" | head -n1)"
          test -n "$club_id" && [[ "$club_id" != "null" ]]

          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          status="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$root/api/v1/clubs/$club_id/kiosks")"
          [[ "$status" == "200" ]]
          grep -Eiq '^x-bd-backend-v2:[[:space:]]*equipment' "$headers"
          jq -e '.ok == true and (.data.items | type == "array")' "$body" >/dev/null
          echo 'Canonical PROD equipment frontdoor is served by backend-v2.'
