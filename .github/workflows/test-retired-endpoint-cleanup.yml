name: Cleanup Retired TEST Endpoints

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/test-retired-endpoint-cleanup.yml'
      - 'infra/tests/test_retired_endpoint_cleanup_contract.mjs'
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify TEST-only cleanup contract
        run: node infra/tests/test_retired_endpoint_cleanup_contract.mjs

  cleanup:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Wait for matching Deploy Test success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-test.yml/runs?head_sha=${EXPECTED_SHA}&per_page=10"
          for attempt in $(seq 1 120); do
            runs="$(curl -fsS --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            conclusion="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .conclusion // empty' <<<"$runs")"
            status="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .status // empty' <<<"$runs")"
            if [[ "$conclusion" == "success" ]]; then
              release="$(curl -fsS --max-time 15 "${BASE_URL%/}/release.json?cb=$RANDOM")"
              grep -Fq "$EXPECTED_SHA" <<<"$release"
              exit 0
            fi
            if [[ "$status" == "completed" && -n "$conclusion" ]]; then
              echo "Matching Deploy Test completed with conclusion: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for successful Deploy Test for $EXPECTED_SHA" >&2
          exit 1

      - name: Install SFTP client
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Remove retired TEST PHP endpoints
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SFTP_HOST"
          test -n "$SFTP_USERNAME"
          test -n "$SFTP_PASSWORD"

          sshpass -p "$SFTP_PASSWORD" sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -P 22 \
            "$SFTP_USERNAME@$SFTP_HOST" <<'SFTP'
          -rm /www/blindleiadarts/test/api/kiosk-scolia-test-lease.php
          -rm /www/blindleiadarts/test/api/scolia-bridge-control.php
          bye
          SFTP

      - name: Verify retired endpoints are gone
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for path in \
            /api/kiosk-scolia-test-lease.php \
            /api/scolia-bridge-control.php
          do
            status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$base$path" || true)"
            if [[ "$status" != "404" ]]; then
              echo "Retired endpoint still reachable: $path returned HTTP ${status:-unknown}" >&2
              exit 1
            fi
          done
