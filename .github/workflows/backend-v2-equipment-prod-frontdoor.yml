name: Backend v2 Equipment PROD Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'apps/backend-v2/**'
      - 'infra/deploy/generate_api_config.php'
      - '.github/workflows/backend-v2-equipment-prod-frontdoor.yml'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: srv-dahq6o142hec73a1dr10
  HOST_URL: https://blindleia-backend-v2-readonly.onrender.com
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prod-frontdoor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Verify PROD routing contract
        env:
          SCOLIA_BRIDGE_SECRET: unit-test-prod-token
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: prod
          DB_USERNAME: prod
          DB_PASSWORD: prod
        run: |
          set -Eeuo pipefail
          php -l infra/deploy/generate_api_config.php
          APP_ENV=prod BASE_URL=https://blindleiadart.ingenting.org STATIC_BASE_URL=https://blindleiadart.ingenting.org \
            DB_TABLE_PREFIX=bd_prod_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            php infra/deploy/generate_api_config.php --output=/tmp/equipment-prod.php
          php -r '$c=require "/tmp/equipment-prod.php"; $b=$c["backend_v2"]??[]; if (($b["equipment_routing_mode"]??null)!=="node") exit(1); if (($b["scoring_routing_mode"]??null)!=="candidate") exit(1); if (($b["base_url"]??null)!=="https://blindleia-backend-v2-readonly.onrender.com") exit(1);'
          grep -Fq "!\$proxy->handles('DELETE', '/v1/clubs/1/kiosks/9')" apps/api/tests/backend_v2_equipment_proxy_routing_test.php

      - name: Validate PROD Render bootstrap secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INTERNAL_TOKEN: ${{ secrets.SCOLIA_BRIDGE_SECRET }}
        run: |
          set -Eeuo pipefail
          for name in RENDER_API_KEY DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD INTERNAL_TOKEN; do
            test -n "${!name}" || { echo "$name is required for PROD backend-v2." >&2; exit 1; }
          done

      - name: Configure guarded PROD backend on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INTERNAL_TOKEN: ${{ secrets.SCOLIA_BRIDGE_SECRET }}
        run: |
          set -Eeuo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          update_env() {
            local key="$1" value="$2"
            curl --fail --silent --show-error --output /dev/null \
              -X PUT "$api/$key" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg value "$value" '{value:$value}')"
          }
          update_env BD_APP_ENV prod
          update_env BD_BACKEND_V2_MODE prod-canary
          update_env BD_BACKEND_V2_PROD_WRITE_CONFIRMATION ALLOW_PROD_SCORING_WRITES
          update_env BD_BACKEND_V2_INTERNAL_TOKEN "$INTERNAL_TOKEN"
          update_env DB_HOST "$DB_HOST"
          update_env DB_PORT "$DB_PORT"
          update_env DB_NAME "$DB_NAME"
          update_env DB_USERNAME "$DB_USERNAME"
          update_env DB_PASSWORD "$DB_PASSWORD"
          update_env DB_TABLE_PREFIX bd_prod_
          update_env IDENTITY_TABLE_PREFIX bd_prod_
          update_env HARDWARE_TABLE_PREFIX bd_prod_
          update_env BD_BACKEND_V2_MAX_CONNECTIONS 1
          update_env BD_BACKEND_V2_DB_IDLE_MS 15000
          update_env RELEASE_SHA "$RELEASE_SHA"

      - name: Deploy exact candidate to guarded PROD backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -Eeuo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error --output "$response" \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg commitId "$RELEASE_SHA" '{clearCache:"do_not_clear",commitId:$commitId}')"
          test -n "$(jq -r '.id // empty' "$response")"

      - name: Verify exact guarded PROD backend readiness
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 60); do
            health="$(curl -fsS --max-time 20 "${HOST_URL%/}/health" || true)"
            if jq -e --arg sha "$RELEASE_SHA" '.ok == true and .environment == "prod" and .mode == "prod-canary" and .writes_armed == true and .runtime_prefix == "bd_prod_" and .identity_prefix == "bd_prod_" and .hardware_prefix == "bd_prod_" and .max_connections == 1 and .connection_mode == "idle-reuse" and .release_sha == $sha' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          health="$(curl -fsS --max-time 20 "${HOST_URL%/}/health")"
          jq -e --arg sha "$RELEASE_SHA" '.ok == true and .environment == "prod" and .mode == "prod-canary" and .writes_armed == true and .runtime_prefix == "bd_prod_" and .identity_prefix == "bd_prod_" and .hardware_prefix == "bd_prod_" and .max_connections == 1 and .connection_mode == "idle-reuse" and .release_sha == $sha' <<<"$health" >/dev/null
          ready="$(curl -fsS --max-time 20 "${HOST_URL%/}/ready")"
          jq -e '.ok == true and .environment == "prod" and .mode == "prod-canary" and .writes_armed == true and (.checked_tables | type == "array") and (.checked_tables | length > 0)' <<<"$ready" >/dev/null
          echo 'PROD backend-v2 is exact, write-armed, one-slot and ready on bd_prod_.'
