name: Backend v2 Equipment PROD Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'apps/backend-v2/**'
      - 'infra/deploy/generate_api_config.php'
      - '.github/workflows/backend-v2-equipment-prod-frontdoor.yml'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-frontdoor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Verify PROD routing contract without deploying PROD
        env:
          SCOLIA_BRIDGE_SECRET: unit-test-prod-token
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: prod
          DB_USERNAME: prod
          DB_PASSWORD: prod
        run: |
          set -Eeuo pipefail
          php -l infra/deploy/generate_api_config.php
          APP_ENV=prod BASE_URL=https://blindleiadart.ingenting.org STATIC_BASE_URL=https://blindleiadart.ingenting.org \
            DB_TABLE_PREFIX=bd_prod_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            php infra/deploy/generate_api_config.php --output=/tmp/equipment-prod.php
          php -r '$c=require "/tmp/equipment-prod.php"; $b=$c["backend_v2"]??[]; if (($b["equipment_routing_mode"]??null)!=="node") exit(1); if (($b["scoring_routing_mode"]??null)!=="candidate") exit(1); if (($b["base_url"]??null)!=="https://blindleia-backend-v2-readonly.onrender.com") exit(1);'
          php apps/api/tests/backend_v2_equipment_proxy_routing_test.php
          grep -Fq "['DELETE', '/v1/clubs/1/kiosks/9']" apps/api/tests/backend_v2_equipment_proxy_routing_test.php
          echo 'PROD equipment routing contract verified. No PROD deploy or environment mutation is performed by this PR gate.'
