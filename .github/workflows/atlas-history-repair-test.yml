name: Repair Atlas History Lifecycle Test

on:
  push:
    branches:
      - develop
    paths:
      - infra/sql/run-atlas-history-repair-test.flag
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-history-repair-test
  cancel-in-progress: false

jobs:
  repair:
    name: Repair ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - name: "Mandagsserien #1"
            external_id: fpC4m4hIZdjZ
            expected_matches: 63
            expected_players: 16
          - name: "Mandagsserien #2"
            external_id: FHHAnnuO8txa
            expected_matches: 49
            expected_players: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Lint Atlas history tools
        run: |
          php -l infra/sql/atlas_history_verify.php
          php -l infra/sql/atlas_history_finalize.php
          php -l infra/sql/atlas_history_lifecycle_verify.php

      - name: Verify complete source data before lifecycle repair
        run: >-
          php infra/sql/atlas_history_verify.php
          --external='${{ matrix.external_id }}'
          --expected-matches='${{ matrix.expected_matches }}'
          --expected-players='${{ matrix.expected_players }}'
          --phase=data
          --require-visits=1
          --require-playoff=1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Finalize historical tournament lifecycle
        run: php infra/sql/atlas_history_finalize.php --external='${{ matrix.external_id }}'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Strictly verify data after repair
        run: >-
          php infra/sql/atlas_history_verify.php
          --external='${{ matrix.external_id }}'
          --expected-matches='${{ matrix.expected_matches }}'
          --expected-players='${{ matrix.expected_players }}'
          --phase=final
          --require-visits=1
          --require-playoff=1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify canonical lifecycle after repair
        run: php infra/sql/atlas_history_lifecycle_verify.php --external='${{ matrix.external_id }}'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
