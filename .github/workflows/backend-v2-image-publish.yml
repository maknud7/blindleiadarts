name: Backend v2 Image Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/**'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/backend-v2-image-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-v2-image-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blindleia-backend-v2" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend-v2/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE }}:develop
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Blindleia Backend v2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "### Backend v2 container candidate"
            echo
            echo "Immutable image: \`${IMAGE}:${SHA_TAG}\`"
            echo
            echo "This workflow only publishes a candidate image. It does not deploy it or enable PROD writes."
          } >> "$GITHUB_STEP_SUMMARY"
