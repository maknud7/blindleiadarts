name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject removed provider references
        run: |
          removed_provider="$(printf '%s%s' 'darts' 'atlas')"
          if git grep -n -i -E "${removed_provider}(\.com)?" -- .; then
            echo "Removed provider reference found in repository."
            exit 1
          fi

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: PHP syntax check
        run: |
          find apps packages infra -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Tournament group engine checks
        run: php infra/tests/tournament_group_service_test.php

      - name: Single elimination bracket checks
        run: php infra/tests/single_elimination_service_test.php

      - name: Canonical 501 scoring rules
        run: php apps/api/tests/dart501_rules_test.php

      - name: Mandagsserien ELO rules
        run: php infra/tests/elo_calculator_test.php

      - name: JavaScript syntax check
        run: |
          find apps packages/ui-assets -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Email-only auth surface check
        run: |
          set -Eeuo pipefail
          grep -Fq 'type="email" placeholder="E-postadresse"' apps/player/index.html
          grep -Fq '<span>E-postadresse</span>' apps/admin/index.html
          grep -Fq 'id="passwordResetEmail" type="email"' packages/ui-assets/password-reset.js
          if grep -Fq 'Brukernavn eller e-post' packages/ui-assets/password-reset.js; then
            echo 'Password reset still exposes username as a login concept.'
            exit 1
          fi

      - name: UX information architecture check
        run: |
          set -Eeuo pipefail
          grep -Fq '>Personer</a>' apps/admin/index.html
          grep -Fq '>Utstyr</a>' apps/admin/index.html
          grep -Fq '>Innstillinger</a>' apps/admin/index.html
          if grep -Fq 'href="#screens"' apps/admin/index.html; then
            echo 'Live screens must live under Utstyr, not as a separate admin menu.'
            exit 1
          fi
          grep -Fq '>Min profil</a>' apps/player/index.html
          grep -Fq '>Ranking</a>' apps/player/index.html
          grep -Fq 'data-tr-view="matches"' apps/admin/admin-ux.js
          grep -Fq 'Neste anbefalte steg' apps/admin/admin-ux.js
          grep -Fq 'Akkurat nå' apps/player/player-ux.js

      - name: Public live and first-party activity check
        run: |
          set -Eeuo pipefail
          grep -Fq 'blindleia-dartklubb' apps/live/app.js
          grep -Fq '/public/clubs/' apps/live/app.js
          grep -Fq 'href="../live/"' apps/admin/admin-ux.js
          grep -Fq 'ActivityApplication' apps/api/index.php
          grep -Fq 'v1/activity' apps/api/src/ActivityApplication.php
          grep -Fq 'activity_events' infra/sql/migrations/0043_create_activity_events.sql
          grep -Fq 'DEFAULT_CLUB_SLUG = "blindleia-dartklubb"' packages/ui-assets/activity.js
          grep -Fq 'MIN_REQUEST_GAP_MS = 30000' packages/ui-assets/activity.js
          grep -Fq 'BACKOFF_429_MS = 5 * 60 * 1000' packages/ui-assets/activity.js
          grep -Fq '__blindleiaActivityInstalled' packages/ui-assets/activity.js
          grep -Fq 'if (changed)' packages/ui-assets/portal-menu.js
          grep -Fq 'activityLoadPromise' apps/admin/activity-admin.js
          if grep -Fq 'document.addEventListener("click", trackClick' packages/ui-assets/activity.js; then
            echo 'Activity tracker must not log every generic click.'
            exit 1
          fi
          if grep -Ei 'document\.cookie|localStorage\.setItem\([^)]*(visitor|analytics|tracking|activity)' packages/ui-assets/activity.js; then
            echo 'First-party activity tracker must not create an anonymous persistent identifier.'
            exit 1
          fi

      - name: Cross-surface visual UX check
        run: |
          set -Eeuo pipefail
          grep -Fq 'portal-brand.css' packages/ui-assets/portal-menu.js
          grep -Fq 'viewport-fit=cover' apps/onboarding/index.html
          grep -Fq 'data-toggle-password' apps/onboarding/index.html
          grep -Fq 'mobile-portal.css' packages/ui-assets/portal-menu.js
          grep -Fq 'viewport-fit=cover' apps/live/index.html
          grep -Fq 'blindleia-dartklubb-logo.png' apps/live/index.html
          grep -Fq 'screen-ux.css' apps/screen/index.html
          if grep -Fq 'Skive = kiosk' apps/screen/index.html; then
            echo 'Venue screen exposes technical implementation language.'
            exit 1
          fi

      - name: Portrait tablet kiosk contract check
        run: |
          set -Eeuo pipefail
          grep -Fq '"orientation": "portrait"' apps/kiosk/manifest.webmanifest
          grep -Fq './brand-light.css' apps/kiosk/index.html
          grep -Fq './tablet-portrait.css' apps/kiosk/index.html
          grep -Fq 'overflow: hidden' apps/kiosk/tablet-portrait.css
          grep -Fq 'height: 100dvh' apps/kiosk/tablet-portrait.css
          grep -Fq 'tablet-portrait.css' apps/kiosk/service-worker.js
          if grep -Fq '"orientation": "landscape"' apps/kiosk/manifest.webmanifest; then
            echo 'Kiosk must be portrait-first.'
            exit 1
          fi

      - name: Release package smoke test
        run: |
          bash infra/deploy/build-release.sh test
          test -f dist/test/api/src/EmailAuthApplication.php
          test -f dist/test/api/src/PasswordResetApplication.php
          test -f dist/test/api/src/SeasonApplication.php
          test -f dist/test/api/src/Repository/SeasonRepository.php
          test -f dist/test/api/src/ActivityApplication.php
          test -f dist/test/api/src/Repository/ActivityRepository.php
          test -f dist/test/admin/season-admin.js
          test -f dist/test/admin/admin-ux.js
          test -f dist/test/admin/admin-ux.css
          test -f dist/test/admin/activity-admin.js
          test -f dist/test/player/player-ux.js
          test -f dist/test/player/player-ux.css
          test -f dist/test/onboarding/index.html
          test -f dist/test/onboarding/styles.css
          test -f dist/test/onboarding/app.js
          test -f dist/test/live/index.html
          test -f dist/test/live/styles.css
          test -f dist/test/screen/index.html
          test -f dist/test/screen/screen-ux.css
          test -f dist/test/packages/ui-assets/mobile-portal.css
          test -f dist/test/packages/ui-assets/portal-brand.css
          test -f dist/test/packages/ui-assets/activity.js
          test -f dist/test/kiosk/manifest.webmanifest
          test -f dist/test/kiosk/service-worker.js
          test -f dist/test/kiosk/install.js
          test -f dist/test/kiosk/admin-mode.js
          test -f dist/test/kiosk/brand-light.css
          test -f dist/test/kiosk/tablet-portrait.css
          grep -Fq '/packages/ui-assets/activity.js' dist/test/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/admin/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/player/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/live/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/screen/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/kiosk/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/onboarding/index.html
          grep -Fq '2201' dist/test/kiosk/admin-mode.js
          grep -Fq 'blindleia-dartklubb-logo.png' dist/test/kiosk/manifest.webmanifest
          grep -Fq '"orientation": "portrait"' dist/test/kiosk/manifest.webmanifest
