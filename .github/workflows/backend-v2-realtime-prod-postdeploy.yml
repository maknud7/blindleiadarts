name: Backend v2 Realtime Config PROD Post-deploy

on:
  push:
    branches:
      - develop
    paths:
      - '.github/prod-release-request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-v2-realtime-config-prod-postdeploy
  cancel-in-progress: false

jobs:
  verify-prod-frontdoor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4

      - name: Resolve expected release
        id: request
        run: |
          set -Eeuo pipefail
          test -f .github/prod-release-request
          sha="$(awk -F= '$1=="release_sha" {print $2}' .github/prod-release-request | tail -1 | tr -d '[:space:]')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify PROD backend realtime endpoint is ready
        env:
          HOST_URL: https://blindleia-backend-v2-readonly.onrender.com
        run: |
          set -Eeuo pipefail
          health="$(curl -fsS --max-time 30 "${HOST_URL%/}/health")"
          jq -e '.ok == true and .environment == "prod" and .mode == "prod-canary" and .runtime_prefix == "bd_prod_"' <<<"$health" >/dev/null
          payload="$(curl -fsS --max-time 30 "${HOST_URL%/}/v1/realtime/config")"
          jq -e '.ok == true and (.websocket_url | type == "string") and (.enabled | type == "boolean") and (.transport == (if .websocket_url != "" then "websocket" else "sse" end))' <<<"$payload" >/dev/null

      - name: Wait for exact canonical PROD release
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
          PROD_BASE_URL: https://blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          root="${PROD_BASE_URL%/}"
          for attempt in $(seq 1 90); do
            release="$(curl -fsS --max-time 20 "$root/release.json?cb=$RANDOM" || true)"
            if jq -e --arg sha "$EXPECTED_SHA" '.environment == "prod" and .sha == $sha' <<<"$release" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo 'Canonical PROD did not publish the requested release in time.' >&2
          exit 1

      - name: Verify canonical realtime config uses Node only
        env:
          PROD_BASE_URL: https://blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          root="${PROD_BASE_URL%/}"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          status="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$root/api/v1/realtime/config")"
          [[ "$status" == "200" ]]
          grep -Eiq '^x-bd-backend-v2:[[:space:]]*player-live' "$headers"
          jq -e '.ok == true and (.data.websocket_url | type == "string") and (.data.enabled | type == "boolean") and (.data.enabled == (.data.websocket_url != "")) and (.data.transport == (if .data.websocket_url != "" then "websocket" else "sse" end))' "$body" >/dev/null

          # Broad player/live remains on PHP in PROD. If this endpoint suddenly gets
          # the backend-v2 marker, the isolated cutover boundary has been violated.
          broad_headers="$(mktemp)"
          curl -sS --max-time 30 -D "$broad_headers" -o /dev/null "$root/api/v1/clubs"
          if grep -Eiq '^x-bd-backend-v2:[[:space:]]*player-live' "$broad_headers"; then
            echo 'Broad player/live routing unexpectedly moved to Node.' >&2
            rm -f "$broad_headers"
            exit 1
          fi
          rm -f "$broad_headers"
