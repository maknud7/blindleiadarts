name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA already verified on TEST
        required: true
      backup_confirmed:
        description: Confirm that a fresh production database backup exists
        required: true
        type: choice
        default: 'NO'
        options:
          - 'NO'
          - 'YES'
      migration_review_confirmed:
        description: Confirm reviewed pending PHP/data migrations if preflight requires it
        required: true
        type: choice
        default: 'NO'
        options:
          - 'NO'
          - 'YES'
  push:
    branches:
      - develop
    paths:
      - '.github/prod-release-request'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment request
        uses: actions/checkout@v4

      - name: Resolve and validate release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          INPUT_BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          INPUT_MIGRATION_REVIEW_CONFIRMED: ${{ inputs.migration_review_confirmed }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_sha="$INPUT_RELEASE_SHA"
            backup_confirmed="$INPUT_BACKUP_CONFIRMED"
            migration_review_confirmed="$INPUT_MIGRATION_REVIEW_CONFIRMED"
          else
            test -f .github/prod-release-request
            release_sha="$(awk -F= '$1=="release_sha" {print $2}' .github/prod-release-request | tail -1 | tr -d '[:space:]')"
            backup_confirmed="$(awk -F= '$1=="backup_confirmed" {print $2}' .github/prod-release-request | tail -1 | tr -d '[:space:]')"
            migration_review_confirmed="$(awk -F= '$1=="migration_review_confirmed" {print $2}' .github/prod-release-request | tail -1 | tr -d '[:space:]')"
          fi

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Production deployment requires an exact 40-character release SHA."
            exit 1
          fi
          if [[ "$backup_confirmed" != "YES" ]]; then
            echo "::error::Production deployment blocked: fresh database backup has not been confirmed."
            exit 1
          fi
          if [[ "$migration_review_confirmed" != "YES" && "$migration_review_confirmed" != "NO" ]]; then
            echo "::error::migration_review_confirmed must be YES or NO."
            exit 1
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "migration_review_confirmed=$migration_review_confirmed" >> "$GITHUB_OUTPUT"
          echo "Production release request accepted for $release_sha."

      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.release_sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Exact release candidate checked out: $actual"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Read-only production preflight gate
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_prod_
          MIGRATION_REVIEW_CONFIRMED: ${{ steps.request.outputs.migration_review_confirmed }}
        run: |
          set -o pipefail
          set +e
          php infra/sql/prod_preflight.php 2>&1 | tee prod-preflight.txt
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "Production preflight passed without migration review override."
            exit 0
          fi
          if [[ "$status" -eq 2 && "$MIGRATION_REVIEW_CONFIRMED" == "YES" ]]; then
            echo "Pending PHP/data migrations were explicitly reviewed and approved for this release."
            exit 0
          fi
          echo "Production deployment blocked by preflight (exit $status)." >&2
          exit "$status"

      - name: Verify release candidate is the exact TEST release
        env:
          TEST_BASE_URL: https://test.blindleiadart.ingenting.org
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          release="$(curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            "$TEST_BASE_URL/release.json?cb=$RANDOM")"
          php -r '
            $data=json_decode(stream_get_contents(STDIN),true);
            $expected=getenv("EXPECTED_SHA");
            if (!is_array($data) || ($data["environment"] ?? null)!=="test" || ($data["sha"] ?? null)!==$expected) {
                fwrite(STDERR,"Production release candidate is not the exact release currently verified on canonical TEST.\n");
                exit(1);
            }
            echo "TEST_RELEASE_MATCH=yes\n";
          ' <<<"$release"

      - name: Validate production config and shared credentials
        env:
          PROD_BASE_URL: https://blindleiadart.ingenting.org
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for name in PROD_BASE_URL DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD SFTP_HOST SFTP_USERNAME SFTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository is missing required production config/shared credential: ${name}"
              exit 1
            fi
          done
          echo "Production credentials/config present; canonical origin is $PROD_BASE_URL."

      - name: Run production database migrations
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_prod_

      - name: Build production release package
        run: bash infra/deploy/build-release.sh prod

      - name: Generate canonical production API config
        run: php infra/deploy/generate_api_config.php --output=dist/prod/api/config.php
        env:
          APP_ENV: prod
          BASE_URL: https://blindleiadart.ingenting.org
          IDENTITY_BASE_URL: https://blindleiadart.ingenting.org
          STATIC_BASE_URL: https://blindleiadart.ingenting.org
          SCREEN_DEFAULT_CLUB_SLUG: blindleia-dartklubb
          REALTIME_WEBSOCKET_URL: ${{ vars.PROD_REALTIME_WEBSOCKET_URL }}
          REALTIME_PUBLISH_URL: ${{ vars.PROD_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          SCOLIA_BRIDGE_SECRET: ${{ secrets.SCOLIA_BRIDGE_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_prod_
          IDENTITY_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
          MEMBERS_SQLCONNECT_PATH: /home/1/i/ingenting/dart/sqlconnect.php
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
          CHALLONGE_DEFAULT_SCOPES: ${{ vars.CHALLONGE_DEFAULT_SCOPES }}
          CHALLONGE_REDIRECT_URI: https://blindleiadart.ingenting.org/api/v1/connectors/challonge/callback

      - name: Validate canonical production package
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          grep -Fq "'base_url' => 'https://blindleiadart.ingenting.org'" dist/prod/api/config.php
          grep -Fq "'identity_base_url' => 'https://blindleiadart.ingenting.org'" dist/prod/api/config.php
          grep -Fq "'table_prefix' => 'bd_prod_'" dist/prod/api/config.php
          grep -Fq "'identity_table_prefix' => 'bd_prod_'" dist/prod/api/config.php
          grep -Fq "'hardware_table_prefix' => 'bd_prod_'" dist/prod/api/config.php
          grep -Fq "$EXPECTED_SHA" dist/prod/release.json
          test -f dist/prod/player/index.html
          test -f dist/prod/admin/index.html
          test -f dist/prod/kiosk/index.html
          test -f dist/prod/live/index.html

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Verify SFTP and ensure remote directories
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_ROOT: /www/blindleiadarts/prod
        run: |
          set -Eeuo pipefail
          {
            echo "-mkdir ${REMOTE_ROOT}"
            find dist/prod -type d | sed 's#^dist/prod##' | sed '/^$/d' | while read -r dir; do
              echo "-mkdir ${REMOTE_ROOT}${dir}"
            done
            echo "ls ${REMOTE_ROOT}"
            echo "quit"
          } > sftp-batch.txt
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -oBatchMode=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -b sftp-batch.txt "${SFTP_USERNAME}@${SFTP_HOST}"

      - name: Deploy production via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: ./dist/prod/*
          remote_path: /www/blindleiadarts/prod
          sftp_only: true
          rsyncArgs: --exclude=.git --exclude=.github --exclude=docs --exclude=infra/sql --exclude=release.json

      - name: Publish release marker last
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'put dist/prod/release.json /www/blindleiadarts/prod/release.json' \
            'quit' > sftp-release.txt
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -oBatchMode=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -b sftp-release.txt "${SFTP_USERNAME}@${SFTP_HOST}"

      - name: Verify exact canonical production release
        env:
          PROD_BASE_URL: https://blindleiadart.ingenting.org
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          root="${PROD_BASE_URL%/}"

          release="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
            "$root/release.json?cb=$RANDOM")"
          php -r '
            $data=json_decode(stream_get_contents(STDIN),true);
            $expected=getenv("EXPECTED_SHA");
            if (!is_array($data) || ($data["environment"] ?? null)!=="prod" || ($data["sha"] ?? null)!==$expected) {
                fwrite(STDERR,"Canonical production release marker does not match requested SHA.\n");
                exit(1);
            }
          ' <<<"$release"

          health="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            "$root/api/health.php?sha=$EXPECTED_SHA")"
          php -r '
            $data=json_decode(stream_get_contents(STDIN),true);
            $expected=getenv("EXPECTED_SHA");
            if (!is_array($data) || !($data["ok"] ?? false) || ($data["release"]["sha"] ?? null)!==$expected) {
                fwrite(STDERR,"Production internal health verification failed.\n");
                exit(1);
            }
          ' <<<"$health"

          for path in / /player/ /admin/ /kiosk/ /live/; do
            echo "VERIFY: $path"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 "$root$path" -o /dev/null
          done

          live_html="$(curl --fail --silent --show-error "$root/live/?cb=$RANDOM")"
          grep -Fq 'data-bd-surface="live"' <<<"$live_html"
          grep -Fq 'route-bootstrap.js' <<<"$live_html"

          echo "PRODUCTION_DEPLOYMENT_VERIFIED=yes"
          echo "PRODUCTION_SHA=$EXPECTED_SHA"
          echo "PRODUCTION_URL=$root"
