name: Backend v2 TEST Auth Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/src/mysql/identity-auth-repository.ts'
      - 'apps/backend-v2/src/server.ts'
      - 'apps/backend-v2/test/test-local-auth-sessions.test.mjs'
      - 'apps/api/index.php'
      - 'apps/api/config.example.php'
      - 'apps/api/src/Support/Config.php'
      - 'apps/api/src/BackendV2AccountMutationProxyApplication.php'
      - 'apps/api/tests/backend_v2_account_mutation_proxy_routing_test.php'
      - 'infra/deploy/generate_api_config.php'
      - 'infra/sql/migrations/0088_isolate_test_auth_sessions.php'
      - '.github/workflows/backend-v2-test-auth-frontdoor.yml'
  push:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/src/mysql/identity-auth-repository.ts'
      - 'apps/backend-v2/src/server.ts'
      - 'apps/backend-v2/test/test-local-auth-sessions.test.mjs'
      - 'apps/api/index.php'
      - 'apps/api/config.example.php'
      - 'apps/api/src/Support/Config.php'
      - 'apps/api/src/BackendV2AccountMutationProxyApplication.php'
      - 'apps/api/tests/backend_v2_account_mutation_proxy_routing_test.php'
      - 'infra/deploy/generate_api_config.php'
      - 'infra/sql/migrations/0088_isolate_test_auth_sessions.php'
      - '.github/workflows/backend-v2-test-auth-frontdoor.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install JavaScript toolchain
        run: npm ci

      - name: Build backend v2
        run: npm run backend-v2:build

      - name: Verify isolated TEST auth contract
        run: |
          set -Eeuo pipefail
          php -l apps/api/src/BackendV2AccountMutationProxyApplication.php
          php -l apps/api/src/Support/Config.php
          php -l infra/sql/migrations/0088_isolate_test_auth_sessions.php
          php apps/api/tests/backend_v2_account_mutation_proxy_routing_test.php
          node --test apps/backend-v2/test/test-local-auth-sessions.test.mjs
          grep -Fq 'BackendV2AccountMutationProxyApplication' apps/api/index.php
          grep -Fq "'account_mutation_routing_mode' => 'php'" apps/api/config.example.php

      - name: Verify generated TEST-only routing default
        env:
          DB_HOST: example.invalid
          DB_PORT: '3306'
          DB_NAME: example
          DB_USERNAME: example
          DB_PASSWORD: example
          SCOLIA_BRIDGE_SECRET: example-secret
        run: |
          set -Eeuo pipefail
          APP_ENV=test DB_TABLE_PREFIX=bd_test_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_             php infra/deploy/generate_api_config.php --output=/tmp/account-mutation-test.php
          APP_ENV=prod DB_TABLE_PREFIX=bd_prod_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_             php infra/deploy/generate_api_config.php --output=/tmp/account-mutation-prod.php
          php -r '$c=require "/tmp/account-mutation-test.php"; if (($c["backend_v2"]["account_mutation_routing_mode"]??null)!=="node") exit(1);'
          php -r '$c=require "/tmp/account-mutation-prod.php"; if (($c["backend_v2"]["account_mutation_routing_mode"]??null)!=="php") exit(1);'

  runtime-smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Wait for matching Deploy Test success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-test.yml/runs?head_sha=${EXPECTED_SHA}&per_page=10"
          for attempt in $(seq 1 120); do
            runs="$(curl -fsS --max-time 15               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "$api")"
            conclusion="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .conclusion // empty' <<<"$runs")"
            status="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .status // empty' <<<"$runs")"
            if [[ "$conclusion" == "success" ]]; then
              release="$(curl -fsS --max-time 15 "${BASE_URL%/}/release.json?cb=$RANDOM")"
              grep -Fq "$EXPECTED_SHA" <<<"$release"
              exit 0
            fi
            if [[ "$status" == "completed" && -n "$conclusion" ]]; then
              echo "Matching Deploy Test completed with conclusion: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for successful Deploy Test for $EXPECTED_SHA" >&2
          exit 1

      - name: Verify TEST account mutation frontdoor
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"

          probe() {
            method="$1"
            path="$2"
            data="$3"
            expected_status="$4"
            expected_code="$5"
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --max-time 30 -X "$method"               -H 'Content-Type: application/json'               -H 'Authorization: Bearer definitely-invalid-test-auth-probe'               -D "$headers" -o "$body" -w '%{http_code}'               --data "$data" "$base$path" || true)"
            echo "$method $path -> $status: $(cat "$body")"
            test "$status" = "$expected_status"
            grep -Eiq '^X-BD-Backend-V2:[[:space:]]*account-mutation' "$headers"
            code="$(jq -r '.error.code // empty' "$body")"
            test "$code" = "$expected_code"
            rm -f "$headers" "$body"
          }

          probe POST /api/v1/auth/login '{"email":"nobody@example.invalid","password":"wrong-password"}' 401 invalid_credentials
          probe PATCH /api/v1/me/profile '{"display_name":"Probe"}' 401 invalid_session
          probe POST /api/v1/me/password '{"current_password":"x","new_password":"12345678"}' 403 backend_v2_identity_write_blocked
          probe POST /api/v1/auth/password-reset/request '{"email":"nobody@example.invalid"}' 403 password_reset_prod_identity_only
