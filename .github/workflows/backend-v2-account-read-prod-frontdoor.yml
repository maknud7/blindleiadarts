name: Backend v2 Account Read PROD Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/src/server.ts'
      - 'apps/backend-v2/src/mysql/account-profile-repository.ts'
      - 'apps/backend-v2/src/mysql/identity-auth-repository.ts'
      - 'apps/backend-v2/src/mysql/membership-eligibility-repository.ts'
      - 'apps/api/src/BackendV2AccountReadProxyApplication.php'
      - 'apps/api/tests/backend_v2_account_read_proxy_routing_test.php'
      - 'infra/deploy/generate_api_config.php'
      - '.github/workflows/backend-v2-account-read-frontdoor.yml'
      - '.github/workflows/backend-v2-account-read-prod-frontdoor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-read-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Install JavaScript toolchain
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify backend-v2 account read build and PHP front door
        run: |
          set -Eeuo pipefail
          npm run backend-v2:typecheck
          npm run backend-v2:build
          php -l apps/api/src/BackendV2AccountReadProxyApplication.php
          php apps/api/tests/backend_v2_account_read_proxy_routing_test.php

      - name: Verify PROD routing contract without deploying PROD
        env:
          SCOLIA_BRIDGE_SECRET: account-read-prod-contract
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: prod
          DB_USERNAME: prod
          DB_PASSWORD: prod
        run: |
          set -Eeuo pipefail
          php -l infra/deploy/generate_api_config.php
          APP_ENV=prod BASE_URL=https://blindleiadart.ingenting.org STATIC_BASE_URL=https://blindleiadart.ingenting.org \
            DB_TABLE_PREFIX=bd_prod_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            php infra/deploy/generate_api_config.php --output=/tmp/account-read-prod.php
          php -r '$c=require "/tmp/account-read-prod.php"; $b=$c["backend_v2"]??[]; if (($b["account_read_routing_mode"]??null)!=="node") exit(1); if (($b["base_url"]??null)!=="https://blindleia-backend-v2-readonly.onrender.com") exit(2);'

      - name: Verify current readonly PROD backend against canonical identity schema
        env:
          HOST_URL: https://blindleia-backend-v2-readonly.onrender.com
        run: |
          set -Eeuo pipefail
          health="$(curl -fsS --max-time 30 "${HOST_URL%/}/health")"
          jq -e '.ok == true and .environment == "prod" and .mode == "prod-canary" and .writes_armed == false and .runtime_prefix == "bd_prod_" and .identity_prefix == "bd_prod_" and .hardware_prefix == "bd_prod_" and .max_connections <= 2 and .connection_mode == "idle-reuse"' <<<"$health" >/dev/null

          for path in \
            /v1/auth/me \
            /v1/me/profile \
            /v1/me/payments \
            /v1/me/eligibility
          do
            body="$(mktemp)"
            status="$(curl -sS --max-time 30 \
              -H 'Authorization: Bearer definitely-invalid-account-read-prod-probe' \
              -o "$body" -w '%{http_code}' "${HOST_URL%/}$path" || true)"
            echo "$path HTTP ${status:-unknown}: $(cat "$body")"
            if [[ "$status" != "401" ]]; then
              echo "$path is not ready on the readonly PROD backend." >&2
              rm -f "$body"
              exit 1
            fi
            error_code="$(jq -r '.error.code // empty' "$body" 2>/dev/null || true)"
            if [[ "$error_code" != "invalid_session" && "$error_code" != "authentication_required" ]]; then
              echo "$path did not return the expected backend-v2 authentication contract." >&2
              cat "$body" >&2
              rm -f "$body"
              exit 1
            fi
            rm -f "$body"
          done

          echo 'Readonly PROD account reads are reachable on canonical bd_prod_ with writes disabled.'
