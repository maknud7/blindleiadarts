name: Scolia Fallback Contract

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/kiosk/**'
      - 'infra/tests/scolia_fallback_manual_test.mjs'
      - '.github/workflows/scolia-fallback-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fallback manual submit bridge
        run: |
          set -Eeuo pipefail
          node --check apps/kiosk/scolia-fallback-manual.js
          node infra/tests/scolia_fallback_manual_test.mjs
          grep -Fq 'scolia-fallback-manual.js?v=20260905-test-runtime-01' apps/kiosk/index.html
          grep -Fq 'scolia-fallback-manual.js' apps/kiosk/service-worker.js
          grep -Fq 'bd-kiosk-shell-v43' apps/kiosk/service-worker.js
          grep -Fq 'if (url.pathname.includes("/api/") || url.pathname.endsWith(".php")) return;' apps/kiosk/service-worker.js
          grep -Fq '["script", "style"].includes(request.destination)' apps/kiosk/service-worker.js
