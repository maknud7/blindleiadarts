name: Import Verified Atlas Round Six To Production

on:
  push:
    branches: [develop]
    paths:
      - infra/sql/run-import-atlas-round-six-prod.flag

permissions:
  contents: read

concurrency:
  group: import-atlas-round-six-production
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEST_BASE_URL: https://test.blindleiadarts.ingenting.org
      PROD_BASE_URL: https://blindleiadarts.ingenting.org
      MANIFEST: infra/atlas/manifests/mandagsserien-2026-06.json
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout exact import commit
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Validate frozen round-six request
        run: |
          set -Eeuo pipefail
          grep -Fxq 'IMPORT_VERIFIED_ATLAS_ROUND_SIX_TO_PROD=yes' infra/sql/run-import-atlas-round-six-prod.flag
          php -l infra/sql/import_atlas_manifest_test.php
          php -l infra/sql/import_atlas_match_visits_test.php
          php -l infra/sql/atlas_history_verify.php
          php -l infra/sql/atlas_history_finalize.php
          php -l infra/sql/atlas_promote_test_history_to_prod.php
          php -r '
            $m=json_decode(file_get_contents(getenv("MANIFEST")),true,512,JSON_THROW_ON_ERROR);
            if(($m["tournament_external_id"]??"")!=="JaqLpRQCCeLi"||($m["season_external_id"]??"")!=="rFByCgOqI1rq")throw new RuntimeException("Wrong frozen source");
            if(($m["tournament_date"]??"")!=="2026-09-14"||($m["expected_players"]??0)!==7||($m["expected_matches"]??0)!==24||($m["expected_legs"]??0)!==27)throw new RuntimeException("Wrong frozen counts");
            $ids=[];foreach($m["groups"] as $g)foreach($g["match_ids"] as $id)$ids[]=$id;foreach($m["playoff"]["match_ids"] as $id)$ids[]=$id;
            if(count($ids)!==24||count(array_unique($ids))!==24||count($m["players"]??[])!==7)throw new RuntimeException("Frozen manifest is incomplete");
            if(($m["playoff"]["champion_external_id"]??"")!=="46u0DEjhFWti")throw new RuntimeException("Wrong champion");
            echo "ROUND6_MANIFEST_OK=yes\n";
          '

      - name: Fetch and validate round-six tournament source
        run: |
          set -Eeuo pipefail
          target=/tmp/round-six-probe.json
          fetched=no
          for attempt in $(seq 1 12); do
            status="$(curl -sS -L --connect-timeout 8 --max-time 120 -o "$target" -w '%{http_code}' "${TEST_BASE_URL%/}/api/atlas-tournament-probe.php?tournament=JaqLpRQCCeLi&cb=$RANDOM" || true)"
            if [[ "$status" == 200 ]] && php -r '
              $d=json_decode(file_get_contents($argv[1]),true);$p=$d["pages"]??[];
              exit(is_array($d)&&($d["ok"]??false)===true&&($p["root"]["status"]??0)===200&&($p["group-1"]["status"]??0)===200&&($p["results"]["status"]??0)===200?0:1);
            ' "$target"; then fetched=yes; break; fi
            echo "Retrying tournament probe: HTTP $status, attempt $attempt/12"
            sleep $((30 + attempt * 10))
          done
          [[ "$fetched" == yes ]] || { echo "Could not fetch complete round-six source." >&2; exit 1; }
          php -r '
            $d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$p=$d["pages"];
            $group=count($p["group-1"]["matches"]??[]);$playoff=count($p["results"]["matches"]??[]);$players=count($p["group-1"]["players"]??[]);
            if($group!==21||$playoff!==3||$players!==7)throw new RuntimeException("Source count drift: players={$players} group={$group} playoff={$playoff}");
            echo "ROUND6_SOURCE_OK=yes players={$players} matches=".($group+$playoff)."\n";
          ' "$target"

      - name: Import round-six skeleton into TEST
        env:
          DB_TABLE_PREFIX: bd_test_
        run: php infra/sql/import_atlas_manifest_test.php "$MANIFEST" /tmp/round-six-probe.json

      - name: Fetch every round-six leg and visit through TEST
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/round-six-matches
          mapfile -t ids < <(php -r '$m=json_decode(file_get_contents(getenv("MANIFEST")),true,512,JSON_THROW_ON_ERROR);foreach($m["groups"] as $g)foreach($g["match_ids"] as $id)echo $id,"\n";foreach($m["playoff"]["match_ids"] as $id)echo $id,"\n";')
          for id in "${ids[@]}"; do
            target="/tmp/round-six-matches/${id}.json"
            fetched=no
            for attempt in $(seq 1 10); do
              status="$(curl -sS -L --connect-timeout 8 --max-time 90 -o "$target" -w '%{http_code}' "${TEST_BASE_URL%/}/api/atlas-match-visits.php?match=${id}&cb=$RANDOM" || true)"
              if [[ "$status" == 200 ]] && php -r '$d=json_decode(file_get_contents($argv[1]),true);exit(is_array($d)&&($d["ok"]??false)===true&&($d["external_id"]??"")===$argv[2]?0:1);' "$target" "$id"; then fetched=yes; break; fi
              echo "Retrying $id: HTTP $status, attempt $attempt/10"
              sleep $((30 + attempt * 10))
            done
            [[ "$fetched" == yes ]] || { echo "Could not fetch verified match detail for $id." >&2; exit 1; }
            php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);printf("FETCHED_MATCH id=%s legs=%d visits=%d darts=%d\n",$d["external_id"],$d["leg_count"],$d["visit_count"],$d["darts_count"]);' "$target"
            sleep 12
          done
          php -r '
            $m=json_decode(file_get_contents(getenv("MANIFEST")),true,512,JSON_THROW_ON_ERROR);$ids=[];foreach($m["groups"] as $g)foreach($g["match_ids"] as $id)$ids[]=$id;foreach($m["playoff"]["match_ids"] as $id)$ids[]=$id;
            $legs=$visits=$darts=0;foreach($ids as $id){$d=json_decode(file_get_contents("/tmp/round-six-matches/{$id}.json"),true,512,JSON_THROW_ON_ERROR);$legs+=(int)$d["leg_count"];$visits+=(int)$d["visit_count"];$darts+=(int)$d["darts_count"];}
            if($legs!==27||$visits<48)throw new RuntimeException("Round-six detail drift: legs={$legs} visits={$visits}");
            echo "ROUND6_FETCH_OK=yes matches=24 legs={$legs} visits={$visits} darts={$darts}\n";
          '

      - name: Import canonical legs visits and statistics into TEST
        env:
          DB_TABLE_PREFIX: bd_test_
        run: |
          set -Eeuo pipefail
          mapfile -t ids < <(php -r '$m=json_decode(file_get_contents(getenv("MANIFEST")),true,512,JSON_THROW_ON_ERROR);foreach($m["groups"] as $g)foreach($g["match_ids"] as $id)echo $id,"\n";foreach($m["playoff"]["match_ids"] as $id)echo $id,"\n";')
          for id in "${ids[@]}"; do php infra/sql/import_atlas_match_visits_test.php "$MANIFEST" "/tmp/round-six-matches/${id}.json"; done

      - name: Verify and finalize canonical TEST round six
        env:
          DB_TABLE_PREFIX: bd_test_
        run: |
          set -Eeuo pipefail
          php infra/sql/atlas_history_verify.php --external=JaqLpRQCCeLi --expected-matches=24 --expected-players=7 --phase=data --require-visits=1 --require-playoff=1
          php infra/sql/atlas_history_finalize.php --external=JaqLpRQCCeLi
          php infra/sql/atlas_history_verify.php --external=JaqLpRQCCeLi --expected-matches=24 --expected-players=7 --phase=final --require-visits=1 --require-playoff=1
          php infra/sql/atlas_history_lifecycle_verify.php --external=JaqLpRQCCeLi

      - name: Freeze verified TEST totals
        env:
          DB_TABLE_PREFIX: bd_test_
        run: |
          set -Eeuo pipefail
          php -r '
            mysqli_report(MYSQLI_REPORT_ERROR|MYSQLI_REPORT_STRICT);$db=new mysqli(getenv("DB_HOST"),getenv("DB_USERNAME"),getenv("DB_PASSWORD"),getenv("DB_NAME"),(int)getenv("DB_PORT"));$p="bd_test_";$x="JaqLpRQCCeLi";
            $s=$db->prepare("SELECT internal_id FROM `{$p}external_references` WHERE external_system=\"dartsatlas\" AND external_entity_type=\"tournament\" AND external_id=? LIMIT 1");$s->bind_param("s",$x);$s->execute();$tid=(int)($s->get_result()->fetch_assoc()["internal_id"]??0);if($tid<1)throw new RuntimeException("Round six TEST ref missing");
            $players=(int)$db->query("SELECT COUNT(*) c FROM `{$p}tournament_players` WHERE tournament_id={$tid}")->fetch_assoc()["c"];$matches=(int)$db->query("SELECT COUNT(*) c FROM `{$p}matches` WHERE tournament_id={$tid}")->fetch_assoc()["c"];$legs=(int)$db->query("SELECT COUNT(*) c FROM `{$p}legs` l JOIN `{$p}matches` m ON m.id=l.match_id WHERE m.tournament_id={$tid}")->fetch_assoc()["c"];$visits=(int)$db->query("SELECT COUNT(*) c FROM `{$p}visits` v JOIN `{$p}matches` m ON m.id=v.match_id WHERE m.tournament_id={$tid}")->fetch_assoc()["c"];
            if($players!==7||$matches!==24||$legs!==27||$visits<48)throw new RuntimeException("Final TEST count drift");
            $promotion=["mode"=>"incremental_existing_season","source_prefix"=>"bd_test_","target_prefix"=>"bd_prod_","club_slug"=>"blindleia-dartklubb","season_external_id"=>"rFByCgOqI1rq","tournaments"=>[["external_id"=>$x,"name"=>"Mandagsserien #6","expected_players"=>$players,"expected_matches"=>$matches,"expected_legs"=>$legs,"expected_visits"=>$visits]],"expected_totals"=>["tournaments"=>1,"matches"=>$matches,"legs"=>$legs,"visits"=>$visits,"atlas_player_references"=>7]];
            file_put_contents("/tmp/round-six-promotion.json",json_encode($promotion,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));echo "ROUND6_TEST_FROZEN=yes tournament_id={$tid} players={$players} matches={$matches} legs={$legs} visits={$visits}\n";
          '

      - name: Guard canonical PROD before promotion
        env:
          DB_TABLE_PREFIX: bd_prod_
        run: |
          set -Eeuo pipefail
          php -r '
            mysqli_report(MYSQLI_REPORT_ERROR|MYSQLI_REPORT_STRICT);$db=new mysqli(getenv("DB_HOST"),getenv("DB_USERNAME"),getenv("DB_PASSWORD"),getenv("DB_NAME"),(int)getenv("DB_PORT"));$p="bd_prod_";
            $activeT=(int)$db->query("SELECT COUNT(*) c FROM `{$p}tournaments` WHERE status IN (\"ready\",\"in_progress\")")->fetch_assoc()["c"];$activeM=(int)$db->query("SELECT COUNT(*) c FROM `{$p}matches` WHERE status IN (\"pending\",\"assigned\",\"in_progress\")")->fetch_assoc()["c"];if($activeT!==0||$activeM!==0)throw new RuntimeException("Active PROD runtime exists");
            $present=["fpC4m4hIZdjZ","FHHAnnuO8txa","PvGa73emrY6e","jort2WSBWFwN","xPoP3xqp9n73"];$absent="JaqLpRQCCeLi";$s=$db->prepare("SELECT COUNT(*) c FROM `{$p}external_references` WHERE external_system=\"dartsatlas\" AND external_entity_type=\"tournament\" AND external_id=?");foreach($present as $x){$s->bind_param("s",$x);$s->execute();if((int)$s->get_result()->fetch_assoc()["c"]!==1)throw new RuntimeException("Missing canonical PROD tournament {$x}");}$s->bind_param("s",$absent);$s->execute();if((int)$s->get_result()->fetch_assoc()["c"]!==0)throw new RuntimeException("Round six is already present in PROD");
            $matches=(int)$db->query("SELECT COUNT(*) c FROM `{$p}matches`")->fetch_assoc()["c"];if($matches!==219)throw new RuntimeException("Existing PROD match total drift: {$matches}");
            $dups=(int)$db->query("SELECT COUNT(*) c FROM (SELECT club_id,LOWER(TRIM(display_name)) n FROM `{$p}players` WHERE is_active=1 AND merged_into_player_id IS NULL GROUP BY club_id,n HAVING COUNT(*)>1) x")->fetch_assoc()["c"];if($dups!==0)throw new RuntimeException("PROD active player duplicates remain: {$dups}");
            echo "ROUND6_PROD_PREFLIGHT_OK=yes history_matches={$matches}\n";
          '

      - name: Snapshot existing PROD tables
        env:
          DB_TABLE_PREFIX: bd_prod_
          ALLOW_PROD_SNAPSHOT_BACKUP: yes
        run: |
          set -Eeuo pipefail
          backup_prefix="bd_backup_$(date -u +%Y%m%d_%H%M%S)_"
          BACKUP_TABLE_PREFIX="$backup_prefix" php infra/sql/prod_snapshot_backup.php | tee /tmp/prod-snapshot.txt
          grep -Fq 'PROD_SNAPSHOT_BACKUP_OK=yes' /tmp/prod-snapshot.txt
          echo "PROD_BACKUP_PREFIX=$backup_prefix" >> "$GITHUB_ENV"

      - name: Promote exact verified TEST round six
        env:
          DB_TABLE_PREFIX: bd_prod_
          ALLOW_PROD_ATLAS_PROMOTION: yes
        run: |
          set -Eeuo pipefail
          php infra/sql/atlas_promote_test_history_to_prod.php /tmp/round-six-promotion.json | tee /tmp/round-six-prod-promotion.txt
          grep -Fq 'ATLAS_PROD_PROMOTION_STAGED=yes' /tmp/round-six-prod-promotion.txt

      - name: Verify finalize and rebuild canonical PROD
        env:
          DB_TABLE_PREFIX: bd_prod_
          ALLOW_PROD_ATLAS_FINALIZE: yes
        run: |
          set -Eeuo pipefail
          php infra/sql/atlas_history_verify.php --external=JaqLpRQCCeLi --expected-matches=24 --expected-players=7 --phase=data --require-visits=1 --require-playoff=1
          php infra/sql/atlas_history_finalize.php --external=JaqLpRQCCeLi
          php infra/sql/run_php_migration.php infra/sql/migrations/0053_rebuild_elo_in_logical_match_order.php bd_prod_
          php infra/sql/run_php_migration.php infra/sql/migrations/0074_add_tournament_elo_snapshots.php bd_prod_
          php infra/sql/elo_ledger_doctor.php
          php infra/sql/atlas_history_verify.php --external=JaqLpRQCCeLi --expected-matches=24 --expected-players=7 --phase=final --require-visits=1 --require-playoff=1
          php infra/sql/atlas_history_lifecycle_verify.php --external=JaqLpRQCCeLi
          php -r '
            mysqli_report(MYSQLI_REPORT_ERROR|MYSQLI_REPORT_STRICT);$db=new mysqli(getenv("DB_HOST"),getenv("DB_USERNAME"),getenv("DB_PASSWORD"),getenv("DB_NAME"),(int)getenv("DB_PORT"));$p="bd_prod_";$x="JaqLpRQCCeLi";
            $s=$db->prepare("SELECT internal_id FROM `{$p}external_references` WHERE external_system=\"dartsatlas\" AND external_entity_type=\"tournament\" AND external_id=? LIMIT 1");$s->bind_param("s",$x);$s->execute();$tid=(int)($s->get_result()->fetch_assoc()["internal_id"]??0);if($tid<1)throw new RuntimeException("Round six PROD ref missing");
            $matches=(int)$db->query("SELECT COUNT(*) c FROM `{$p}matches`")->fetch_assoc()["c"];$roundMatches=(int)$db->query("SELECT COUNT(*) c FROM `{$p}matches` WHERE tournament_id={$tid}")->fetch_assoc()["c"];$legs=(int)$db->query("SELECT COUNT(*) c FROM `{$p}legs` l JOIN `{$p}matches` m ON m.id=l.match_id WHERE m.tournament_id={$tid}")->fetch_assoc()["c"];$elo=(int)$db->query("SELECT COUNT(*) c FROM `{$p}elo_match_events` e JOIN `{$p}matches` m ON m.id=e.match_id WHERE m.tournament_id={$tid}")->fetch_assoc()["c"];$snapshots=(int)$db->query("SELECT COUNT(*) c FROM `{$p}tournament_elo_snapshots` WHERE tournament_id={$tid}")->fetch_assoc()["c"];$dups=(int)$db->query("SELECT COUNT(*) c FROM (SELECT club_id,LOWER(TRIM(display_name)) n FROM `{$p}players` WHERE is_active=1 AND merged_into_player_id IS NULL GROUP BY club_id,n HAVING COUNT(*)>1) x")->fetch_assoc()["c"];
            if($matches!==243||$roundMatches!==24||$legs!==27||$elo!==24||$snapshots!==7||$dups!==0)throw new RuntimeException("Final PROD integrity failed: ".json_encode(compact("matches","roundMatches","legs","elo","snapshots","dups")));
            echo "ROUND6_PROD_FINAL_OK=yes tournament_id={$tid} matches={$roundMatches} legs={$legs} elo_events={$elo} elo_snapshots={$snapshots} backup=".getenv("PROD_BACKUP_PREFIX")."\n";
          '

      - name: Verify public PROD readback
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            tournaments="$(curl -fsS --connect-timeout 5 --max-time 20 "${PROD_BASE_URL%/}/api/v1/clubs/1/tournaments?cb=$RANDOM" || true)"
            elo="$(curl -fsS --connect-timeout 5 --max-time 20 "${PROD_BASE_URL%/}/api/v1/clubs/1/elo?cb=$RANDOM" || true)"
            tournament_elo="$(curl -fsS --connect-timeout 5 --max-time 20 "${PROD_BASE_URL%/}/api/tournament-elo.php?tournament_id=15&cb=$RANDOM" || true)"
            if TOURNAMENTS="$tournaments" ELO="$elo" TOURNAMENT_ELO="$tournament_elo" php -r '
              $t=json_decode(getenv("TOURNAMENTS"),true);$e=json_decode(getenv("ELO"),true);$te=json_decode(getenv("TOURNAMENT_ELO"),true);$items=$t["data"]["items"]??[];$found=false;$tid=0;foreach($items as $x)if(($x["name"]??"")==="Mandagsserien #6"&&($x["status"]??"")==="completed"&&(int)($x["match_count"]??0)===24){$found=true;$tid=(int)$x["id"];}$names=[];$dups=0;foreach(($e["data"]["items"]??[]) as $x){$n=mb_strtolower(trim((string)($x["display_name"]??"")));if(isset($names[$n]))$dups++;$names[$n]=1;}$tp=$te["data"]["players"]??[];
              exit($found&&$tid===15&&$dups===0&&count($tp)===7?0:1);
            '; then echo "ROUND6_PUBLIC_READBACK_OK=yes tournament_id=15 elo_players=7"; exit 0; fi
            sleep 10
          done
          echo "Public PROD readback did not expose round six cleanly." >&2
          exit 1
