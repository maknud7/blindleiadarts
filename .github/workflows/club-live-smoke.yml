name: Club Live Smoke

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: club-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching test release
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 40); do
            release="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq "$EXPECTED_SHA" <<<"$release"; then exit 0; fi
            sleep 10
          done
          echo "Club Live smoke failed: expected release did not become live." >&2
          exit 1

      - name: Verify canonical club Live link
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"

          probe() {
            local label="$1"
            local url="$2"
            local tmp
            tmp="$(mktemp)"
            local status
            status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "$url" || true)"
            echo "PROBE $label => HTTP $status"
            if [[ "$status" != "200" ]]; then
              echo "--- response body ($label) ---" >&2
              cat "$tmp" >&2 || true
              echo >&2
              rm -f "$tmp"
              return 1
            fi
            cat "$tmp"
            rm -f "$tmp"
          }

          entry_html="$(probe code-entry "$base/live/?cb=$RANDOM")"
          echo "PROBE code-entry OK"
          grep -Fq 'id="liveCodeForm"' <<<"$entry_html"
          grep -Fq 'id="liveCodeInput"' <<<"$entry_html"
          grep -Fq 'code-entry.css' <<<"$entry_html"
          grep -Fq 'route-bootstrap.js' <<<"$entry_html"

          route_js="$(probe route-bootstrap "$base/live/route-bootstrap.js?cb=$RANDOM")"
          echo "PROBE route-bootstrap OK"
          grep -Fq 'showCodeEntry' <<<"$route_js"
          grep -Fq 'window.location.assign' <<<"$route_js"

          clubs_json="$(probe clubs "$base/api/v1/clubs?cb=$RANDOM")"
          echo "PROBE clubs OK"
          club_id="$(python3 -c 'import json,sys; lines=sys.stdin.read().splitlines(); raw="\n".join(line for line in lines if not line.startswith("PROBE ")); p=json.loads(raw); items=p.get("data",{}).get("items",[]); matches=[x for x in items if x.get("slug")=="blindleia-dartklubb"]; print(matches[0]["id"] if matches else "")' <<<"$clubs_json")"
          if [[ ! "$club_id" =~ ^[0-9]+$ ]]; then
            echo "Club Live smoke failed: Blindleia club was not found in /api/v1/clubs." >&2
            echo "$clubs_json" >&2
            exit 1
          fi
          echo "CLUB_ID=$club_id"

          live_json="$(probe club-by-id "$base/api/club-live.php?club_id=$club_id&cb=$RANDOM")"
          echo "PROBE club-by-id OK"
          live_code="$(python3 -c 'import json,sys; lines=sys.stdin.read().splitlines(); raw="\n".join(line for line in lines if not line.startswith("PROBE ")); print(json.loads(raw)["data"]["club"]["live_code"])' <<<"$live_json")"
          live_url="$(python3 -c 'import json,sys; lines=sys.stdin.read().splitlines(); raw="\n".join(line for line in lines if not line.startswith("PROBE ")); print(json.loads(raw)["data"]["live_url"])' <<<"$live_json")"

          if [[ ! "$live_code" =~ ^[0-9]{4}$ ]]; then
            echo "Club Live smoke failed: invalid Live code: $live_code" >&2
            exit 1
          fi
          if [[ "$live_url" != "$base/live/$live_code" ]]; then
            echo "Club Live smoke failed: unexpected canonical URL: $live_url" >&2
            exit 1
          fi
          echo "CLUB_LIVE_CODE=$live_code"
          echo "CLUB_LIVE_URL=$live_url"

          resolver="$(probe club-by-code "$base/api/club-live.php?code=$live_code&cb=$RANDOM")"
          echo "PROBE club-by-code OK"
          grep -Fq '"slug":"blindleia-dartklubb"' <<<"$resolver"
          grep -Fq "\"live_code\":\"$live_code\"" <<<"$resolver"

          live_html="$(probe pretty-live "$live_url?cb=$RANDOM")"
          echo "PROBE pretty-live OK"
          grep -Fq 'route-bootstrap.js' <<<"$live_html"
          grep -Fq 'blindleia-dartklubb-logo.png' <<<"$live_html"

          effective_url="$(curl -sS -L --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code} %{url_effective}' "$live_url/")"
          echo "PROBE trailing-slash => $effective_url"
          if [[ "$effective_url" != "200 $live_url" ]]; then
            echo "Club Live smoke failed: trailing-slash canonicalization ended at $effective_url" >&2
            exit 1
          fi

          echo "CLUB_LIVE_SMOKE_OK=yes"
