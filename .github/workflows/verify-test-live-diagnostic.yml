name: Verify Test Live Diagnostic

on:
  push:
    branches:
      - fix/test-deploy-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed test over HTTP
        env:
          BASE_URL: https://test.blindleiadarts.ingenting.org
          DEPLOYED_SHA: 49619d870a3d21f201de6f39db2e24b0afea86bd
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"

          fetch_body() {
            local path="$1"
            local sep='?'
            [[ "$path" == *\?* ]] && sep='&'
            curl -fsS --max-time 20 "${base}${path}${sep}cb=${RANDOM}${RANDOM}"
          }

          check_status() {
            local label="$1"
            local path="$2"
            echo "Checking ${label}: ${path}"
            fetch_body "$path" >/dev/null
            echo "OK: ${label}"
          }

          check_contains() {
            local label="$1"
            local path="$2"
            local needle="$3"
            local body
            echo "Checking ${label}: ${path}"
            body="$(fetch_body "$path")"
            if ! grep -Fq "$needle" <<<"$body"; then
              echo "::error::${label} did not contain expected marker: ${needle}"
              exit 1
            fi
            echo "OK: ${label}"
          }

          check_contains "release environment" "/release.json" '"environment":"test"'
          check_contains "release sha" "/release.json" "$DEPLOYED_SHA"
          check_status "health" "/api/v1/health"
          check_contains "admin people" "/admin/" 'Personer'
          check_contains "admin equipment" "/admin/" 'Utstyr'
          check_contains "admin tournament UX" "/admin/admin-ux.js" 'Neste anbefalte steg'
          check_contains "admin activity" "/admin/activity-admin.js" 'Aktivitet'
          check_contains "player profile" "/player/" 'Min profil'
          check_contains "player UX" "/player/player-ux.js" 'Akkurat nå'
          check_contains "onboarding viewport" "/onboarding/" 'viewport-fit=cover'
          check_contains "onboarding password toggle" "/onboarding/" 'data-toggle-password'
          check_contains "portal brand" "/packages/ui-assets/portal-menu.js" 'portal-brand.css'
          check_contains "mobile portal" "/packages/ui-assets/mobile-portal.css" 'Mobile navigation must expose every destination'
          check_contains "activity runtime" "/packages/ui-assets/activity.js" 'page_view'
          check_contains "public live logo" "/live/" 'blindleia-dartklubb-logo.png'
          check_contains "public live tracking" "/live/" '/packages/ui-assets/activity.js'
          check_contains "public live viewport" "/live/" 'viewport-fit=cover'
          check_contains "screen UX" "/screen/" 'screen-ux.css'
          check_contains "screen matches" "/screen/" 'Kamper på skivene'
          check_contains "kiosk portrait" "/kiosk/" 'tablet-portrait.css'
          check_contains "kiosk brand" "/kiosk/" 'brand-light.css'
          check_contains "kiosk admin" "/kiosk/admin-mode.js" '2201'
          check_contains "kiosk manifest" "/kiosk/manifest.webmanifest" '"orientation": "portrait"'
          check_contains "kiosk height" "/kiosk/tablet-portrait.css" 'height: 100dvh'
          check_contains "kiosk overflow" "/kiosk/tablet-portrait.css" 'overflow: hidden'

          echo "Checking activity POST"
          response_file="$(mktemp)"
          status="$(curl -sS --max-time 20 -o "$response_file" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"events":[{"surface":"deploy","event_name":"deployment_verify","path":"/","club_slug":"blindleia-dartklubb","metadata":{"source":"diagnostic"}}]}' \
            "$base/api/v1/activity")"
          echo "Activity HTTP status: $status"
          if [[ "$status" != "201" ]]; then
            cat "$response_file"
            echo "::error::Activity endpoint returned HTTP $status"
            exit 1
          fi
          if ! grep -Fq '"ok":true' "$response_file"; then
            cat "$response_file"
            echo "::error::Activity endpoint response was not ok"
            exit 1
          fi
          echo "OK: activity POST"
