name: Ops Bootstrap Backend v2 TEST Once

on:
  push:
    branches:
      - ops/bootstrap-backend-v2-test
    paths:
      - '.ops-bootstrap-backend-v2-test-marker'

permissions:
  contents: read

concurrency:
  group: ops-bootstrap-backend-v2-test-once
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-dahr6o2d0e5s738jbm4g
  RELEASE_SHA: 37c449ae8f4fd6dfaaa486712726116d73d53296
  HOST_URL: https://blindleia-backend-v2-test.onrender.com

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SCOLIA_BRIDGE_SECRET: ${{ secrets.SCOLIA_BRIDGE_SECRET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$DB_HOST"
          test -n "$DB_NAME"
          test -n "$DB_USERNAME"
          test -n "$DB_PASSWORD"
          test -n "$SCOLIA_BRIDGE_SECRET"

      - name: Inject TEST database and internal token
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INTERNAL_TOKEN: ${{ secrets.SCOLIA_BRIDGE_SECRET }}
          REALTIME_PUBLISH_URL: ${{ vars.TEST_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          update_env() {
            local key="$1" value="$2" payload
            payload="$(jq -nc --arg value "$value" '{value:$value}')"
            curl --fail --silent --show-error --output /dev/null \
              -X PUT "$api/$key" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$payload"
          }
          update_env DB_HOST "$DB_HOST"
          update_env DB_PORT "$DB_PORT"
          update_env DB_NAME "$DB_NAME"
          update_env DB_USERNAME "$DB_USERNAME"
          update_env DB_PASSWORD "$DB_PASSWORD"
          update_env BD_BACKEND_V2_INTERNAL_TOKEN "$INTERNAL_TOKEN"
          if [[ -n "$REALTIME_PUBLISH_URL" && -n "$REALTIME_PUBLISH_SECRET" ]]; then
            update_env REALTIME_PUBLISH_URL "$REALTIME_PUBLISH_URL"
            update_env REALTIME_PUBLISH_SECRET "$REALTIME_PUBLISH_SECRET"
          fi
          echo 'TEST Render secrets injected without printing values.'

      - name: Deploy exact TEST release
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -nc --arg commitId "$RELEASE_SHA" '{clearCache:"do_not_clear",commitId:$commitId}')"
          curl --fail --silent --show-error --output /dev/null \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "$payload"

      - name: Wait for TEST write host
        env:
          INTERNAL_TOKEN: ${{ secrets.SCOLIA_BRIDGE_SECRET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 60); do
            health="$(curl -fsS --max-time 10 "$HOST_URL/health" || true)"
            ready="$(curl -fsS --max-time 10 "$HOST_URL/ready" || true)"
            if jq -e --arg sha "$RELEASE_SHA" '
              .ok == true and .environment == "test" and .mode == "test-write"
              and .writes_armed == true and .canonical_side_effects_ready == true
              and .release_sha == $sha and .runtime_prefix == "bd_test_"
              and .max_connections == 1 and .connection_mode == "idle-reuse"' <<<"$health" >/dev/null 2>&1 \
              && jq -e '.ok == true and .writes_armed == true' <<<"$ready" >/dev/null 2>&1; then
              echo 'Backend-v2 TEST write host is ready.'
              exit 0
            fi
            sleep 5
          done
          echo 'Backend-v2 TEST write host did not reach readiness.' >&2
          exit 1
