name: Backend v2 PROD Render Promote

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/**'
      - 'package.json'
      - '.github/workflows/backend-v2-prod-render-promote.yml'
  push:
    branches:
      - 'render/backend-v2-prod-readonly-b6d9862'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-v2-prod-render-promote
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-dahq6o142hec73a1dr10
  HOST_URL: https://blindleia-backend-v2-readonly.onrender.com

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript toolchain
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify backend-v2 promotion candidate
        run: |
          set -Eeuo pipefail
          npm run backend-v2:typecheck
          npm run backend-v2:build
          node --test \
            apps/backend-v2/test/account-read-side-effects.test.mjs \
            apps/backend-v2/test/player-live-read-only.test.mjs \
            apps/backend-v2/test/system-status.test.mjs

  promote:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.release_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            sha="$INPUT_SHA"
          else
            sha="$PUSH_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build backend-v2
        run: |
          set -Eeuo pipefail
          npm install --no-package-lock --ignore-scripts
          npm run backend-v2:typecheck
          npm run backend-v2:build

      - name: Read-only preflight against canonical PROD schema
        env:
          BD_APP_ENV: prod
          BD_BACKEND_V2_MODE: readonly
          BD_BACKEND_V2_MAX_CONNECTIONS: '1'
          BD_BACKEND_V2_ACQUIRE_TIMEOUT_MS: '5000'
          BD_BACKEND_V2_CONNECT_TIMEOUT_MS: '10000'
          HOST: 127.0.0.1
          PORT: '18083'
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_prod_
          IDENTITY_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
        run: |
          set -Eeuo pipefail
          node apps/backend-v2/dist/server.js > backend-v2-prod-promote-preflight.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat backend-v2-prod-promote-preflight.log || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 10 http://127.0.0.1:18083/health > /tmp/health.json; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Backend-v2 exited during PROD preflight.' >&2
              exit 1
            fi
            sleep 0.5
          done

          curl -fsS --max-time 20 http://127.0.0.1:18083/ready > /tmp/ready.json
          jq -e --arg sha "$RELEASE_SHA" '
            .ok == true and
            .environment == "prod" and
            .mode == "readonly" and
            .writes_armed == false and
            .canonical_side_effects_ready == true and
            .release_sha == $sha and
            .runtime_prefix == "bd_prod_" and
            .identity_prefix == "bd_prod_" and
            .hardware_prefix == "bd_prod_" and
            .max_connections == 1 and
            .connection_mode == "idle-reuse"
          ' /tmp/health.json >/dev/null
          jq -e --arg sha "$RELEASE_SHA" '
            .ok == true and
            .environment == "prod" and
            .mode == "readonly" and
            .writes_armed == false and
            .release_sha == $sha and
            .runtime_prefix == "bd_prod_" and
            (.checked_tables | type == "array") and
            (.checked_tables | length > 0)
          ' /tmp/ready.json >/dev/null

          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Trigger exact Render deploy
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$RENDER_API_KEY"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          payload="$(jq -nc --arg commitId "$TARGET_SHA" '{clearCache:"do_not_clear",commitId:$commitId}')"
          curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "$payload" > "$response"
          deploy_id="$(jq -r '.id // empty' "$response")"
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for exact PROD backend release
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 120); do
            health="$(curl -fsS --max-time 20 "$HOST_URL/health" || true)"
            if jq -e --arg sha "$EXPECTED_SHA" '
              .ok == true and
              .environment == "prod" and
              .mode == "prod-canary" and
              .writes_armed == true and
              .canonical_side_effects_ready == true and
              .release_sha == $sha and
              .runtime_prefix == "bd_prod_" and
              .identity_prefix == "bd_prod_" and
              .hardware_prefix == "bd_prod_" and
              .max_connections == 1 and
              .connection_mode == "idle-reuse"
            ' <<<"$health" >/dev/null 2>&1; then
              printf '%s' "$health" > /tmp/render-health.json
              break
            fi
            sleep 5
          done

          test -s /tmp/render-health.json || {
            echo "Render never reached exact release $EXPECTED_SHA." >&2
            exit 1
          }

          ready="$(curl -fsS --max-time 30 "$HOST_URL/ready")"
          jq -e --arg sha "$EXPECTED_SHA" '
            .ok == true and
            .environment == "prod" and
            .mode == "prod-canary" and
            .writes_armed == true and
            .release_sha == $sha and
            .runtime_prefix == "bd_prod_" and
            (.checked_tables | type == "array") and
            (.checked_tables | length > 0)
          ' <<<"$ready" >/dev/null

      - name: Verify promoted read surfaces
        run: |
          set -Eeuo pipefail
          for path in /v1/auth/me /v1/system/status; do
            body="$(mktemp)"
            status="$(curl -sS --max-time 30 \
              -H 'Authorization: Bearer definitely-invalid-prod-promote-probe' \
              -o "$body" -w '%{http_code}' "$HOST_URL$path")"
            echo "$path HTTP $status: $(cat "$body")"
            test "$status" = "401"
            code="$(jq -r '.error.code // empty' "$body")"
            [[ "$code" == "invalid_session" || "$code" == "authentication_required" ]]
            rm -f "$body"
          done

          scolia="$(curl -fsS --max-time 30 "$HOST_URL/v1/scolia/health")"
          jq -e '.ok == true and .service == "scolia-bridge"' <<<"$scolia" >/dev/null

      - name: Record promotion
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          {
            echo '### Backend v2 PROD Render promotion'
            echo
            echo "Release: `$RELEASE_SHA`"
            echo "Render deploy: `$DEPLOY_ID`"
            echo
            echo 'Canonical PROD routing is not changed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
