name: Discover DartsAtlas Series Three

on:
  push:
    branches:
      - develop
    paths:
      - infra/sql/run-atlas-discover-series-three.flag

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Mandagsserien tournaments through TEST proxy
        run: |
          set -Eeuo pipefail
          url='https://test.blindleiadarts.ingenting.org/api/atlas-season-probe.php?season=rFByCgOqI1rq'
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /tmp/season.json -w '%{http_code}' --max-time 60 "$url" || true)"
            echo "Season probe attempt $attempt: HTTP ${status:-unknown}"
            if [[ "$status" == '200' ]] && grep -Fq 'atlas-season-probe-v2' /tmp/season.json; then
              cat /tmp/season.json
              exit 0
            fi
            [[ -f /tmp/season.json ]] && cat /tmp/season.json || true
            sleep 10
          done
          echo 'Expanded DartsAtlas season probe never became available' >&2
          exit 1
