name: Import Atlas Visits To Test

on:
  push:
    branches:
      - develop
    paths:
      - infra/sql/run-import-atlas-visits-test.flag

permissions:
  contents: read

concurrency:
  group: atlas-visits-test-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none

      - name: Validate importer
        run: php -l infra/sql/import_atlas_visits_test.php

      - name: Wait for updated Atlas visit parser on test
        run: |
          set -Eeuo pipefail
          url="https://test.blindleiadarts.ingenting.org/api/atlas-match-visits.php?match=x"
          for attempt in $(seq 1 80); do
            status="$(curl -sS -o /tmp/atlas-parser-check.json -w '%{http_code}' --max-time 20 "$url" || true)"
            echo "Parser attempt $attempt: HTTP ${status:-unknown}"
            if [[ "$status" == "400" ]] && grep -Fq 'invalid_match_id' /tmp/atlas-parser-check.json; then
              echo "Atlas visit parser ready"
              exit 0
            fi
            sleep 5
          done
          echo "Atlas visit parser did not become ready" >&2
          exit 1

      - name: Cool down Atlas source rate limit
        run: sleep 90

      - name: Fetch and import all 63 matches atomically
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/atlas-visits
          cat > /tmp/atlas-match-ids.txt <<'EOF'
          XeROeLgL56iJ
          94PrEzM1UOz8
          agxAIMHdqLDw
          Go1bpH0uqtoC
          RAaVJHn4MbYb
          t4IW5CddcXvA
          Rii6maLQuWjl
          M3OQH0QAYFtz
          nlXt8cJ7CFKG
          wqwBXocJmnxc
          l6Pj5ghmvsGW
          JXmOIuX8mVmM
          FHQkei4j7i9s
          RXYLwzexjsVu
          qA0WV2pPGIjm
          ch3TiSRKGzaJ
          iVb557KFiPb2
          ePguejTOil0U
          h4FUh1wj8W8s
          FkIOQ6g65wt3
          FwfhqFDyPm6f
          XVOISPZq0HWd
          Pkfu9RfOscpY
          heAPWS8MB51s
          MgD1Jp6tbzOF
          zOnbahlXwAIS
          4EEZhbUjyDZn
          zzIWKAI5UamG
          32OmcS3PPVdN
          rxPduMaB6QQu
          4kZkxMksjk5T
          INeiewadSlPk
          NbvNcKB3wG2o
          HFIMzKBEv4nk
          Q8IX4EdeoILs
          FFpIOmd5yR3q
          Bs5R4iixZVr4
          6He7ggO4RtTg
          TXQ50vqO8O0H
          y2LuL0WJLXa2
          r7BpwYtN8QI7
          5enq5NxnZecS
          WlJfHPoOc3iG
          yINY9TDHLMnu
          JpWyXH6xvtsy
          cCbSPlQBBaSo
          z8GEkjDCP0sw
          bvpaNCao0aiz
          l5O5roDRPPRy
          c9V5RyQNKMEd
          ioio9lcnhzoa
          H82f0TWBwLGd
          GJEv00L7NZeS
          KK4iUF0MBRq6
          JmjCTyLgoaab
          Pw8lVCkKXMYi
          BMifg1sQ1eNR
          J7VpnjGVpHXn
          5B1ky08NKD8j
          fYzxmWVPjODw
          qCbZSWWeauR2
          4GSzMpN97ozy
          c3H8saV2X2gO
          EOF

          [[ "$(wc -l < /tmp/atlas-match-ids.txt | tr -d ' ')" == "63" ]]
          current=0
          while IFS= read -r match_id; do
            current=$((current + 1))
            target="/tmp/atlas-visits/${match_id}.json"
            url="https://test.blindleiadarts.ingenting.org/api/atlas-match-visits.php?match=${match_id}"
            ok=no

            for attempt in $(seq 1 10); do
              status="$(curl -sS -o "$target" -w '%{http_code}' --max-time 45 "$url" || true)"
              if [[ "$status" == "200" ]] && MATCH_ID="$match_id" TARGET="$target" php -r '$d=json_decode(file_get_contents(getenv("TARGET")),true); exit(($d["ok"]??false) && ($d["external_id"]??"")===getenv("MATCH_ID") ? 0 : 1);'; then
                ok=yes
                break
              fi

              echo "Retry ${attempt}/10 for ${match_id}: HTTP ${status:-unknown}"
              [[ -s "$target" ]] && cat "$target" || true
              if [[ -s "$target" ]] && grep -Fq '"status":429' "$target"; then
                case "$attempt" in
                  1) delay=60 ;;
                  2) delay=90 ;;
                  3) delay=120 ;;
                  *) delay=180 ;;
                esac
                echo "DartsAtlas rate limit detected; waiting ${delay}s"
                sleep "$delay"
              else
                sleep 10
              fi
            done

            if [[ "$ok" != yes ]]; then
              echo "Failed to fetch/parse ${match_id}" >&2
              exit 1
            fi

            MATCH_ID="$match_id" TARGET="$target" CURRENT="$current" php -r '$d=json_decode(file_get_contents(getenv("TARGET")),true); echo getenv("CURRENT")."/63 fetched ".getenv("MATCH_ID").": legs=".$d["leg_count"]." visits=".$d["visit_count"]." darts=".$d["darts_count"].PHP_EOL;'

            # Commit this match immediately. The importer wraps exactly this match in one
            # database transaction, so statistics can update progressively without ever
            # exposing a partially imported match.
            php infra/sql/import_atlas_visits_test.php "$target"
            echo "${current}/63 committed ${match_id} to TEST"

            # Keep DartsAtlas request rate deliberately low.
            sleep 12
          done < /tmp/atlas-match-ids.txt

      - name: Verify TEST history totals
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
        run: php infra/sql/history_inventory.php
