name: Ops List TEST Kiosks Once

on:
  push:
    branches:
      - ops/list-test-kiosks
    paths:
      - '.ops-list-test-kiosks-marker'

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: List TEST kiosks read-only
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '
            mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
            $db = new mysqli(getenv("DB_HOST"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"), getenv("DB_NAME"), (int)getenv("DB_PORT"));
            $db->set_charset("utf8mb4");
            $result = $db->query("SELECT id, code, board_number, club_id FROM bd_test_kiosks ORDER BY board_number, id");
            while ($row = $result->fetch_assoc()) {
              echo "KIOSK id=" . $row["id"] . " code=" . $row["code"] . " board=" . ($row["board_number"] ?? "") . " club=" . $row["club_id"] . PHP_EOL;
            }
          '
