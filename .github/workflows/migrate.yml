name: Run Database Migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to migrate
        required: true
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

concurrency:
  group: migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Select table prefix
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "DB_TABLE_PREFIX=bd_prod_" >> "$GITHUB_ENV"
          else
            echo "DB_TABLE_PREFIX=bd_test_" >> "$GITHUB_ENV"
          fi

      - name: Run migrations
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: ${{ env.DB_TABLE_PREFIX }}

