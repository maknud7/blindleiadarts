name: Temporary Scolia bridge ops patch

on:
  push:
    branches:
      - feat/backend-v2-scolia-bridge-ops
    paths:
      - '.github/workflows/tmp-scolia-bridge-ops-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-v2-scolia-bridge-ops
      - name: Apply consolidated patch
        run: python .github/tmp/apply_scolia_bridge_ops.py
      - name: Commit final source changes
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Scolia bridge routing and health reads to backend-v2"
          git push origin HEAD:feat/backend-v2-scolia-bridge-ops
