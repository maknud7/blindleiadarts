name: PROD Player Link Audit

on:
  push:
    branches:
      - develop
    paths:
      - '.github/prod-player-link-audit-request'

permissions:
  contents: read

concurrency:
  group: prod-player-link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate request
        run: |
          set -Eeuo pipefail
          test -f .github/prod-player-link-audit-request
          grep -Fxq 'audit_prod_unlinked_players=YES' .github/prod-player-link-audit-request

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Read-only PROD player link audit
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/prod-player-link-audit.php <<'PHP'
          <?php
          declare(strict_types=1);
          mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
          $required = static function (string $key): string {
              $value = getenv($key);
              if ($value === false || trim($value) === '') throw new RuntimeException('Missing env: ' . $key);
              return trim($value);
          };
          $safe = static fn(mixed $value): string => str_replace(["\r", "\n", "|"], [' ', ' ', '/'], (string)($value ?? ''));
          $db = new mysqli($required('DB_HOST'), $required('DB_USERNAME'), $required('DB_PASSWORD'), $required('DB_NAME'), (int)$required('DB_PORT'));
          $db->set_charset('utf8mb4');

          $sql = "SELECT
                    p.id,
                    p.display_name,
                    p.is_active,
                    p.member_id,
                    p.member_link_source,
                    GROUP_CONCAT(DISTINCT er.external_id ORDER BY er.external_id SEPARATOR ',') AS atlas_external_ids,
                    COUNT(DISTINCT CASE WHEN m.status='completed' THEN m.id END) AS completed_matches,
                    GROUP_CONCAT(DISTINCT CASE WHEN m.status='completed' THEN t.name END ORDER BY t.start_at,t.id SEPARATOR ' | ') AS tournaments
                  FROM bd_prod_players p
                  LEFT JOIN bd_prod_external_references er
                    ON er.external_system='dartsatlas'
                   AND er.external_entity_type='player'
                   AND er.internal_entity_type='player'
                   AND er.internal_id=p.id
                  LEFT JOIN bd_prod_matches m
                    ON m.player_a_id=p.id OR m.player_b_id=p.id
                  LEFT JOIN bd_prod_tournaments t ON t.id=m.tournament_id
                  WHERE p.member_id IS NULL
                    AND p.merged_into_player_id IS NULL
                  GROUP BY p.id,p.display_name,p.is_active,p.member_id,p.member_link_source
                  ORDER BY p.display_name,p.id";
          $rows = $db->query($sql)->fetch_all(MYSQLI_ASSOC);
          echo 'PROD_UNLINKED_PLAYER_COUNT=' . count($rows) . PHP_EOL;
          foreach ($rows as $row) {
              echo 'UNLINKED_PLAYER'
                  . '|id=' . (int)$row['id']
                  . '|name=' . $safe($row['display_name'])
                  . '|active=' . (int)$row['is_active']
                  . '|dartsatlas=' . (($row['atlas_external_ids'] ?? null) !== null ? 'yes' : 'no')
                  . '|atlas_ids=' . $safe($row['atlas_external_ids'])
                  . '|completed_matches=' . (int)$row['completed_matches']
                  . '|tournaments=' . $safe($row['tournaments'])
                  . PHP_EOL;
          }

          $tracked = $db->query("SELECT id,display_name,member_id,member_link_source,member_linked_at,is_active,merged_into_player_id
                                   FROM bd_prod_players
                                  WHERE display_name IN ('Dan Christian Birkeland','Leif Atle Franksson','Sven Einar Davidsen')
                                  ORDER BY display_name,id")->fetch_all(MYSQLI_ASSOC);
          foreach ($tracked as $row) {
              echo 'PLAYER_STATE'
                  . '|id=' . (int)$row['id']
                  . '|name=' . $safe($row['display_name'])
                  . '|member_id=' . ($row['member_id'] === null ? 'NULL' : (int)$row['member_id'])
                  . '|link_source=' . $safe($row['member_link_source'])
                  . '|linked_at=' . $safe($row['member_linked_at'])
                  . '|active=' . (int)$row['is_active']
                  . '|merged_into=' . ($row['merged_into_player_id'] === null ? 'NULL' : (int)$row['merged_into_player_id'])
                  . PHP_EOL;
          }

          $members = $db->query("SELECT id,medlemsnummer,navn
                                   FROM medlemmer
                                  WHERE LOWER(navn) LIKE '%leif%frank%'
                                     OR medlemsnummer=103
                                  ORDER BY id")->fetch_all(MYSQLI_ASSOC);
          foreach ($members as $member) {
              $memberId = (int)$member['id'];
              echo 'MEMBER_CANDIDATE'
                  . '|id=' . $memberId
                  . '|member_number=' . $safe($member['medlemsnummer'])
                  . '|name=' . $safe($member['navn'])
                  . PHP_EOL;

              $stmt = $db->prepare("SELECT id,display_name,member_id,merged_into_player_id FROM bd_prod_players WHERE member_id=? ORDER BY id");
              $stmt->bind_param('i', $memberId);
              $stmt->execute();
              foreach ($stmt->get_result()->fetch_all(MYSQLI_ASSOC) as $linked) {
                  echo 'MEMBER_PLAYER_LINK'
                      . '|member_id=' . $memberId
                      . '|player_id=' . (int)$linked['id']
                      . '|player_name=' . $safe($linked['display_name'])
                      . '|merged_into=' . ($linked['merged_into_player_id'] === null ? 'NULL' : (int)$linked['merged_into_player_id'])
                      . PHP_EOL;
              }
              $stmt->close();

              $stmt = $db->prepare("SELECT id,player_id,role FROM bd_prod_user_accounts WHERE member_id=? ORDER BY id");
              $stmt->bind_param('i', $memberId);
              $stmt->execute();
              foreach ($stmt->get_result()->fetch_all(MYSQLI_ASSOC) as $account) {
                  echo 'MEMBER_USER_ACCOUNT'
                      . '|member_id=' . $memberId
                      . '|account_id=' . (int)$account['id']
                      . '|player_id=' . ($account['player_id'] === null ? 'NULL' : (int)$account['player_id'])
                      . '|role=' . $safe($account['role'])
                      . PHP_EOL;
              }
              $stmt->close();
          }

          $audit = $db->query("SELECT id,player_id,player_display_name,member_id,member_name,actor_user_account_id,link_source,created_at
                                FROM bd_prod_player_member_link_audit
                               ORDER BY id DESC
                               LIMIT 10")->fetch_all(MYSQLI_ASSOC);
          foreach ($audit as $row) {
              echo 'LINK_AUDIT'
                  . '|id=' . (int)$row['id']
                  . '|player_id=' . (int)$row['player_id']
                  . '|player_name=' . $safe($row['player_display_name'])
                  . '|member_id=' . (int)$row['member_id']
                  . '|member_name=' . $safe($row['member_name'])
                  . '|actor=' . ($row['actor_user_account_id'] === null ? 'NULL' : (int)$row['actor_user_account_id'])
                  . '|source=' . $safe($row['link_source'])
                  . '|at=' . $safe($row['created_at'])
                  . PHP_EOL;
          }

          $columns = $db->query("SELECT table_name,column_name,column_type,is_nullable
                                   FROM information_schema.columns
                                  WHERE table_schema=DATABASE()
                                    AND ((table_name='bd_prod_players' AND column_name IN ('member_id','member_link_source','member_linked_at'))
                                      OR (table_name='bd_prod_player_member_link_audit' AND column_name IN ('member_id','member_name','actor_user_account_id','link_source'))
                                      OR (table_name='bd_prod_user_accounts' AND column_name IN ('member_id','player_id')))
                                  ORDER BY table_name,column_name")->fetch_all(MYSQLI_ASSOC);
          foreach ($columns as $column) {
              echo 'SCHEMA_CHECK'
                  . '|table=' . $safe($column['table_name'])
                  . '|column=' . $safe($column['column_name'])
                  . '|type=' . $safe($column['column_type'])
                  . '|nullable=' . $safe($column['is_nullable'])
                  . PHP_EOL;
          }

          $db->close();
          PHP
          php /tmp/prod-player-link-audit.php
