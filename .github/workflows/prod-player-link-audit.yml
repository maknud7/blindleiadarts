name: PROD Player Link Audit

on:
  push:
    branches:
      - develop
    paths:
      - '.github/prod-player-link-audit-request'

permissions:
  contents: read

concurrency:
  group: prod-player-link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate request
        run: |
          set -Eeuo pipefail
          grep -Fxq 'audit_prod_unlinked_players=YES' .github/prod-player-link-audit-request

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Read-only PROD player link audit
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/prod-player-link-audit.php <<'PHP'
          <?php
          declare(strict_types=1);
          mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
          $required = static function (string $key): string {
              $value = getenv($key);
              if ($value === false || trim($value) === '') throw new RuntimeException('Missing env: ' . $key);
              return trim($value);
          };
          $safe = static fn(mixed $value): string => str_replace(["\r", "\n", "|"], [' ', ' ', '/'], (string)($value ?? ''));
          $db = new mysqli($required('DB_HOST'), $required('DB_USERNAME'), $required('DB_PASSWORD'), $required('DB_NAME'), (int)$required('DB_PORT'));
          $db->set_charset('utf8mb4');

          foreach ($db->query("SELECT id,display_name,member_id,is_active,merged_into_player_id
                                FROM bd_prod_players
                               WHERE id IN (10,33)
                               ORDER BY id")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'PLAYER'
                  . '|id=' . (int)$row['id']
                  . '|name=' . $safe($row['display_name'])
                  . '|member_id=' . ($row['member_id'] === null ? 'NULL' : (int)$row['member_id'])
                  . '|active=' . (int)$row['is_active']
                  . '|merged_into=' . ($row['merged_into_player_id'] === null ? 'NULL' : (int)$row['merged_into_player_id'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT id,medlemsnummer,navn FROM medlemmer WHERE id=103 OR medlemsnummer=103 ORDER BY id")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'MEMBER'
                  . '|id=' . (int)$row['id']
                  . '|member_number=' . $safe($row['medlemsnummer'])
                  . '|name=' . $safe($row['navn'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT id,member_id,player_id,role
                                FROM bd_prod_user_accounts
                               WHERE member_id=103 OR player_id IN (10,33)
                               ORDER BY id")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'USER_ACCOUNT_REF'
                  . '|id=' . (int)$row['id']
                  . '|member_id=' . ($row['member_id'] === null ? 'NULL' : (int)$row['member_id'])
                  . '|player_id=' . ($row['player_id'] === null ? 'NULL' : (int)$row['player_id'])
                  . '|role=' . $safe($row['role'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT index_name,non_unique,seq_in_index,column_name
                                  FROM information_schema.statistics
                                 WHERE table_schema=DATABASE()
                                   AND table_name='bd_prod_user_accounts'
                                   AND column_name IN ('member_id','player_id')
                                 ORDER BY index_name,seq_in_index")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'USER_ACCOUNT_INDEX'
                  . '|name=' . $safe($row['index_name'])
                  . '|non_unique=' . (int)$row['non_unique']
                  . '|seq=' . (int)$row['seq_in_index']
                  . '|column=' . $safe($row['column_name'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT constraint_name,column_name,referenced_table_name,referenced_column_name
                                  FROM information_schema.key_column_usage
                                 WHERE table_schema=DATABASE()
                                   AND table_name='bd_prod_user_accounts'
                                   AND column_name IN ('member_id','player_id')
                                 ORDER BY constraint_name,column_name")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'USER_ACCOUNT_CONSTRAINT'
                  . '|name=' . $safe($row['constraint_name'])
                  . '|column=' . $safe($row['column_name'])
                  . '|ref_table=' . $safe($row['referenced_table_name'])
                  . '|ref_column=' . $safe($row['referenced_column_name'])
                  . PHP_EOL;
          }

          $db->close();
          PHP
          php /tmp/prod-player-link-audit.php
