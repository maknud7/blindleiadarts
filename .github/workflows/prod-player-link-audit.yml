name: PROD Player Link Audit

on:
  push:
    branches:
      - develop
    paths:
      - '.github/prod-player-link-audit-request'

permissions:
  contents: read

concurrency:
  group: prod-player-link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate request
        run: |
          set -Eeuo pipefail
          grep -Fxq 'audit_prod_unlinked_players=YES' .github/prod-player-link-audit-request

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Read-only PROD player link audit
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/prod-player-link-audit.php <<'PHP'
          <?php
          declare(strict_types=1);
          mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
          $required = static function (string $key): string {
              $value = getenv($key);
              if ($value === false || trim($value) === '') throw new RuntimeException('Missing env: ' . $key);
              return trim($value);
          };
          $safe = static fn(mixed $value): string => str_replace(["\r", "\n", "|"], [' ', ' ', '/'], (string)($value ?? ''));
          $db = new mysqli($required('DB_HOST'), $required('DB_USERNAME'), $required('DB_PASSWORD'), $required('DB_NAME'), (int)$required('DB_PORT'));
          $db->set_charset('utf8mb4');

          foreach ($db->query("SELECT id,member_id,player_id,role,is_active,account_status,last_login_at,created_at,updated_at
                                FROM bd_prod_user_accounts
                               WHERE id IN (10,26)
                               ORDER BY id")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'ACCOUNT_ACTIVITY'
                  . '|id=' . (int)$row['id']
                  . '|member_id=' . ($row['member_id'] === null ? 'NULL' : (int)$row['member_id'])
                  . '|player_id=' . ($row['player_id'] === null ? 'NULL' : (int)$row['player_id'])
                  . '|role=' . $safe($row['role'])
                  . '|active=' . (int)$row['is_active']
                  . '|status=' . $safe($row['account_status'])
                  . '|last_login=' . $safe($row['last_login_at'])
                  . '|created=' . $safe($row['created_at'])
                  . '|updated=' . $safe($row['updated_at'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT user_account_id,
                                      COUNT(*) AS total_sessions,
                                      SUM(CASE WHEN revoked_at IS NULL AND expires_at>NOW() THEN 1 ELSE 0 END) AS active_sessions,
                                      MAX(last_used_at) AS last_session_use
                                 FROM bd_prod_auth_sessions
                                WHERE user_account_id IN (10,26)
                                GROUP BY user_account_id
                                ORDER BY user_account_id")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'ACCOUNT_SESSIONS'
                  . '|account_id=' . (int)$row['user_account_id']
                  . '|total=' . (int)$row['total_sessions']
                  . '|active=' . (int)$row['active_sessions']
                  . '|last_use=' . $safe($row['last_session_use'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT user_account_id,club_id,role
                                  FROM bd_prod_club_user_roles
                                 WHERE user_account_id IN (10,26)
                                 ORDER BY user_account_id,club_id,role")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'CLUB_ROLE'
                  . '|account_id=' . (int)$row['user_account_id']
                  . '|club_id=' . (int)$row['club_id']
                  . '|role=' . $safe($row['role'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT user_account_id,role
                                  FROM bd_prod_global_user_roles
                                 WHERE user_account_id IN (10,26)
                                 ORDER BY user_account_id,role")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'GLOBAL_ROLE'
                  . '|account_id=' . (int)$row['user_account_id']
                  . '|role=' . $safe($row['role'])
                  . PHP_EOL;
          }

          foreach ($db->query("SELECT table_name,column_name
                                  FROM information_schema.key_column_usage
                                 WHERE constraint_schema=DATABASE()
                                   AND referenced_table_name='bd_prod_user_accounts'
                                   AND referenced_column_name='id'
                                 ORDER BY table_name,column_name")->fetch_all(MYSQLI_ASSOC) as $row) {
              echo 'ACCOUNT_CHILD'
                  . '|table=' . $safe($row['table_name'])
                  . '|column=' . $safe($row['column_name'])
                  . PHP_EOL;
          }

          $db->close();
          PHP
          php /tmp/prod-player-link-audit.php
