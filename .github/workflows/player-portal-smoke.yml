name: Player Portal Smoke

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/prod-release-request'
      - '.github/prod-snapshot-request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-portal-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching test release
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          echo "Waiting for test release $EXPECTED_SHA"
          for attempt in $(seq 1 40); do
            release="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq "$EXPECTED_SHA" <<<"$release"; then
              echo "Matching release is live."
              exit 0
            fi
            echo "Attempt $attempt/40: release not live yet"
            sleep 10
          done
          echo "Smoke failed: expected release did not become live." >&2
          exit 1

      - name: Verify player portal assets and APIs
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"

          player_html="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/player/?cb=$RANDOM")"
          grep -Eq 'member-account\.js(\?v=[^"[:space:]]+)?' <<<"$player_html"
          grep -Eq 'portal-content\.js(\?v=[^"[:space:]]+)?' <<<"$player_html"
          grep -Eq 'elo-history-exact\.js(\?v=[^"[:space:]]+)?' <<<"$player_html"
          grep -Eq 'tournament-elo-summary\.js(\?v=[^"[:space:]]+)?' <<<"$player_html"
          grep -Eq 'elo-tournament-history\.css(\?v=[^"[:space:]]+)?' <<<"$player_html"

          member_account_js="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/player/member-account.js?cb=$RANDOM")"
          grep -Fq 'Start fast betaling via Stripe' <<<"$member_account_js"
          grep -Fq 'Enkeltbetaling med Vipps' <<<"$member_account_js"

          admin_html="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/admin/?cb=$RANDOM")"
          grep -Eq 'payment-settings\.js(\?v=[^"[:space:]]+)?' <<<"$admin_html"
          grep -Eq 'payment-settings\.css(\?v=[^"[:space:]]+)?' <<<"$admin_html"

          payment_settings_js="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/admin/payment-settings.js?cb=$RANDOM")"
          grep -Fq '/payment-settings' <<<"$payment_settings_js"
          grep -Fq 'Stripe' <<<"$payment_settings_js"
          grep -Fq 'Vipps' <<<"$payment_settings_js"

          request() {
            local label="$1"
            local url="$2"
            echo "SMOKE: $label -> $url"
            local tmp
            tmp="$(mktemp)"
            local status
            status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp" -w '%{http_code}' "$url" || true)"
            echo "HTTP $status"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              cat "$tmp"
              rm -f "$tmp"
              echo "Smoke failed: $label returned HTTP $status" >&2
              exit 1
            fi
            if ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$tmp"; then
              cat "$tmp"
              rm -f "$tmp"
              echo "Smoke failed: $label did not return ok=true" >&2
              exit 1
            fi
            cat "$tmp" > /tmp/player-portal-last.json
            rm -f "$tmp"
          }

          request "clubs" "$base/api/v1/clubs"
          cp /tmp/player-portal-last.json /tmp/player-portal-clubs.json
          club_ids="$(php -r '
            $j=json_decode(file_get_contents("/tmp/player-portal-clubs.json"),true);
            foreach(($j["data"]["items"]??[]) as $r){$id=(int)($r["id"]??0);if($id>0)echo $id.PHP_EOL;}
          ')"
          test -n "$club_ids"

          # Do not assume the first TEST club owns season data. Pick the first
          # club that has both a player directory entry and at least one season.
          club_id=0
          player_id=0
          season_id=0
          while IFS= read -r candidate_club; do
            test -n "$candidate_club" || continue
            request "player directory candidate $candidate_club" "$base/api/v1/clubs/$candidate_club/player-directory"
            candidate_player="$(php -r '$j=json_decode(file_get_contents("/tmp/player-portal-last.json"),true); echo (int)($j["data"]["items"][0]["id"] ?? 0);')"
            test "$candidate_player" -gt 0 || continue

            request "seasons candidate $candidate_club" "$base/api/v1/clubs/$candidate_club/seasons"
            candidate_season="$(php -r '
              $j=json_decode(file_get_contents("/tmp/player-portal-last.json"),true);
              $items=$j["data"]["items"]??[];
              $id=0;
              foreach($items as $r){if(($r["is_active"]??false)){$id=(int)($r["id"]??0);break;}}
              if(!$id)$id=(int)($items[0]["id"]??0);
              echo $id;
            ')"
            test "$candidate_season" -gt 0 || continue

            club_id="$candidate_club"
            player_id="$candidate_player"
            season_id="$candidate_season"
            break
          done <<< "$club_ids"

          test "$club_id" -gt 0
          test "$player_id" -gt 0
          test "$season_id" -gt 0
          echo "Using club=$club_id player=$player_id season=$season_id"

          request "player directory" "$base/api/v1/clubs/$club_id/player-directory"
          request "elo" "$base/api/v1/clubs/$club_id/elo"
          elo_rows="$(php -r '
            $j=json_decode(file_get_contents("/tmp/player-portal-last.json"),true);
            $items=$j["data"]["items"]??null;
            if(!is_array($items)){fwrite(STDERR,"Club ELO items missing\n");exit(1);}
            foreach($items as $r){if(!is_array($r)||!array_key_exists("elo_rating",$r)){fwrite(STDERR,"Club ELO row missing elo_rating\n");exit(2);}}
            echo count($items);
          ')"
          echo "Club ELO rows with valid schema: $elo_rows"

          request "seasons" "$base/api/v1/clubs/$club_id/seasons"
          php -r '
            $j=json_decode(file_get_contents("/tmp/player-portal-last.json"),true);
            $items=$j["data"]["items"]??[];
            $wanted=(int)$argv[1];
            foreach($items as $r){if((int)($r["id"]??0)===$wanted)exit(0);}
            fwrite(STDERR,"Selected season disappeared from club list\n");exit(1);
          ' "$season_id"

          request "season standings" "$base/api/v1/seasons/$season_id/standings"
          standings_rows="$(php -r '
            $j=json_decode(file_get_contents("/tmp/player-portal-last.json"),true);
            $items=$j["data"]["items"]??null;
            if(!is_array($items)){fwrite(STDERR,"Season standings items missing\n");exit(1);}
            foreach($items as $r){if(!is_array($r)||!array_key_exists("elo_rating",$r)){fwrite(STDERR,"Standings row missing elo_rating\n");exit(2);}}
            echo count($items);
          ')"
          echo "Season standings rows with valid ELO schema: $standings_rows"

          request "registration tournaments" "$base/api/v1/clubs/$club_id/registration-tournaments"
          tournament_id="$(php -r '$j=json_decode(file_get_contents("/tmp/player-portal-last.json"),true); echo (int)($j["data"]["items"][0]["id"] ?? 0);')"
          if test "$tournament_id" -gt 0; then
            request "tournament ELO snapshots" "$base/api/tournament-elo.php?tournament_id=$tournament_id"
          fi

          request "player profile" "$base/api/v1/players/$player_id/profile"
          request "player matches" "$base/api/v1/players/$player_id/matches"
          request "player tournament ELO history" "$base/api/player-elo-tournaments.php?player_id=$player_id"

          echo "DEEP HEALTH: $base/api/health.php?deep=1"
          health_file="$(mktemp)"
          health_status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$health_file" -w '%{http_code}' "$base/api/health.php?deep=1&cb=$RANDOM" || true)"
          echo "HTTP $health_status"
          php -r '
            $j=json_decode(file_get_contents($argv[1]),true);
            if (!is_array($j)) { fwrite(STDERR,"Invalid deep health JSON\n"); exit(1); }
            echo "overall=".(($j["ok"]??false)?"ok":"fail")." total_ms=".($j["duration_ms"]??"?").PHP_EOL;
            foreach (($j["diagnostics"]??[]) as $d) {
              echo ($d["status"]??"?")."\t".($d["name"]??"?")."\t".($d["ms"]??"?")."ms\t".json_encode($d["detail"]??null,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            }
            if (!($j["ok"]??false)) exit(2);
          ' "$health_file"
          test "$health_status" = "200"
          rm -f "$health_file"

          echo "PLAYER_PORTAL_SMOKE_OK=yes"