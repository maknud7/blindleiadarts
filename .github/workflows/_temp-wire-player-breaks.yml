name: Temp wire player breaks

on:
  push:
    branches:
      - feat/backend-v2-player-breaks
    paths:
      - '.github/workflows/_temp-wire-player-breaks.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-v2-player-breaks
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wire player break runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"needle not found in {path}: {old[:100]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          server = 'apps/backend-v2/src/server.ts'
          replace_once(
              server,
              'import { MySqlTournamentOperationsRepository } from "./mysql/tournament-operations-repository.js";\n',
              'import { MySqlTournamentOperationsRepository } from "./mysql/tournament-operations-repository.js";\nimport { MySqlTournamentPlayerBreakRepository } from "./mysql/tournament-player-break-repository.js";\n',
          )
          replace_once(
              server,
              'import { TournamentAttendanceRouter } from "./runtime/tournament-attendance-router.js";\n',
              'import { TournamentAttendanceRouter } from "./runtime/tournament-attendance-router.js";\nimport { TournamentPlayerBreakRouter } from "./runtime/tournament-player-break-router.js";\n',
          )
          replace_once(
              server,
              'const tournamentOperations = new MySqlTournamentOperationsRepository(sessions, config.prefixes.runtime);\n',
              'const tournamentOperations = new MySqlTournamentOperationsRepository(sessions, config.prefixes.runtime);\nconst tournamentPlayerBreaks = new MySqlTournamentPlayerBreakRepository(sessions, config.prefixes.runtime);\n',
          )
          replace_once(
              server,
              'const tournamentRuntime = new TournamentRuntimeRouter(\n',
              'const tournamentPlayerBreakRuntime = new TournamentPlayerBreakRouter(\n  config,\n  identityRepository,\n  tournamentPlayerBreaks,\n  tournamentAttendance,\n);\nconst tournamentRuntime = new TournamentRuntimeRouter(\n',
          )
          replace_once(
              server,
              '  const tournamentRoute = await tournamentRuntime.handle(method, publicPath, request);\n',
              '  const tournamentPlayerBreakRoute = await tournamentPlayerBreakRuntime.handle(method, publicPath, request);\n  if (tournamentPlayerBreakRoute !== null) {\n    sendJson(response, tournamentPlayerBreakRoute.statusCode, tournamentPlayerBreakRoute.payload);\n    return;\n  }\n\n  const tournamentRoute = await tournamentRuntime.handle(method, publicPath, request);\n',
          )

          workflow = '.github/workflows/backend-v2-tournament-e2e.yml'
          replace_once(
              workflow,
              '          node apps/backend-v2/e2e/tournament-wizard-lifecycle.mjs\n',
              '          node apps/backend-v2/e2e/tournament-wizard-lifecycle.mjs\n          node apps/backend-v2/e2e/tournament-player-break-lifecycle.mjs\n',
          )
          PY

      - name: Validate candidate
        run: |
          set -Eeuo pipefail
          npm install --no-package-lock --ignore-scripts
          npm run backend-v2:typecheck
          npm run backend-v2:build
          php -l apps/api/src/BackendV2TournamentProxyApplication.php
          php apps/api/tests/backend_v2_tournament_proxy_routing_test.php

      - name: Commit clean wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_temp-wire-player-breaks.yml
          git add apps/backend-v2/src/server.ts .github/workflows/backend-v2-tournament-e2e.yml
          git commit -m 'Wire player breaks into backend-v2 tournament runtime'
          git push origin HEAD:feat/backend-v2-player-breaks
