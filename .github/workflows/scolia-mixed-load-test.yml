name: Scolia Mixed Load Test

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/api/src/Repository/MatchScoringRepository.php'
      - 'apps/api/src/Repository/PlayerBreakRepository.php'
      - 'apps/api/src/Repository/ScoliaRepository.php'
      - 'apps/api/src/Repository/TournamentOperationsRepository.php'
      - 'apps/api/src/Service/CanonicalScoringService.php'
      - 'apps/api/src/Service/ScoliaQueueService.php'
      - 'apps/api/src/Service/ScoliaScoringService.php'
      - 'apps/api/src/Support/Config.php'
      - 'apps/api/src/Support/Database.php'
      - 'apps/api/src/Support/DatabaseConnectionGate.php'
      - 'infra/deploy/generate_api_config.php'
      - 'infra/sql/migrate.php'
      - 'infra/sql/migrations/0034_add_scolia_runtime_and_onsite_checkin.sql'
      - 'infra/sql/migrations/0082_prioritize_scolia_runtime_queues.sql'
      - 'infra/sql/migrations/0083_assign_scolia_queue_priorities.sql'
      - 'infra/sql/migrations/0084_index_scolia_fifo_claims.sql'
      - 'infra/sql/db_concurrency_probe.php'
      - 'infra/sql/scolia_queue_virtual_test.php'
      - 'infra/sql/scolia_mixed_load_test.php'
      - 'infra/sql/tournament_mixed_load_test.php'
      - '.github/workflows/scolia-mixed-load-test.yml'
      - '.github/workflows/scolia-queue-virtual-test.yml'
  workflow_dispatch:

permissions:
  contents: read

# Heavy concurrency is intentionally isolated from the club database. The newest
# candidate wins so obsolete releases cannot occupy CI capacity.
concurrency:
  group: isolated-db-stress-ci
  cancel-in-progress: true

jobs:
  mixed-load:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: blindleiadarts_ci
          MYSQL_USER: blindleiadarts_ci
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: PHP syntax check
        run: |
          php -l apps/api/src/Support/Config.php
          php -l apps/api/src/Support/Database.php
          php -l apps/api/src/Support/DatabaseConnectionGate.php
          php -l infra/deploy/generate_api_config.php
          php -l infra/sql/migrate.php
          php -l infra/sql/db_concurrency_probe.php
          php -l infra/sql/tournament_mixed_load_test.php
          php -l infra/sql/scolia_queue_virtual_test.php

      - name: Wait for matching TEST release
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 60); do
            release="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq "$EXPECTED_SHA" <<<"$release"; then
              echo "Matching TEST release is live."
              exit 0
            fi
            sleep 5
          done
          echo "DB stress validation requires the exact TEST release to be live." >&2
          exit 1

      - name: Configure isolated MySQL for trigger migrations
        run: |
          php -r '$db = new mysqli("127.0.0.1", "root", "ci-root-only", "blindleiadarts_ci", 3306); $db->query("SET GLOBAL log_bin_trust_function_creators = 1"); $db->close();'

      - name: Migrate isolated CI database
        run: php infra/sql/migrate.php
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: blindleiadarts_ci
          DB_USERNAME: blindleiadarts_ci
          DB_PASSWORD: ci-test-only
          DB_TABLE_PREFIX: bd_test_
          ISOLATED_CI_DATABASE: '1'

      - name: Generate isolated CI API config
        run: php infra/deploy/generate_api_config.php --output=apps/api/config.php
        env:
          APP_ENV: test
          BASE_URL: http://127.0.0.1
          STATIC_BASE_URL: http://127.0.0.1
          SCREEN_DEFAULT_CLUB_SLUG: blindleia-dartklubb
          REALTIME_WEBSOCKET_URL: ''
          REALTIME_PUBLISH_URL: ''
          REALTIME_PUBLISH_SECRET: ''
          SCOLIA_BRIDGE_SECRET: mixed-load-test-only
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: blindleiadarts_ci
          DB_USERNAME: blindleiadarts_ci
          DB_PASSWORD: ci-test-only
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_test_
          HARDWARE_TABLE_PREFIX: bd_test_
          # Exercise realistic parallel DB admission without touching the shared
          # hosted MySQL account used by PROD and TEST.
          DB_MAX_CONCURRENT_CONNECTIONS: '6'
          DB_CONNECTION_SLOT_START: '0'
          DB_CONNECTION_WAIT_MS: '15000'
          MEMBERS_SQLCONNECT_PATH: /tmp/unused-members-sqlconnect.php
          CHALLONGE_CLIENT_ID: ''
          CHALLONGE_CLIENT_SECRET: ''
          CHALLONGE_DEFAULT_SCOPES: ''
          CHALLONGE_REDIRECT_URI: ''

      - name: Verify six-slot DB admission gate
        run: php infra/sql/db_concurrency_probe.php

      - name: Run concurrent tournament mixed load
        run: php infra/sql/tournament_mixed_load_test.php

      - name: Run 10-board virtual Scolia queue test
        run: php infra/sql/scolia_queue_virtual_test.php
