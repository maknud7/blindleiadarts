name: Deploy Backend v2 TEST Target

on:
  push:
    branches:
      - ops/kiosk-audit-test-smoke-cleanup
    paths:
      - '.github/workflows/deploy-backend-v2-test-target.yml'

permissions:
  contents: read

concurrency:
  group: backend-v2-test-target-deploy
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-dahr6o2d0e5s738jbm4g
  HOST_URL: https://blindleia-backend-v2-test.onrender.com
  TARGET_SHA: 88e56428449ef09298b438f2e9f40d2282b81470

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate target is canonical develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          develop_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/develop | awk '{print $1}')"
          test "$develop_sha" = "$TARGET_SHA" || {
            echo "Refusing deploy: develop=$develop_sha target=$TARGET_SHA" >&2
            exit 1
          }

      - name: Set TEST release SHA and trigger exact Render deploy
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$RENDER_API_KEY"
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          curl --fail --silent --show-error --output /dev/null             -X PUT "$api/RELEASE_SHA"             -H "Authorization: Bearer $RENDER_API_KEY"             -H 'Accept: application/json'             -H 'Content-Type: application/json'             --data "$(jq -nc --arg value "$TARGET_SHA" '{value:$value}')"

          response="$(mktemp)"
          curl --fail --silent --show-error --output "$response"             -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"             -H "Authorization: Bearer $RENDER_API_KEY"             -H 'Accept: application/json'             -H 'Content-Type: application/json'             --data "$(jq -nc --arg commitId "$TARGET_SHA" '{clearCache:"do_not_clear",commitId:$commitId}')"
          deploy_id="$(jq -r '.id // empty' "$response")"
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Triggered TEST backend-v2 deploy $deploy_id for $TARGET_SHA"

      - name: Wait for exact TEST backend readiness
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 72); do
            health="$(curl -fsS --max-time 20 "$HOST_URL/health" || true)"
            if jq -e --arg sha "$TARGET_SHA" '
              .ok == true
              and .environment == "test"
              and .mode == "test-write"
              and .writes_armed == true
              and .runtime_prefix == "bd_test_"
              and .identity_prefix == "bd_prod_"
              and .hardware_prefix == "bd_prod_"
              and .release_sha == $sha
            ' <<<"$health" >/dev/null 2>&1; then
              echo "$health" | jq '{ok,environment,mode,writes_armed,runtime_prefix,identity_prefix,hardware_prefix,release_sha,connection_mode,max_connections}'
              exit 0
            fi
            sleep 5
          done
          echo "TEST backend-v2 never reached target release $TARGET_SHA" >&2
          curl -sS --max-time 20 "$HOST_URL/health" || true
          exit 1

      - name: Verify DB readiness
        run: |
          set -Eeuo pipefail
          ready="$(curl -fsS --max-time 20 "$HOST_URL/ready")"
          jq -e '.ok == true and .environment == "test" and .mode == "test-write" and .writes_armed == true' <<<"$ready" >/dev/null
          echo "Backend v2 TEST ready."
