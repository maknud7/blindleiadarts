name: Backend v2 Runtime

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/**'
      - 'apps/api/src/Service/CanonicalScoringService.php'
      - 'apps/api/src/Service/Dart501Rules.php'
      - 'apps/api/src/Service/EloCalculator.php'
      - 'apps/api/src/Service/LinearRankingService.php'
      - 'apps/api/src/Service/PlayoffReconciliationService.php'
      - 'apps/api/src/Service/SingleEliminationService.php'
      - 'apps/api/src/Service/ScoliaSectorMapper.php'
      - 'apps/api/src/Service/ScoliaScoringService.php'
      - 'apps/api/src/Repository/EloLedgerRepository.php'
      - 'apps/api/src/Repository/TournamentEloSnapshotRepository.php'
      - 'apps/api/src/Repository/TournamentPlayoffRepository.php'
      - 'apps/api/src/Repository/PlayerPortalRepository.php'
      - 'apps/api/src/Repository/MatchScoringRepository.php'
      - 'apps/api/src/Repository/ScoliaRoutedEventRepository.php'
      - 'apps/api/src/Repository/ValidationException.php'
      - 'apps/api/src/Support/Config.php'
      - 'package.json'
      - '.github/workflows/backend-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript toolchain
        run: npm install --no-package-lock --ignore-scripts

      - name: Typecheck backend v2
        run: npm run backend-v2:typecheck

      - name: Verify PHP and TypeScript scoring parity
        run: npm run backend-v2:test

      - name: Verify guarded runtime architecture
        run: |
          set -Eeuo pipefail
          test -f apps/backend-v2/src/server.ts
          test -f apps/backend-v2/src/domain/elo.ts
          test -f apps/backend-v2/src/domain/single-elimination.ts
          test -f apps/backend-v2/src/mysql/mysql2-session-provider.ts
          test -f apps/backend-v2/src/mysql/canonical-scoring-state.ts
          test -f apps/backend-v2/src/mysql/canonical-elo-ledger.ts
          test -f apps/backend-v2/src/mysql/tournament-elo-projection.ts
          test -f apps/backend-v2/src/mysql/linear-ranking-projection.ts
          test -f apps/backend-v2/src/mysql/canonical-playoff-reconciliation.ts
          test -f apps/backend-v2/src/runtime/config.ts
          test -f apps/backend-v2/src/runtime/preflight.ts
          test -f apps/backend-v2/src/runtime/canonical-realtime-publisher.ts
          test -f apps/backend-v2/src/service/canonical-scoring-service.ts
          ! test -e apps/backend-v2/src/runtime/core-only-side-effects.ts
          ! test -e apps/backend-v2/src/mysql/core-only-mutation-guard.ts

          grep -Fq 'from "mysql2/promise"' apps/backend-v2/src/mysql/mysql2-session-provider.ts
          if grep -R -n -F --exclude='mysql2-session-provider.ts' 'from "mysql2/promise"' apps/backend-v2/src; then
            echo 'mysql2/promise may only be imported by mysql2-session-provider.ts' >&2
            exit 1
          fi
          if grep -R -n -F 'from "mysql2"' apps/backend-v2/src; then
            echo 'Use the guarded promise provider instead of importing mysql2 directly.' >&2
            exit 1
          fi
          ! grep -R -n -E '\bcreatePool\b|\.getConnection\(' apps/backend-v2/src/mysql

          grep -Fq 'connectionReuse: "idle-reuse"' apps/backend-v2/src/server.ts
          grep -Fq 'idle-reuse requires exactly one backend-v2 MySQL connection slot' apps/backend-v2/src/mysql/mysql2-session-provider.ts
          grep -Fq 'BD_BACKEND_V2_DB_IDLE_MS' apps/backend-v2/src/runtime/config.ts
          grep -Fq 'Never auto-retry a unit of work' apps/backend-v2/src/mysql/mysql2-session-provider.ts

          grep -Fq 'may not exceed 2 during coexistence with PHP' apps/backend-v2/src/runtime/config.ts
          grep -Fq 'DB_TABLE_PREFIX=bd_test_' apps/backend-v2/src/runtime/config.ts
          grep -Fq 'DB_TABLE_PREFIX=bd_prod_' apps/backend-v2/src/runtime/config.ts
          grep -Fq 'Backend v2 MySQL executor is read-only' apps/backend-v2/src/mysql/mysql2-session-provider.ts

          # All canonical adapters now exist, but PROD writes remain compile-time
          # blocked until hosted TEST proves the complete playoff lifecycle.
          grep -Fq 'const FULL_CANONICAL_SIDE_EFFECTS_READY = false' apps/backend-v2/src/runtime/config.ts

          grep -Fq 'CanonicalEloPort' apps/backend-v2/src/service/canonical-scoring-service.ts
          grep -Fq 'CanonicalPlayoffPort' apps/backend-v2/src/service/canonical-scoring-service.ts
          grep -Fq 'CanonicalTournamentEloPort' apps/backend-v2/src/service/canonical-scoring-service.ts
          grep -Fq 'CanonicalRankingPort' apps/backend-v2/src/service/canonical-scoring-service.ts
          grep -Fq 'CanonicalRealtimePort' apps/backend-v2/src/service/canonical-scoring-service.ts
          ! grep -Fq 'CanonicalProjectionPort' apps/backend-v2/src/service/canonical-scoring-service.ts

          grep -Fq 'new MySqlCanonicalEloLedger' apps/backend-v2/src/server.ts
          grep -Fq 'new MySqlCanonicalPlayoffReconciliation' apps/backend-v2/src/server.ts
          grep -Fq 'new MySqlTournamentEloProjection' apps/backend-v2/src/server.ts
          grep -Fq 'new MySqlLinearRankingProjection' apps/backend-v2/src/server.ts
          grep -Fq 'new CanonicalRealtimePublisher' apps/backend-v2/src/server.ts
          ! grep -Fq 'CoreOnlyCanonicalSideEffects' apps/backend-v2/src/server.ts
          ! grep -Fq 'MySqlCoreOnlyMutationGuard' apps/backend-v2/src/server.ts

          grep -Fq 'FOR UPDATE' apps/backend-v2/src/mysql/tournament-elo-projection.ts
          grep -Fq 'FOR UPDATE' apps/backend-v2/src/mysql/linear-ranking-projection.ts
          grep -Fq 'FOR UPDATE' apps/backend-v2/src/mysql/canonical-playoff-reconciliation.ts
          grep -Fq 'planned_auto_create_playoff' apps/backend-v2/src/mysql/canonical-playoff-reconciliation.ts
          grep -Fq 'playoff_downstream_started' apps/backend-v2/src/mysql/canonical-playoff-reconciliation.ts
          grep -Fq 'linear_v1' apps/backend-v2/src/mysql/linear-ranking-projection.ts
          grep -Fq 'season_ranking_events' apps/backend-v2/src/mysql/linear-ranking-projection.ts
          grep -Fq 'event: "snapshot"' apps/backend-v2/src/runtime/canonical-realtime-publisher.ts
