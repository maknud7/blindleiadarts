name: Deploy Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Validate shared repository credentials
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOMENESHOP_SSH_PRIVATE_KEY: ${{ secrets.DOMENESHOP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD DOMENESHOP_SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository is missing required shared credential: ${name}"
              exit 1
            fi
          done
          echo "Shared repository credentials are present."

      - name: Run test database migrations
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Build test release package
        run: bash infra/deploy/build-release.sh test

      - name: Verify onboarding release contents
        run: |
          set -euo pipefail
          test -f dist/test/onboarding/index.html
          test -f dist/test/onboarding/app.js
          test -f dist/test/onboarding/styles.css
          test -f dist/test/api/member-onboarding.php
          test -f dist/test/kiosk/test-mode.js
          test -f dist/test/api/kiosk-test-mode.php
          echo "Test release contents are present."

      - name: Generate API config
        run: |
          php infra/deploy/generate_api_config.php --output=dist/test/api/config.php
          cp dist/test/api/config.php apps/api/config.php
        env:
          APP_ENV: test
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          STATIC_BASE_URL: ${{ vars.TEST_STATIC_BASE_URL || vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          SCREEN_DEFAULT_CLUB_SLUG: ${{ vars.TEST_SCREEN_CLUB_SLUG || 'blindleia-dartklubb' }}
          REALTIME_WEBSOCKET_URL: ${{ vars.TEST_REALTIME_WEBSOCKET_URL }}
          REALTIME_PUBLISH_URL: ${{ vars.TEST_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          MEMBERS_SQLCONNECT_PATH: /home/1/i/ingenting/dart/sqlconnect.php
          DARTSATLAS_SEASON_ID: ${{ vars.DARTSATLAS_SEASON_ID || 'rFByCgOqI1rq' }}
          DARTSATLAS_TOURNAMENT_ID: ${{ vars.DARTSATLAS_TOURNAMENT_ID }}
          DARTSATLAS_CLUB_ID: ${{ vars.DARTSATLAS_CLUB_ID }}
          DARTSATLAS_LOCAL_SEASON_ID: ${{ vars.DARTSATLAS_LOCAL_SEASON_ID }}
          DARTSATLAS_MEMBERS_TABLE: medlemmer
          DARTSATLAS_POLL_INTERVAL_SECONDS: ${{ vars.DARTSATLAS_POLL_INTERVAL_SECONDS }}
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
          CHALLONGE_DEFAULT_SCOPES: ${{ vars.CHALLONGE_DEFAULT_SCOPES }}
          CHALLONGE_REDIRECT_URI: ${{ vars.TEST_CHALLONGE_REDIRECT_URI }}

      - name: Verify internal schema readiness
        run: php apps/api/bin/dartsatlas_doctor.php | tee dist/test/schema-health.json

      - name: Configure Domeneshop SSH
        env:
          DOMENESHOP_SSH_PRIVATE_KEY: ${{ secrets.DOMENESHOP_SSH_PRIVATE_KEY }}
        run: bash infra/deploy/configure-domeneshop-ssh.sh

      - name: Deploy test over SSH
        run: bash infra/deploy/deploy-over-ssh.sh dist/test /www/blindleiadarts/test

      - name: Verify exact deployed release and internal health
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TEST_ROOT="${TEST_BASE_URL:-https://test.blindleiadarts.ingenting.org}"
          TEST_ROOT="${TEST_ROOT%/}"

          echo "Verifying exact release SHA at ${TEST_ROOT}"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            "${TEST_ROOT}/release.json?sha=${EXPECTED_SHA}" -o release.json
          php -r '
            $data = json_decode(file_get_contents("release.json"), true);
            $expected = getenv("EXPECTED_SHA");
            if (!is_array($data) || ($data["environment"] ?? null) !== "test" || ($data["sha"] ?? null) !== $expected) {
                fwrite(STDERR, "Release marker does not match expected test SHA.\n");
                exit(1);
            }
            echo "Release marker matches: {$expected}\n";
          '

          echo "Verifying internal API/database health"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            "${TEST_ROOT}/api/health.php?sha=${EXPECTED_SHA}" -o health.json
          cat health.json
          echo
          php -r '
            $data = json_decode(file_get_contents("health.json"), true);
            $expected = getenv("EXPECTED_SHA");
            if (!is_array($data) || !($data["ok"] ?? false)) {
                fwrite(STDERR, "Internal health endpoint is not healthy.\n");
                exit(1);
            }
            if (($data["release"]["sha"] ?? null) !== $expected) {
                fwrite(STDERR, "Health endpoint is running a different release SHA.\n");
                exit(1);
            }
            echo "Internal health is green.\n";
          '

          echo "Verifying user-facing entrypoints"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${TEST_ROOT}/admin/" -o /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${TEST_ROOT}/kiosk/" -o /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${TEST_ROOT}/onboarding/" -o /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${TEST_ROOT}/onboarding/index.html" -o /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${TEST_ROOT}/onboarding/app.js" -o /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${TEST_ROOT}/kiosk/test-mode.js" -o /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "${TEST_ROOT}/api/kiosk-test-mode.php" -o kiosk-test-mode.json

          php -r '
            $data = json_decode(file_get_contents("kiosk-test-mode.json"), true);
            if (!is_array($data) || !($data["ok"] ?? false)) {
                fwrite(STDERR, "Kiosk test-mode API is not available in the deployed test release.\n");
                exit(1);
            }
            echo "Kiosk test mode is reachable.\n";
          '

          ONBOARDING_API_STATUS=$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            --output /dev/null --write-out "%{http_code}" "${TEST_ROOT}/api/member-onboarding.php")
          if [ "$ONBOARDING_API_STATUS" != "401" ]; then
            echo "::error::Onboarding API should be reachable and require login; got HTTP ${ONBOARDING_API_STATUS}."
            exit 1
          fi
          echo "Onboarding frontend and API are reachable."
          echo "Blindleia test deployment verified for ${EXPECTED_SHA}."

      - name: Diagnose DartsAtlas Live from test host
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
        run: |
          TEST_ROOT="${TEST_BASE_URL:-https://test.blindleiadarts.ingenting.org}"
          LIVE_URL="${TEST_ROOT%/}/api/dartsatlas-live.php"
          echo "Checking external DartsAtlas runtime through ${LIVE_URL}"

          HTTP_STATUS=$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --output dartsatlas-live.json --write-out "%{http_code}" "${LIVE_URL}" || echo "000")

          echo "DartsAtlas Live HTTP status: ${HTTP_STATUS}"
          echo "--- DartsAtlas Live response ---"
          cat dartsatlas-live.json 2>/dev/null || true
          echo
          echo "--- end response ---"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::External DartsAtlas runtime returned HTTP ${HTTP_STATUS}. The Blindleia deployment itself is healthy."
            exit 0
          fi

          php -r '
            $raw = file_get_contents("dartsatlas-live.json");
            $data = json_decode($raw, true);
            if (!is_array($data) || !($data["ok"] ?? false)) {
                fwrite(STDERR, "::warning::DartsAtlas Live returned HTTP 200 but ok was not true.\n");
                exit(0);
            }
            $payload = $data["data"] ?? [];
            $tournament = $payload["tournament"] ?? null;
            $feed = $payload["feed"] ?? [];
            if ($tournament === null) {
                fwrite(STDERR, "::warning::DartsAtlas Live is reachable, but no tournament is available yet.\n");
                exit(0);
            }
            echo "DartsAtlas Live reachable. Tournament: " . ($tournament["name"] ?? "unknown") . "\n";
            echo "Feed status: " . ($feed["status"] ?? "unknown") . "\n";
          '
