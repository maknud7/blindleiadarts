name: Deploy Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Run test database migrations
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Build test release package
        run: bash infra/deploy/build-release.sh test

      - name: Generate API config
        run: |
          php infra/deploy/generate_api_config.php --output=dist/test/api/config.php
          cp dist/test/api/config.php apps/api/config.php
        env:
          APP_ENV: test
          BASE_URL: ${{ vars.TEST_BASE_URL }}
          STATIC_BASE_URL: ${{ vars.TEST_STATIC_BASE_URL }}
          SCREEN_DEFAULT_CLUB_SLUG: ${{ vars.TEST_SCREEN_CLUB_SLUG || 'blindleia-dartklubb' }}
          REALTIME_WEBSOCKET_URL: ${{ vars.TEST_REALTIME_WEBSOCKET_URL }}
          REALTIME_PUBLISH_URL: ${{ vars.TEST_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          MEMBERS_SQLCONNECT_PATH: /home/1/i/ingenting/dart/sqlconnect.php
          DARTSATLAS_SEASON_ID: ${{ vars.DARTSATLAS_SEASON_ID || 'rFByCgOqI1rq' }}
          DARTSATLAS_TOURNAMENT_ID: ${{ vars.DARTSATLAS_TOURNAMENT_ID }}
          DARTSATLAS_CLUB_ID: ${{ vars.DARTSATLAS_CLUB_ID }}
          DARTSATLAS_LOCAL_SEASON_ID: ${{ vars.DARTSATLAS_LOCAL_SEASON_ID }}
          DARTSATLAS_MEMBERS_TABLE: medlemmer
          DARTSATLAS_POLL_INTERVAL_SECONDS: ${{ vars.DARTSATLAS_POLL_INTERVAL_SECONDS }}
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
          CHALLONGE_DEFAULT_SCOPES: ${{ vars.CHALLONGE_DEFAULT_SCOPES }}
          CHALLONGE_REDIRECT_URI: ${{ vars.TEST_CHALLONGE_REDIRECT_URI }}

      - name: Verify DartsAtlas database readiness
        run: php apps/api/bin/dartsatlas_doctor.php | tee dist/test/dartsatlas-health.json

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Ensure remote test directories exist
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_ROOT: /www/blindleiadarts/test
        run: |
          {
            echo "-mkdir ${REMOTE_ROOT}"
            find dist/test -type d | sed 's#^dist/test##' | sed '/^$/d' | while read -r dir; do
              echo "-mkdir ${REMOTE_ROOT}${dir}"
            done
            echo "quit"
          } > sftp-batch.txt
          sshpass -p "$SFTP_PASSWORD" sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -b sftp-batch.txt "${SFTP_USERNAME}@${SFTP_HOST}" || true

      - name: Deploy test via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: ./dist/test/*
          remote_path: /www/blindleiadarts/test
          sftp_only: true
          rsyncArgs: --exclude=.git --exclude=.github --exclude=docs --exclude=infra/sql

      - name: Verify admin and kiosk deployment
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
        run: |
          TEST_ROOT="${TEST_BASE_URL:-https://test.blindleiadarts.ingenting.org}"
          ADMIN_URL="${TEST_ROOT%/}/admin/"
          KIOSK_URL="${TEST_ROOT%/}/kiosk/"
          ADMIN_API_URL="${TEST_ROOT%/}/api/dartsatlas-admin.php"

          echo "Verifying admin page: ${ADMIN_URL}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 "${ADMIN_URL}" -o admin.html
          grep -q "Kiosker / boards" admin.html || {
            echo "Admin page is missing or an old build is still served."
            exit 1
          }

          echo "Verifying board terminal: ${KIOSK_URL}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 "${KIOSK_URL}" -o kiosk.html
          grep -q "Board Terminal" kiosk.html || {
            echo "Board Terminal is missing or an old kiosk build is still served."
            exit 1
          }

          echo "Verifying DartsAtlas admin endpoint exists: ${ADMIN_API_URL}"
          STATUS=$(curl --silent --show-error --output admin-api.json --write-out "%{http_code}" --max-time 30 "${ADMIN_API_URL}")
          if [ "$STATUS" = "404" ] || [ "$STATUS" = "000" ]; then
            echo "DartsAtlas admin endpoint is not deployed (HTTP ${STATUS})."
            cat admin-api.json || true
            exit 1
          fi
          echo "Admin and kiosk deployment verified (admin endpoint HTTP ${STATUS}; 401 without token is expected)."

      - name: Bootstrap and verify DartsAtlas from test host
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
        run: |
          TEST_ROOT="${TEST_BASE_URL:-https://test.blindleiadarts.ingenting.org}"
          LIVE_URL="${TEST_ROOT%/}/api/dartsatlas-live.php"
          echo "Verifying DartsAtlas through ${LIVE_URL}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 90 "${LIVE_URL}" -o dartsatlas-live.json
          php -r '
            $data = json_decode(file_get_contents("dartsatlas-live.json"), true);
            if (!is_array($data) || !($data["ok"] ?? false)) {
                fwrite(STDERR, "DartsAtlas live endpoint did not return ok=true\n");
                fwrite(STDERR, file_get_contents("dartsatlas-live.json") . "\n");
                exit(1);
            }
            $payload = $data["data"] ?? [];
            if (($payload["tournament"] ?? null) === null) {
                fwrite(STDERR, "DartsAtlas bootstrap returned no tournament.\n");
                fwrite(STDERR, file_get_contents("dartsatlas-live.json") . "\n");
                exit(1);
            }
            $feed = $payload["feed"] ?? [];
            echo "DartsAtlas test host verified. Tournament: " . ($payload["tournament"]["name"] ?? "unknown") . "\n";
            echo "Feed status: " . ($feed["status"] ?? "unknown") . "\n";
          '
