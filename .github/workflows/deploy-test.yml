name: Deploy Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Run test database migrations
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Build test release package
        run: bash infra/deploy/build-release.sh test

      - name: Generate API config
        run: |
          php infra/deploy/generate_api_config.php --output=dist/test/api/config.php
          cp dist/test/api/config.php apps/api/config.php
        env:
          APP_ENV: test
          BASE_URL: ${{ vars.TEST_BASE_URL }}
          STATIC_BASE_URL: ${{ vars.TEST_STATIC_BASE_URL }}
          SCREEN_DEFAULT_CLUB_SLUG: ${{ vars.TEST_SCREEN_CLUB_SLUG || 'blindleia-dartklubb' }}
          REALTIME_WEBSOCKET_URL: ${{ vars.TEST_REALTIME_WEBSOCKET_URL }}
          REALTIME_PUBLISH_URL: ${{ vars.TEST_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          MEMBERS_DB_HOST: ${{ secrets.MEMBERS_DB_HOST }}
          MEMBERS_DB_PORT: ${{ secrets.MEMBERS_DB_PORT }}
          MEMBERS_DB_NAME: ${{ secrets.MEMBERS_DB_NAME }}
          MEMBERS_DB_USERNAME: ${{ secrets.MEMBERS_DB_USERNAME }}
          MEMBERS_DB_PASSWORD: ${{ secrets.MEMBERS_DB_PASSWORD }}
          DARTSATLAS_SEASON_ID: ${{ vars.DARTSATLAS_SEASON_ID }}
          DARTSATLAS_TOURNAMENT_ID: ${{ vars.DARTSATLAS_TOURNAMENT_ID }}
          DARTSATLAS_CLUB_ID: ${{ vars.DARTSATLAS_CLUB_ID }}
          DARTSATLAS_LOCAL_SEASON_ID: ${{ vars.DARTSATLAS_LOCAL_SEASON_ID }}
          DARTSATLAS_MEMBERS_TABLE: medlemmer
          DARTSATLAS_POLL_INTERVAL_SECONDS: ${{ vars.DARTSATLAS_POLL_INTERVAL_SECONDS }}
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
          CHALLONGE_DEFAULT_SCOPES: ${{ vars.CHALLONGE_DEFAULT_SCOPES }}
          CHALLONGE_REDIRECT_URI: ${{ vars.TEST_CHALLONGE_REDIRECT_URI }}

      - name: Verify DartsAtlas database readiness
        run: php apps/api/bin/dartsatlas_doctor.php | tee dist/test/dartsatlas-health.json

      - name: Seed DartsAtlas season into test database
        run: php apps/api/bin/dartsatlas_sync.php --season-id="${DARTSATLAS_SEASON_ID:-rFByCgOqI1rq}" | tee dist/test/dartsatlas-sync.json
        env:
          DARTSATLAS_SEASON_ID: ${{ vars.DARTSATLAS_SEASON_ID }}

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Ensure remote test directories exist
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_ROOT: /www/blindleiadarts/test
        run: |
          {
            echo "-mkdir ${REMOTE_ROOT}"
            find dist/test -type d | sed 's#^dist/test##' | sed '/^$/d' | while read -r dir; do
              echo "-mkdir ${REMOTE_ROOT}${dir}"
            done
            echo "quit"
          } > sftp-batch.txt
          sshpass -p "$SFTP_PASSWORD" sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -b sftp-batch.txt "${SFTP_USERNAME}@${SFTP_HOST}" || true

      - name: Deploy test via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: ./dist/test/*
          remote_path: /www/blindleiadarts/test
          sftp_only: true
          rsyncArgs: --exclude=.git --exclude=.github --exclude=docs --exclude=infra/sql
