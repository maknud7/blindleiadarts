name: Deploy Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Validate deployment configuration
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$BASE_URL"
          test -n "$DB_HOST"
          test -n "$DB_NAME"
          test -n "$SFTP_HOST"
          test -n "$SFTP_USERNAME"
          test -n "$SFTP_PASSWORD"

      - name: Migrate test database
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Build test release package
        run: bash infra/deploy/build-release.sh test

      - name: Generate API config
        run: php infra/deploy/generate_api_config.php --output=dist/test/api/config.php
        env:
          APP_ENV: test
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          STATIC_BASE_URL: ${{ vars.TEST_STATIC_BASE_URL || vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          SCREEN_DEFAULT_CLUB_SLUG: blindleia-dartklubb
          REALTIME_WEBSOCKET_URL: ${{ vars.TEST_REALTIME_WEBSOCKET_URL }}
          REALTIME_PUBLISH_URL: ${{ vars.TEST_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          SCOLIA_BRIDGE_SECRET: ${{ secrets.SCOLIA_BRIDGE_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
          MEMBERS_SQLCONNECT_PATH: /home/1/i/ingenting/dart/sqlconnect.php
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
          CHALLONGE_DEFAULT_SCOPES: ${{ vars.CHALLONGE_DEFAULT_SCOPES }}
          CHALLONGE_REDIRECT_URI: ${{ vars.TEST_CHALLONGE_REDIRECT_URI || 'https://test.blindleiadarts.ingenting.org/api/v1/connectors/challonge/callback' }}

      - name: Verify shared production identity boundary
        run: php infra/sql/shared_identity_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_prod_

      - name: Package sanity check
        run: |
          set -Eeuo pipefail
          test -f dist/test/release.json
          test -f dist/test/api/src/EmailAuthApplication.php
          test -f dist/test/api/src/PasswordResetApplication.php
          test -f dist/test/api/src/ActivityApplication.php
          test -f dist/test/api/src/Repository/ActivityRepository.php
          test -f dist/test/api/src/ScoliaApplication.php
          test -f dist/test/api/src/SeasonApplication.php
          test -f dist/test/api/src/Repository/SeasonRepository.php
          test -f dist/test/api/src/TournamentCheckinApplication.php
          test -f dist/test/admin/scolia-admin.js
          test -f dist/test/admin/season-admin.js
          test -f dist/test/admin/checkin-admin-v2.js
          test -f dist/test/admin/tournament-wizard-v2.js
          test -f dist/test/admin/admin-ux.js
          test -f dist/test/admin/admin-ux.css
          test -f dist/test/admin/activity-admin.js
          test -f dist/test/player/checkin-runtime.js
          test -f dist/test/player/player-ux.js
          test -f dist/test/player/player-ux.css
          test -f dist/test/onboarding/index.html
          test -f dist/test/onboarding/styles.css
          test -f dist/test/onboarding/app.js
          test -f dist/test/live/index.html
          test -f dist/test/live/styles.css
          test -f dist/test/screen/index.html
          test -f dist/test/screen/screen-ux.css
          test -f dist/test/packages/ui-assets/mobile-portal.css
          test -f dist/test/packages/ui-assets/portal-brand.css
          test -f dist/test/packages/ui-assets/activity.js
          test -f dist/test/screen/checkin-display.js
          test -f dist/test/kiosk/manifest.webmanifest
          test -f dist/test/kiosk/service-worker.js
          test -f dist/test/kiosk/install.js
          test -f dist/test/kiosk/admin-mode.js
          test -f dist/test/kiosk/brand-light.css
          test -f dist/test/kiosk/tablet-portrait.css
          grep -Fq 'viewport-fit=cover' dist/test/onboarding/index.html
          grep -Fq 'data-toggle-password' dist/test/onboarding/index.html
          grep -Fq 'portal-brand.css' dist/test/packages/ui-assets/portal-menu.js
          grep -Fq 'mobile-portal.css' dist/test/packages/ui-assets/portal-menu.js
          grep -Fq '/packages/ui-assets/activity.js' dist/test/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/admin/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/player/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/live/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/screen/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/kiosk/index.html
          grep -Fq '/packages/ui-assets/activity.js' dist/test/onboarding/index.html
          grep -Fq 'viewport-fit=cover' dist/test/live/index.html
          grep -Fq 'blindleia-dartklubb-logo.png' dist/test/live/index.html
          grep -Fq 'screen-ux.css' dist/test/screen/index.html
          ! grep -Fq 'Skive = kiosk' dist/test/screen/index.html
          grep -Fq '2201' dist/test/kiosk/admin-mode.js
          grep -Fq 'blindleia-dartklubb-logo.png' dist/test/kiosk/manifest.webmanifest
          grep -Fq '"orientation": "portrait"' dist/test/kiosk/manifest.webmanifest
          grep -Fq './brand-light.css' dist/test/kiosk/index.html
          grep -Fq './tablet-portrait.css' dist/test/kiosk/index.html
          grep -Fq 'height: 100dvh' dist/test/kiosk/tablet-portrait.css
          grep -Fq 'overflow: hidden' dist/test/kiosk/tablet-portrait.css
          grep -Fq 'tablet-portrait.css' dist/test/kiosk/service-worker.js
          grep -Fq 'type="email" placeholder="E-postadresse"' dist/test/player/index.html
          grep -Fq '<span>E-postadresse</span>' dist/test/admin/index.html
          grep -Fq '>Personer</a>' dist/test/admin/index.html
          grep -Fq '>Utstyr</a>' dist/test/admin/index.html
          grep -Fq '>Min profil</a>' dist/test/player/index.html
          grep -Fq 'Neste anbefalte steg' dist/test/admin/admin-ux.js
          grep -Fq 'Akkurat nå' dist/test/player/player-ux.js
          grep -Fq 'DEFAULT_CLUB_SLUG = "blindleia-dartklubb"' dist/test/packages/ui-assets/activity.js
          grep -Fq "'table_prefix' => 'bd_test_'" dist/test/api/config.php
          grep -Fq "'identity_table_prefix' => 'bd_prod_'" dist/test/api/config.php
          grep -Fq "'hardware_table_prefix' => 'bd_prod_'" dist/test/api/config.php

      - name: Deploy test via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: ./dist/test/*
          remote_path: /www/blindleiadarts/test
          sftp_only: true
          rsyncArgs: --exclude=.git --exclude=.github --exclude=docs --exclude=infra/sql

      - name: Verify deployed test environment
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"

          fetch_contains() {
            local label="$1"
            local url="$2"
            local needle="$3"
            local body=""
            local request_url=""
            for attempt in 1 2 3 4; do
              request_url="${url}$([[ "$url" == *\?* ]] && printf '&' || printf '?')cb=$RANDOM"
              body="$(curl -fsS --max-time 20 "$request_url" || true)"
              if printf '%s' "$body" | grep -Fq "$needle"; then
                echo "VERIFY_OK=$label"
                return 0
              fi
              echo "Retrying $label ($attempt/4)"
              sleep $((attempt * 2))
            done
            echo "::error::Deployment verification failed: $label"
            return 1
          }

          fetch_ok() {
            local label="$1"
            local url="$2"
            for attempt in 1 2 3 4; do
              if curl -fsS --max-time 20 "${url}?cb=$RANDOM" >/dev/null; then
                echo "VERIFY_OK=$label"
                return 0
              fi
              echo "Retrying $label ($attempt/4)"
              sleep $((attempt * 2))
            done
            echo "::error::Deployment verification failed: $label"
            return 1
          }

          fetch_contains "release environment" "$base/release.json" '"environment":"test"'
          fetch_contains "release sha" "$base/release.json" "$EXPECTED_SHA"
          fetch_ok "health" "$base/api/v1/health"
          fetch_contains "admin people" "$base/admin/" 'Personer'
          fetch_contains "admin equipment" "$base/admin/" 'Utstyr'
          fetch_contains "admin tournament room" "$base/admin/admin-ux.js" 'Neste anbefalte steg'
          fetch_contains "admin activity" "$base/admin/activity-admin.js" 'Aktivitet'
          fetch_contains "player profile" "$base/player/" 'Min profil'
          fetch_contains "player current state" "$base/player/player-ux.js" 'Akkurat nå'
          fetch_contains "onboarding viewport" "$base/onboarding/" 'viewport-fit=cover'
          fetch_contains "onboarding password toggle" "$base/onboarding/" 'data-toggle-password'
          fetch_contains "portal brand" "$base/packages/ui-assets/portal-menu.js" 'portal-brand.css'
          fetch_contains "mobile portal" "$base/packages/ui-assets/mobile-portal.css" 'Mobile navigation must expose every destination'
          fetch_contains "activity client" "$base/packages/ui-assets/activity.js" 'page_view'
          fetch_contains "public live logo" "$base/live/" 'blindleia-dartklubb-logo.png'
          fetch_contains "public live activity" "$base/live/" '/packages/ui-assets/activity.js'
          fetch_contains "public live viewport" "$base/live/" 'viewport-fit=cover'
          fetch_contains "screen ux" "$base/screen/" 'screen-ux.css'
          fetch_contains "screen matches" "$base/screen/" 'Kamper på skivene'
          fetch_contains "kiosk portrait css" "$base/kiosk/" 'tablet-portrait.css'
          fetch_contains "kiosk brand css" "$base/kiosk/" 'brand-light.css'
          fetch_contains "kiosk admin code" "$base/kiosk/admin-mode.js" '2201'
          fetch_contains "kiosk portrait manifest" "$base/kiosk/manifest.webmanifest" '"orientation": "portrait"'
          fetch_contains "kiosk viewport height" "$base/kiosk/tablet-portrait.css" 'height: 100dvh'
          fetch_contains "kiosk overflow" "$base/kiosk/tablet-portrait.css" 'overflow: hidden'

          activity_ok=no
          for attempt in 1 2 3 4 5 6; do
            activity="$(curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' \
              --data '{"events":[{"surface":"deploy","event_name":"deployment_verify","path":"/","club_slug":"blindleia-dartklubb","metadata":{"source":"deploy_test"}}]}' \
              "$base/api/v1/activity" || true)"
            if printf '%s' "$activity" | grep -Fq '"ok":true'; then
              activity_ok=yes
              echo "VERIFY_OK=activity write"
              break
            fi
            echo "Retrying activity write ($attempt/6)"
            sleep $((attempt * 4))
          done
          if [[ "$activity_ok" != yes ]]; then
            echo "::error::Deployment verification failed: activity write"
            exit 1
          fi
