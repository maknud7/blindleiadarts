name: Backend v2 System Health Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/src/BackendV2PlayerLiveProxyApplication.php'
      - 'apps/api/tests/backend_v2_player_live_proxy_routing_test.php'
      - '.github/workflows/backend-v2-system-health-frontdoor.yml'
  push:
    branches:
      - develop
    paths:
      - 'apps/api/src/BackendV2PlayerLiveProxyApplication.php'
      - 'apps/api/tests/backend_v2_player_live_proxy_routing_test.php'
      - '.github/workflows/backend-v2-system-health-frontdoor.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify system health routing contract
        run: |
          set -Eeuo pipefail
          php -l apps/api/src/BackendV2PlayerLiveProxyApplication.php
          php apps/api/tests/backend_v2_player_live_proxy_routing_test.php
          grep -Fq "'/v1/health' => \$config->backendV2AccountReadRoutingMode()" apps/api/src/BackendV2PlayerLiveProxyApplication.php
          grep -Fq "if (\$path === '/v1/health') return '/ready';" apps/api/src/BackendV2PlayerLiveProxyApplication.php
          grep -Fq "'connected' => true" apps/api/src/BackendV2PlayerLiveProxyApplication.php
          grep -Fq "'X-BD-Backend-V2: ' . \$frontdoor" apps/api/src/BackendV2PlayerLiveProxyApplication.php

  runtime-smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Wait for matching Deploy Test success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-test.yml/runs?head_sha=${EXPECTED_SHA}&per_page=10"
          for attempt in $(seq 1 120); do
            runs="$(curl -fsS --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            conclusion="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .conclusion // empty' <<<"$runs")"
            status="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .status // empty' <<<"$runs")"
            if [[ "$conclusion" == "success" ]]; then
              release="$(curl -fsS --max-time 15 "${BASE_URL%/}/release.json?cb=$RANDOM")"
              grep -Fq "$EXPECTED_SHA" <<<"$release"
              exit 0
            fi
            if [[ "$status" == "completed" && -n "$conclusion" ]]; then
              echo "Matching Deploy Test completed with conclusion: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for successful Deploy Test for $EXPECTED_SHA" >&2
          exit 1

      - name: Verify TEST health routes through backend-v2
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$base/api/v1/health" || true)"
          if [[ "$status" != "200" ]]; then
            echo "Health returned HTTP ${status:-unknown}; expected 200." >&2
            cat "$body" >&2
            exit 1
          fi
          grep -Eiq '^X-BD-Backend-V2:[[:space:]]*system-read' "$headers"
          jq -e '.ok == true and .status == "ok" and .environment == "test" and .database.connected == true and .database.table_prefix == "bd_test_"' "$body" >/dev/null
          rm -f "$headers" "$body"
