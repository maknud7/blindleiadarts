name: Backend v2 Equipment Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'apps/backend-v2/**'
      - 'infra/deploy/generate_api_config.php'
      - '.github/workflows/backend-v2-equipment-frontdoor.yml'
      - '.github/workflows/backend-v2-test-render-bootstrap.yml'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RENDER_SERVICE_ID: srv-dahr6o2d0e5s738jbm4g
  HOST_URL: https://blindleia-backend-v2-test.onrender.com
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  patch-source:
    if: github.head_ref == 'feat/backend-v2-scolia-ownership-delete-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-v2-scolia-ownership-delete-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply hardened delete parity patch
        run: |
          sed -i 's/if "countBoardMatchesWith(" not in text:/if "private async countBoardMatchesWith" not in text:/' .github/tmp-equipment-delete-patch.py
          python3 .github/tmp-equipment-delete-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/backend-v2/test/equipment-delete-parity.test.mjs')
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if 'assert.ok(statements.some' in line and 'bd_prod_${table}' in line:
                  lines[index] = '    assert.ok(statements.some((sql) => sql.includes("DELETE FROM `bd_prod_" + table + "`")));'
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Build and run focused contracts
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run backend-v2:build
          node --test apps/backend-v2/test/equipment-hardware-guard.test.mjs apps/backend-v2/test/scolia-bridge-ownership.test.mjs apps/backend-v2/test/equipment-delete-parity.test.mjs
          php apps/api/tests/backend_v2_equipment_proxy_routing_test.php
      - name: Commit tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backend-v2/src/mysql/equipment-admin-repository.ts apps/backend-v2/src/runtime/equipment-admin-router.ts apps/backend-v2/src/mysql/scolia-admin-repository.ts apps/backend-v2/test/equipment-delete-parity.test.mjs apps/api/src/BackendV2EquipmentProxyApplication.php apps/api/tests/backend_v2_equipment_proxy_routing_test.php .github/workflows/backend-v2-equipment-frontdoor.yml
          git commit -m 'Move physical board delete safety to backend-v2'
          git push origin HEAD:feat/backend-v2-scolia-ownership-delete-parity

  frontdoor-contract:
    if: github.head_ref != 'feat/backend-v2-scolia-ownership-delete-parity' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Syntax and fail-closed proxy contracts
        run: |
          set -Eeuo pipefail
          php -l apps/api/src/Service/BackendV2ApiAttemptException.php
          php -l apps/api/src/Service/BackendV2ApiClient.php
          php -l apps/api/src/BackendV2EquipmentProxyApplication.php
          php -l apps/api/kiosk-pairing.php
          php apps/api/tests/backend_v2_api_client_test.php
          php apps/api/tests/backend_v2_equipment_proxy_routing_test.php
          grep -Fq 'allowsPhpFallback(): bool' apps/api/src/Service/BackendV2ApiAttemptException.php
          grep -Fq 'return false;' apps/api/src/Service/BackendV2ApiAttemptException.php
          grep -Fq 'Never fall through to PHP after a remote attempt' apps/api/src/BackendV2EquipmentProxyApplication.php
          grep -Fq "!\$proxy->handles('DELETE', '/v1/clubs/1/kiosks/9')" apps/api/tests/backend_v2_equipment_proxy_routing_test.php

      - name: Verify independent TEST and PROD routing config
        env:
          SCOLIA_BRIDGE_SECRET: unit-test-secret
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: test
          DB_USERNAME: test
          DB_PASSWORD: test
        run: |
          set -Eeuo pipefail
          APP_ENV=test BASE_URL=https://example.test STATIC_BASE_URL=https://example.test DB_TABLE_PREFIX=bd_test_ \
            BACKEND_V2_EQUIPMENT_ROUTING_MODE=node BACKEND_V2_BASE_URL=https://backend-test.example \
            php infra/deploy/generate_api_config.php --output=/tmp/equipment-test.php
          php -r '$c=require "/tmp/equipment-test.php"; $b=$c["backend_v2"]??[]; if (($b["equipment_routing_mode"]??null)!=="node") exit(1); if (($b["scoring_routing_mode"]??null)!=="php") exit(1); if (($b["base_url"]??null)!=="https://backend-test.example") exit(1);'

          APP_ENV=prod BASE_URL=https://blindleiadart.ingenting.org STATIC_BASE_URL=https://blindleiadart.ingenting.org DB_TABLE_PREFIX=bd_prod_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            php infra/deploy/generate_api_config.php --output=/tmp/equipment-prod.php
          php -r '$c=require "/tmp/equipment-prod.php"; $b=$c["backend_v2"]??[]; if (($b["equipment_routing_mode"]??null)!=="node") exit(1); if (($b["scoring_routing_mode"]??null)!=="candidate") exit(1);'

      - name: Validate TEST Render deploy credential
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$RENDER_API_KEY" || { echo 'RENDER_API_KEY is required for persistent TEST backend-v2.' >&2; exit 1; }

      # Persistent TEST environment/prefix/secret configuration belongs to the
      # bootstrap workflow. Updating env vars here caused Render to redeploy once
      # for the env change and then again for the exact commit below, interrupting
      # live TEST sessions during ordinary PR verification.
      - name: Deploy exact PR backend-v2 release to TEST Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --output /dev/null \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg commitId "$RELEASE_SHA" '{clearCache:"do_not_clear",commitId:$commitId}')"

      - name: Verify persistent TEST backend-v2 target
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 60); do
            health="$(curl -fsS --max-time 20 "${HOST_URL%/}/health" || true)"
            if jq -e --arg sha "$RELEASE_SHA" '.ok == true and .environment == "test" and .mode == "test-write" and .writes_armed == true and .runtime_prefix == "bd_test_" and .identity_prefix == "bd_prod_" and .hardware_prefix == "bd_prod_" and .max_connections == 1 and .connection_mode == "idle-reuse" and .release_sha == $sha' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          health="$(curl -fsS --max-time 20 "${HOST_URL%/}/health")"
          jq -e --arg sha "$RELEASE_SHA" '.ok == true and .environment == "test" and .mode == "test-write" and .writes_armed == true and .runtime_prefix == "bd_test_" and .identity_prefix == "bd_prod_" and .hardware_prefix == "bd_prod_" and .max_connections == 1 and .connection_mode == "idle-reuse" and .release_sha == $sha' <<<"$health" >/dev/null
          ready="$(curl -fsS --max-time 20 "${HOST_URL%/}/ready")"
          jq -e '.ok == true and .environment == "test" and .mode == "test-write" and .writes_armed == true and (.checked_tables | type == "array") and (.checked_tables | length > 0)' <<<"$ready" >/dev/null
          echo 'Persistent TEST backend-v2 host is ready and connected to bd_test_.'
