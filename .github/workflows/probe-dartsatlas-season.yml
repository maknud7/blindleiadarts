name: Probe DartsAtlas season live

on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/api/dartsatlas-public-current.php'
      - '.github/workflows/probe-dartsatlas-season.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact Blindleia season page
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            -A 'BlindleiaDarts/1.0 (+https://dart.ingenting.org)' \
            'https://www.dartsatlas.com/seasons/rFByCgOqI1rq' -o season.html
          test -s season.html

      - name: Show safe tournament/date snippets
        run: |
          php -r '
            $html = file_get_contents("season.html");
            $doc = new DOMDocument();
            libxml_use_internal_errors(true);
            $doc->loadHTML($html);
            libxml_clear_errors();
            $xp = new DOMXPath($doc);
            $seen = [];
            foreach ($xp->query("//a[contains(@href,\"/tournaments/\")]") as $a) {
              if (!$a instanceof DOMElement) continue;
              $href = $a->getAttribute("href");
              if (isset($seen[$href])) continue;
              $seen[$href] = true;
              $node = $a;
              for ($i = 0; $i < 5 && $node instanceof DOMElement; $i++, $node = $node->parentNode) {
                $text = preg_replace("/\\s+/u", " ", trim($node->textContent));
                if (preg_match("/(24\\s+August,?\\s+2026|18:15|6:15pm|6:15 pm)/iu", $text)) {
                  echo "HREF=" . $href . "\n";
                  echo "TEXT=" . mb_substr($text, 0, 600) . "\n---\n";
                  break;
                }
              }
            }
            if (!$seen) { fwrite(STDERR, "No tournament links found on season page.\n"); exit(1); }
          '
