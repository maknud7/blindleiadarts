name: Backend v2 TEST E2E

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/prod-release-request'
      - '.github/prod-snapshot-request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-v2-test-e2e
  cancel-in-progress: false

jobs:
  scoring-lifecycle:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout exact candidate release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for this SHA to be live in TEST
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 60); do
            release="$(curl -fsS --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq '"environment":"test"' <<<"$release" && grep -Fq "$EXPECTED_SHA" <<<"$release"; then
              echo "TEST release matches $EXPECTED_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "TEST never exposed expected release SHA $EXPECTED_SHA; refusing backend-v2 write E2E." >&2
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript toolchain
        run: npm install --no-package-lock --ignore-scripts

      - name: Build backend v2
        run: npm run backend-v2:build

      - name: Generate loopback-only E2E token
        shell: bash
        run: echo "BD_BACKEND_V2_INTERNAL_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # ELO is intentionally first. It is the most connection-sensitive fixture
      # and should not start immediately after another DB-heavy E2E scenario.
      # Canonical write units are never automatically retried.
      - name: Run canonical ELO lifecycle against TEST MySQL
        env:
          BD_APP_ENV: test
          BD_BACKEND_V2_MODE: test-write
          BD_BACKEND_V2_MAX_CONNECTIONS: '1'
          BD_BACKEND_V2_ACQUIRE_TIMEOUT_MS: '5000'
          BD_BACKEND_V2_CONNECT_TIMEOUT_MS: '30000'
          HOST: 127.0.0.1
          PORT: '18083'
          RELEASE_SHA: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
        run: node apps/backend-v2/e2e/elo-lifecycle.mjs

      - name: Release hosted MySQL connection budget after ELO
        run: sleep 5

      - name: Run canonical linear ranking lifecycle against TEST MySQL
        env:
          BD_APP_ENV: test
          BD_BACKEND_V2_MODE: test-write
          BD_BACKEND_V2_MAX_CONNECTIONS: '1'
          BD_BACKEND_V2_ACQUIRE_TIMEOUT_MS: '5000'
          BD_BACKEND_V2_CONNECT_TIMEOUT_MS: '30000'
          HOST: 127.0.0.1
          PORT: '18084'
          RELEASE_SHA: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
        run: node apps/backend-v2/e2e/linear-ranking-lifecycle.mjs

      - name: Release hosted MySQL connection budget after ranking
        run: sleep 5

      - name: Run canonical scoring lifecycle against TEST MySQL
        env:
          BD_APP_ENV: test
          BD_BACKEND_V2_MODE: test-write
          BD_BACKEND_V2_MAX_CONNECTIONS: '1'
          BD_BACKEND_V2_ACQUIRE_TIMEOUT_MS: '5000'
          BD_BACKEND_V2_CONNECT_TIMEOUT_MS: '10000'
          HOST: 127.0.0.1
          PORT: '18082'
          RELEASE_SHA: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
        run: node apps/backend-v2/e2e/scoring-lifecycle.mjs
