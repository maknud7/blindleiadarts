name: TEMP Scolia ownership PR runner

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-v2-scolia-ownership-delete-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply embedded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-scolia-ownership-patch.yml').read_text()
          marker = "python3 - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, '<embedded-scolia-patch>', 'exec'))
          PY
      - name: Build and run focused tests
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run backend-v2:build
          node --test apps/backend-v2/test/equipment-hardware-guard.test.mjs apps/backend-v2/test/scolia-bridge-ownership.test.mjs
      - name: Commit tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backend-v2/src/mysql/scolia-admin-repository.ts apps/backend-v2/test/scolia-bridge-ownership.test.mjs apps/admin/scolia-release-control.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Move Scolia bridge ownership to backend-v2'
          git push origin HEAD:feat/backend-v2-scolia-ownership-delete-parity
