name: Deploy Production Kiosk v2

on:
  push:
    branches:
      - develop
    paths:
      - '.github/prod-kiosk-v2-release-request'

permissions:
  contents: read

concurrency:
  group: deploy-production-kiosk
  cancel-in-progress: false

jobs:
  deploy-kiosk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate kiosk release request
        id: request
        run: |
          set -Eeuo pipefail
          marker=.github/prod-kiosk-v2-release-request
          test -f "$marker"

          release_sha="$(awk -F= '$1=="release_sha" {print $2}' "$marker" | tail -1 | tr -d '[:space:]')"
          scope="$(awk -F= '$1=="scope" {print $2}' "$marker" | tail -1 | tr -d '[:space:]')"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Kiosk production release requires an exact 40-character tested SHA."
            exit 1
          fi
          if [[ "$scope" != "kiosk-static-only" ]]; then
            echo "::error::Only kiosk-static-only scope is allowed."
            exit 1
          fi

          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          if (( ${#changed[@]} != 1 )) || [[ "${changed[0]}" != "$marker" ]]; then
            printf '::error::Release request commit may only change %s. Changed files:\n' "$marker"
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

          git cat-file -e "${release_sha}^{commit}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Kiosk-only release request accepted for $release_sha."

      - name: Checkout exact tested kiosk release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.release_sha }}
          fetch-depth: 1

      - name: Verify kiosk source and syntax
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f apps/kiosk/index.html
          test -f apps/kiosk/app.js
          test -f apps/kiosk/test-mode.js
          test -f apps/kiosk/prod-test-entry.js
          test -f apps/kiosk/service-worker.js

          grep -Fq 'id="setupState" class="state-card setup-state hidden"' apps/kiosk/index.html
          grep -Fq 'handOffToKioskRuntime' apps/kiosk/test-mode.js
          grep -Fq 'await loadState()' apps/kiosk/test-mode.js
          grep -Fq 'await startLive()' apps/kiosk/test-mode.js

          while IFS= read -r file; do
            node --check "$file"
          done < <(find apps/kiosk -maxdepth 1 -type f -name '*.js' | sort)
          echo "KIOSK_SOURCE_OK=yes"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Build exact TEST and PROD kiosk packages
        run: |
          set -Eeuo pipefail
          bash infra/deploy/build-release.sh test
          bash infra/deploy/build-release.sh prod

          grep -Fq 'data-bd-surface="kiosk"' dist/test/kiosk/index.html
          grep -Fq 'data-app-env="test"' dist/test/kiosk/index.html
          grep -Fq 'data-bd-surface="kiosk"' dist/prod/kiosk/index.html
          grep -Fq 'data-app-env="prod"' dist/prod/kiosk/index.html

          find dist/prod/kiosk -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/kiosk-files.txt
          test -s /tmp/kiosk-files.txt
          echo "Files in kiosk-only release:"
          cat /tmp/kiosk-files.txt

      - name: Verify exact kiosk build is on TEST
        env:
          TEST_BASE_URL: https://test.blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          while IFS= read -r file; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
              --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
              "$TEST_BASE_URL/kiosk/$file?cb=${RANDOM}-${RANDOM}" -o "/tmp/test-$file"
            expected="$(sha256sum "dist/test/kiosk/$file" | awk '{print $1}')"
            actual="$(sha256sum "/tmp/test-$file" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::TEST kiosk asset does not match exact release: $file"
              exit 1
            fi
          done < /tmp/kiosk-files.txt
          echo "TEST_KIOSK_EXACT=yes"

      - name: Read-only production preflight
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
        run: |
          set +e
          php infra/sql/prod_preflight.php | tee /tmp/prod-kiosk-preflight.txt
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            echo "::error::Production preflight is not safe for kiosk-only deployment."
            exit "$status"
          fi
          echo "KIOSK_PROD_PREFLIGHT_OK=yes"

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Snapshot current production kiosk for rollback
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_KIOSK: /www/blindleiadarts/prod/kiosk
        run: |
          set -Eeuo pipefail
          for name in SFTP_HOST SFTP_USERNAME SFTP_PASSWORD REMOTE_KIOSK; do test -n "${!name:-}"; done
          mkdir -p /tmp/prod-kiosk-rollback
          : > /tmp/kiosk-sftp-snapshot.txt
          while IFS= read -r file; do
            printf -- '-get %s/%s /tmp/prod-kiosk-rollback/%s\n' "$REMOTE_KIOSK" "$file" "$file" >> /tmp/kiosk-sftp-snapshot.txt
          done < /tmp/kiosk-files.txt
          echo quit >> /tmp/kiosk-sftp-snapshot.txt

          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -oBatchMode=no -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null \
            -b /tmp/kiosk-sftp-snapshot.txt "${SFTP_USERNAME}@${SFTP_HOST}"

          test -f /tmp/prod-kiosk-rollback/index.html
          : > /tmp/prod-kiosk-rollback/present.list
          : > /tmp/prod-kiosk-rollback/absent.list
          while IFS= read -r file; do
            if [[ -f "/tmp/prod-kiosk-rollback/$file" ]]; then
              echo "$file" >> /tmp/prod-kiosk-rollback/present.list
            else
              echo "$file" >> /tmp/prod-kiosk-rollback/absent.list
            fi
          done < /tmp/kiosk-files.txt
          echo "KIOSK_ROLLBACK_SNAPSHOT_READY=yes"

      - name: Store production kiosk rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: prod-kiosk-v2-before-${{ steps.request.outputs.release_sha }}
          path: /tmp/prod-kiosk-rollback
          if-no-files-found: error
          retention-days: 30

      - name: Deploy complete kiosk static bundle to production
        id: deploy
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_KIOSK: /www/blindleiadarts/prod/kiosk
        run: |
          set -Eeuo pipefail
          : > /tmp/kiosk-sftp-put.txt
          while IFS= read -r file; do
            printf 'put dist/prod/kiosk/%s %s/%s\n' "$file" "$REMOTE_KIOSK" "$file" >> /tmp/kiosk-sftp-put.txt
          done < /tmp/kiosk-files.txt
          echo quit >> /tmp/kiosk-sftp-put.txt
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -oBatchMode=no -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null \
            -b /tmp/kiosk-sftp-put.txt "${SFTP_USERNAME}@${SFTP_HOST}"

      - name: Verify exact production kiosk filesystem
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_KIOSK: /www/blindleiadarts/prod/kiosk
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/prod-kiosk-remote
          : > /tmp/kiosk-sftp-get.txt
          while IFS= read -r file; do
            printf 'get %s/%s /tmp/prod-kiosk-remote/%s\n' "$REMOTE_KIOSK" "$file" "$file" >> /tmp/kiosk-sftp-get.txt
          done < /tmp/kiosk-files.txt
          echo quit >> /tmp/kiosk-sftp-get.txt
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -oBatchMode=no -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null \
            -b /tmp/kiosk-sftp-get.txt "${SFTP_USERNAME}@${SFTP_HOST}"

          while IFS= read -r file; do
            expected="$(sha256sum "dist/prod/kiosk/$file" | awk '{print $1}')"
            actual="$(sha256sum "/tmp/prod-kiosk-remote/$file" | awk '{print $1}')"
            [[ "$expected" == "$actual" ]] || { echo "::error::Production filesystem mismatch: $file"; exit 1; }
          done < /tmp/kiosk-files.txt
          echo "KIOSK_PROD_FILESYSTEM_EXACT=yes"

      - name: Verify production kiosk over HTTP
        env:
          PROD_BASE_URL: https://blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          while IFS= read -r file; do
            matched=no
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 30 \
                  --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
                  "$PROD_BASE_URL/kiosk/$file?cb=${RANDOM}-${attempt}" -o "/tmp/prod-http-$file"; then
                expected="$(sha256sum "dist/prod/kiosk/$file" | awk '{print $1}')"
                actual="$(sha256sum "/tmp/prod-http-$file" | awk '{print $1}')"
                if [[ "$expected" == "$actual" ]]; then matched=yes; break; fi
              fi
              sleep 5
            done
            [[ "$matched" == yes ]] || { echo "::error::Production HTTP mismatch: $file"; exit 1; }
          done < /tmp/kiosk-files.txt

          grep -Fq 'data-app-env="prod"' /tmp/prod-http-index.html
          grep -Fq 'id="setupState" class="state-card setup-state hidden"' /tmp/prod-http-index.html
          echo "KIOSK_PROD_HTTP_EXACT=yes"
          echo "KIOSK_PROD_DEPLOY_OK=yes"

      - name: Roll back production kiosk after failed deployment verification
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_KIOSK: /www/blindleiadarts/prod/kiosk
        run: |
          set -Eeuo pipefail
          : > /tmp/kiosk-sftp-rollback.txt
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            printf 'put /tmp/prod-kiosk-rollback/%s %s/%s\n' "$file" "$REMOTE_KIOSK" "$file" >> /tmp/kiosk-sftp-rollback.txt
          done < /tmp/prod-kiosk-rollback/present.list
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            printf -- '-rm %s/%s\n' "$REMOTE_KIOSK" "$file" >> /tmp/kiosk-sftp-rollback.txt
          done < /tmp/prod-kiosk-rollback/absent.list
          echo quit >> /tmp/kiosk-sftp-rollback.txt
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -oBatchMode=no -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null \
            -b /tmp/kiosk-sftp-rollback.txt "${SFTP_USERNAME}@${SFTP_HOST}"
          echo "::warning::Kiosk deployment verification failed; production kiosk rollback was applied."
