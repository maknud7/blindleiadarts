name: DartsAtlas Connectivity Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate all Mandagsserien round 4 match details through TEST server
        shell: bash
        run: |
          set -Eeuo pipefail
          ids=(
            r4TtG8kymADI 67airnT2p86H zoGenUGrVdYF MBjQ16jF3i9q fGlAsv0R6c27 ZaAKjrep2k3g LYzNi7xXM2KT rgBn5j2RcbOZ Qn2H6tx9P04u BfLZUtvbH7Wp 1MpNsq1NnB6v SQO33OKlWEu3 plSH19dgo5y9 9MCQwujqvnkF QJrtaaQUMHb5
            wkHMp6FmkTqk JMJMCpfLa4rn j707Oogyfyju y2NfxIvHPPNr YCA09XkUxbDS ql89KYKZEr0L Ddi349OApI6t iZoHG6vgc9ic rQVJzOfuoN50 d4udoc8W2m5w QuRL7b9gRLDs eT1gCWST9n7c rbqSMvkhMds1 BEYMmRovCefs ihBZN9L8b0p2
            MARRHq8auTBb UN0unUpEOGva 5B2RoYmLKX0m AFaCEVd8cQJt l36LyJJYsyKc vfjjkAeWIWnf BrCVGX5yRm9R
          )
          ok=0
          failed=0
          total_legs=0
          total_visits=0
          total_darts=0
          : > /tmp/match-details.tsv
          for id in "${ids[@]}"; do
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 90 -o "$body" -w '%{http_code}' "https://test.blindleiadarts.ingenting.org/api/atlas-match-visits.php?match=$id" || true)"
            line="$(php -r '
              $d=json_decode(file_get_contents($argv[1]),true);
              if(!is_array($d)||empty($d["ok"])) {
                printf("FAIL\t%s\t%s\t%s\t%s\t0\t0\t0",$argv[2],(string)($d["error"]??"invalid_json"),(string)($d["message"]??""),(string)($d["status"]??""));
                exit;
              }
              printf("OK\t%s\t%s vs %s\t%s-%s\t%d\t%d\t%d",$argv[2],(string)$d["players"]["a"],(string)$d["players"]["b"],(string)$d["legs_won"]["a"],(string)$d["legs_won"]["b"],(int)$d["leg_count"],(int)$d["visit_count"],(int)$d["darts_count"]);
            ' "$body" "$id")"
            echo -e "$line" | tee -a /tmp/match-details.tsv
            if [[ "$status" == "200" && "$line" == OK$'\t'* ]]; then
              ok=$((ok+1))
              IFS=$'\t' read -r _ _ _ _ legs visits darts <<< "$line"
              total_legs=$((total_legs+legs))
              total_visits=$((total_visits+visits))
              total_darts=$((total_darts+darts))
            else
              failed=$((failed+1))
            fi
            rm -f "$body"
            sleep 1
          done
          echo "VALIDATED_MATCHES=$ok"
          echo "FAILED_MATCHES=$failed"
          echo "TOTAL_LEGS=$total_legs"
          echo "TOTAL_VISITS=$total_visits"
          echo "TOTAL_DARTS=$total_darts"
          test "$ok" -eq 37
          test "$failed" -eq 0
          test "$total_legs" -eq 48
