name: Player PWA Smoke

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-pwa-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching test release
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 40); do
            release="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq "$EXPECTED_SHA" <<<"$release"; then exit 0; fi
            sleep 10
          done
          echo "PWA smoke failed: expected release did not become live." >&2
          exit 1

      - name: Verify test PWA and account setup UX
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          fetch_resource() {
            local path="$1"
            echo "Checking /$path" >&2
            curl -fsS "$base/$path?cb=$RANDOM"
          }

          root_html="$(fetch_resource '')"
          grep -Fq 'api/pwa-manifest.php' <<<"$root_html"
          grep -Fq 'apple-mobile-web-app-capable' <<<"$root_html"

          manifest="$(fetch_resource 'api/pwa-manifest.php')"
          grep -Fq '"name": "Blindleia Darts TEST"' <<<"$manifest"
          grep -Fq '"id": "/blindleia-darts-test"' <<<"$manifest"
          grep -Fq '"scope": "/"' <<<"$manifest"
          grep -Fq '"theme_color": "#f3c23c"' <<<"$manifest"
          grep -Fq 'blindleia-dartklubb-test.svg' <<<"$manifest"

          service_worker="$(fetch_resource 'api/pwa-service-worker.php')"
          grep -Fq 'blindleia-pwa-test-' <<<"$service_worker"
          grep -Fq 'url.pathname.includes("/api/")' <<<"$service_worker"
          grep -Fq 'Authorization' <<<"$service_worker"

          test_logo="$(fetch_resource 'static/club-logos/blindleia-dartklubb-test.svg')"
          grep -Fq '#f3c23c' <<<"$test_logo"
          grep -Fq '>TEST<' <<<"$test_logo"

          pwa_js="$(fetch_resource 'player/pwa-install.js')"
          grep -Fq 'Blindleia Darts TEST' <<<"$pwa_js"
          grep -Fq 'blindleia-dartklubb-test.svg' <<<"$pwa_js"
          grep -Fq 'pwa-service-worker.php' <<<"$pwa_js"
          grep -Fq 'Legg til på Hjem-skjerm' <<<"$pwa_js"

          player_now_js="$(fetch_resource 'player/player-now.js')"
          grep -Fq '/match-calls' <<<"$player_now_js"
          grep -Fq 'Venter på oppkalling' <<<"$player_now_js"

          account_js="$(fetch_resource 'admin/member-onboarding-admin.js')"
          grep -Fq 'Ingen konto' <<<"$account_js"
          grep -Fq 'Invitasjon sendt' <<<"$account_js"
          grep -Fq 'Aktiv konto' <<<"$account_js"
          grep -Fq 'Koble og aktiver' <<<"$account_js"
          grep -Fq 'member-account-reactivate.php' <<<"$account_js"

          echo "PLAYER_PWA_SMOKE_OK=yes"