name: Player PWA Smoke

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-pwa-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching test release
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 40); do
            release="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq "$EXPECTED_SHA" <<<"$release"; then exit 0; fi
            sleep 10
          done
          echo "PWA smoke failed: expected release did not become live." >&2
          exit 1

      - name: Verify PWA and onboarding UX
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"

          player_html="$(curl -fsS "$base/player/?cb=$RANDOM")"
          grep -Fq 'rel="manifest"' <<<"$player_html"
          grep -Fq 'apple-touch-icon' <<<"$player_html"
          grep -Fq 'blindleia-dartklubb-logo.png' <<<"$player_html"
          grep -Fq 'account-onboarding-ux.js' <<<"$player_html"
          grep -Fq 'pwa-install.js' <<<"$player_html"

          manifest="$(curl -fsS "$base/player/manifest.webmanifest?cb=$RANDOM")"
          grep -Fq '"name": "Blindleia Darts"' <<<"$manifest"
          grep -Fq 'blindleia-dartklubb-logo.svg' <<<"$manifest"
          grep -Fq '"display": "standalone"' <<<"$manifest"

          sw="$(curl -fsS "$base/player/service-worker.js?cb=$RANDOM")"
          grep -Fq 'url.pathname.includes("/api/")' <<<"$sw"
          grep -Fq 'Authorization' <<<"$sw"

          pwa_js="$(curl -fsS "$base/player/pwa-install.js?cb=$RANDOM")"
          grep -Fq 'beforeinstallprompt' <<<"$pwa_js"
          grep -Fq 'Legg til på Hjem-skjerm' <<<"$pwa_js"
          grep -Fq 'blindleia-dartklubb-logo.png' <<<"$pwa_js"

          account_js="$(curl -fsS "$base/player/account-onboarding-ux.js?cb=$RANDOM")"
          grep -Fq 'Jeg har spilt her før' <<<"$account_js"
          grep -Fq 'Kamper, ELO og statistikk' <<<"$account_js"

          onboarding_html="$(curl -fsS "$base/onboarding/?cb=$RANDOM")"
          grep -Fq 'Allerede spilt hos oss?' <<<"$onboarding_html"
          grep -Fq 'du skal ikke ende opp med to spillerprofiler' <<<"$onboarding_html"
          grep -Fq 'blindleia-dartklubb-logo.png' <<<"$onboarding_html"

          echo "PLAYER_PWA_SMOKE_OK=yes"
