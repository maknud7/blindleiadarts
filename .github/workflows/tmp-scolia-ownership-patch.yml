name: TEMP Scolia ownership patch

on:
  push:
    branches:
      - feat/backend-v2-scolia-ownership-delete-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-v2-scolia-ownership-delete-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply ownership patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('apps/backend-v2/src/mysql/scolia-admin-repository.ts')
          text = repo.read_text()

          old = '''      const current = await this.getBoardSettingsWith(db, environmentClubId, kioskId);
      if (!current) return null;
      const physicalId = requiredId(current.physical_kiosk_id, "physical_kiosk_id");
'''
          new = '''      const current = await this.getBoardSettingsWith(db, environmentClubId, kioskId);
      if (!current) return null;
      if (payload.bridge_attached !== undefined) {
        if (typeof payload.bridge_attached !== "boolean") {
          throw new DomainValidationError("bridge_attached_required", "bridge_attached must be true or false.");
        }
        return this.setBridgeAttachedWith(db, environmentClubId, kioskId, current, payload.bridge_attached, userId);
      }
      const physicalId = requiredId(current.physical_kiosk_id, "physical_kiosk_id");
'''
          if old not in text:
              raise SystemExit('updateBoardSettings insertion point not found')
          text = text.replace(old, new, 1)

          old = '''    const mode = stringValue(row.mode) || (stringValue(row.scoring_mode) === "scolia" ? "live" : "off");
    return {
      ...publicRow(row),
'''
          new = '''    const mode = stringValue(row.mode) || (stringValue(row.scoring_mode) === "scolia" ? "live" : "off");
    const serial = stringValue(row.serial_number);
    const isScolia = stringValue(row.scoring_mode).toLowerCase() === "scolia" && serial !== "";
    const bridgeAttached = isScolia && mode === "live";
    return {
      ...publicRow(row),
'''
          # Only replace the getBoardSettingsWith occurrence: it is the last matching board-mode block.
          idx = text.rfind(old)
          if idx < 0:
              raise SystemExit('getBoardSettingsWith mode block not found')
          text = text[:idx] + text[idx:].replace(old, new, 1)

          old = '''      mode,
      auto_fallback_to_manual: row.auto_fallback_to_manual == null ? 1 : numberValue(row.auto_fallback_to_manual),
      connection_state: stringValue(runtime.connection_state) || (mode === "off" ? "disabled" : "disconnected"),
'''
          new = '''      mode,
      is_scolia: isScolia,
      bridge_attached: bridgeAttached,
      bridge_released: isScolia && !bridgeAttached,
      direct_scolia_ready: isScolia && !bridgeAttached,
      can_change_bridge: this.runtimePrefix === this.hardwarePrefix,
      release_effective_within_seconds: 12,
      auto_fallback_to_manual: row.auto_fallback_to_manual == null ? 1 : numberValue(row.auto_fallback_to_manual),
      connection_state: stringValue(runtime.connection_state) || (mode === "off" ? "disabled" : "disconnected"),
'''
          if old not in text:
              raise SystemExit('getBoardSettingsWith payload insertion point not found')
          text = text.replace(old, new, 1)

          marker = '''  private async getRuntimeStatusWith(db: SqlExecutor, clubId: string, kioskId: string): Promise<Record<string, unknown>> {
'''
          method = '''  private async setBridgeAttachedWith(
    db: SqlExecutor,
    clubId: string,
    kioskId: string,
    current: Record<string, unknown>,
    attached: boolean,
    userId: string,
  ): Promise<Record<string, unknown>> {
    const physicalId = requiredId(current.physical_kiosk_id, "physical_kiosk_id");
    const runtimeId = optionalId(current.runtime_kiosk_id);
    const serial = stringValue(current.serial_number);
    const isScolia = stringValue(current.scoring_mode).toLowerCase() === "scolia" && serial !== "";
    if (!isScolia) {
      throw new DomainValidationError("scolia_not_configured", "Denne skiva er ikke konfigurert som en fysisk Scolia-skive.", 409);
    }

    const currentAttached = stringValue(current.mode).toLowerCase() === "live";
    if (currentAttached === attached) {
      return { ...current, bridge_changed: false };
    }

    if (!attached && runtimeId) {
      await this.markDisconnectedWith(db, clubId, runtimeId, "Scolia frikoblet fra Blindleia av admin.");
    }

    const newMode = attached ? "live" : "off";
    const updated = await db.execute(
      `UPDATE \\`${this.hardwarePrefix}scolia_board_settings\\` SET mode=?,updated_by_user_id=? WHERE kiosk_id=?`,
      [newMode, userId, physicalId],
    );
    if (updated.affectedRows < 1) {
      throw new DomainValidationError("scolia_bridge_update_failed", "Scolia-innstillingen kunne ikke oppdateres.", 500);
    }

    if (attached) {
      await db.execute(
        `INSERT INTO \\`${this.hardwarePrefix}scolia_board_runtime\\` (kiosk_id,connection_state,board_status,board_phase,error_type,connected_at)
         VALUES (?,'disconnected',NULL,NULL,NULL,NULL)
         ON DUPLICATE KEY UPDATE connection_state='disconnected',board_status=NULL,board_phase=NULL,error_type=NULL,connected_at=NULL`,
        [physicalId],
      );
    } else {
      const reason = "Frikoblet fra Blindleia av admin.";
      await db.execute(
        `INSERT INTO \\`${this.hardwarePrefix}scolia_board_runtime\\`
          (kiosk_id,connection_state,board_status,board_phase,error_type,last_disconnect_reason,last_disconnect_at,connected_at)
         VALUES (?,'disabled',NULL,NULL,NULL,?,NOW(3),NULL)
         ON DUPLICATE KEY UPDATE connection_state='disabled',board_status=NULL,board_phase=NULL,error_type=NULL,
           last_disconnect_reason=VALUES(last_disconnect_reason),last_disconnect_at=NOW(3),connected_at=NULL`,
        [physicalId, reason],
      );
      await db.execute(`DELETE FROM \\`${this.hardwarePrefix}scolia_test_leases\\` WHERE physical_kiosk_id=?`, [physicalId]);
      await db.execute(
        `UPDATE \\`${this.hardwarePrefix}scolia_commands\\`
            SET status='expired',completed_at=NOW(3),last_error=?
          WHERE kiosk_id=? AND status IN ('queued','delivered','failed')`,
        [reason, physicalId],
      );
    }

    const fresh = await this.getBoardSettingsWith(db, clubId, kioskId);
    if (!fresh) throw new DomainValidationError("kiosk_not_found", "Skiva forsvant etter Scolia-frikobling.", 404);
    return { ...fresh, bridge_changed: true };
  }

'''
          if marker not in text:
              raise SystemExit('setBridgeAttachedWith insertion point not found')
          text = text.replace(marker, method + marker, 1)
          repo.write_text(text)

          ui = Path('apps/admin/scolia-release-control.js')
          text = ui.read_text()
          text = text.replace('const CONTROL_API = "../api/scolia-bridge-control.php";\n', '')
          old = '''  const url = new URL(CONTROL_API, window.location.href);
  url.searchParams.set("club_id", String(clubId));
  url.searchParams.set("kiosk_id", String(kioskId));
'''
          new = '''  const url = new URL(`../api/v1/clubs/${encodeURIComponent(String(clubId))}/kiosks/${encodeURIComponent(String(kioskId))}/scolia`, window.location.href);
'''
          if old not in text:
              raise SystemExit('frontend URL block not found')
          text = text.replace(old, new, 1)
          text = text.replace('''  if (method === "POST") {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify({ attached: Boolean(attached) });
  }
''', '''  if (method !== "GET") {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify({ bridge_attached: Boolean(attached) });
  }
''', 1)
          text = text.replace('requestState(kioskId, { method: "POST", attached: action.attached })', 'requestState(kioskId, { method: "PATCH", attached: action.attached })', 1)
          ui.write_text(text)

          test_file = Path('apps/backend-v2/test/scolia-bridge-ownership.test.mjs')
          test_file.write_text(r'''import assert from "node:assert/strict";
import test from "node:test";

import { MySqlScoliaAdminRepository } from "../dist/mysql/scolia-admin-repository.js";

class FakeSessions {
  constructor(db) { this.db = db; }
  async withConnection(callback) { return callback(this.db); }
  async withTransaction(callback) { return callback(this.db); }
}

function fakeProdDb() {
  let mode = "live";
  let runtimeState = "connected";
  const executed = [];
  return {
    executed,
    async query(sql) {
      if (sql.includes("FROM `bd_prod_kiosks` WHERE id=? AND club_id=?")) return [{ id: "7" }];
      if (sql.includes("FROM `bd_prod_kiosks` k") && sql.includes("scolia_board_settings")) {
        return [{
          id: "7", club_id: "1", code: "BOARD-7", name: "Skive 7", board_number: 7,
          scoring_mode: "scolia", is_active: 1, serial_number: "SCOLIA-7", mode,
          auto_fallback_to_manual: 1, force_connect_override: null, forward_messages_override: null,
        }];
      }
      if (sql.includes("FROM `bd_prod_scolia_board_runtime`")) {
        return [{ connection_state: runtimeState, fallback_active: 0, needs_reconciliation: 0 }];
      }
      if (sql.includes("FROM `bd_prod_matches`")) return [];
      return [];
    },
    async execute(sql, params = []) {
      executed.push({ sql, params });
      if (sql.includes("UPDATE `bd_prod_scolia_board_settings` SET mode=")) {
        mode = String(params[0]);
        return { affectedRows: 1, insertId: 0 };
      }
      if (sql.includes("scolia_board_runtime") && sql.includes("'disabled'")) runtimeState = "disabled";
      return { affectedRows: 1, insertId: 0 };
    },
  };
}

test("release changes bridge ownership without changing physical scoring mode", async () => {
  const db = fakeProdDb();
  const repository = new MySqlScoliaAdminRepository(new FakeSessions(db), "bd_prod_", "bd_prod_");
  const board = await repository.updateBoardSettings("1", "7", { bridge_attached: false }, "99");

  assert.equal(board?.scoring_mode, "scolia");
  assert.equal(board?.mode, "off");
  assert.equal(board?.bridge_released, true);
  assert.equal(board?.direct_scolia_ready, true);
  assert.equal(board?.can_change_bridge, true);
  assert.equal(board?.bridge_changed, true);
  assert.ok(db.executed.some(({ sql }) => sql.includes("scolia_test_leases")));
  assert.ok(db.executed.some(({ sql }) => sql.includes("scolia_commands") && sql.includes("status='expired'")));
  assert.ok(!db.executed.some(({ sql }) => sql.includes("UPDATE `bd_prod_kiosks` SET scoring_mode")));
});

test("TEST-style split scope exposes release as read-only", async () => {
  const db = fakeProdDb();
  const repository = new MySqlScoliaAdminRepository(new FakeSessions(db), "bd_test_", "bd_prod_");
  db.query = async (sql) => {
    if (sql.includes("FROM `bd_test_clubs`")) return [{ slug: "blindleia-dartklubb" }];
    if (sql.includes("FROM `bd_prod_clubs`")) return [{ id: "1" }];
    if (sql.includes("FROM `bd_test_kiosks`")) return [{ id: "17", source_kiosk_id: "7" }];
    if (sql.includes("FROM `bd_prod_kiosks` k")) return [{
      id: "7", club_id: "1", code: "BOARD-7", name: "Skive 7", board_number: 7,
      scoring_mode: "scolia", is_active: 1, serial_number: "SCOLIA-7", mode: "live",
      auto_fallback_to_manual: 1,
    }];
    if (sql.includes("FROM `bd_test_scolia_board_runtime`")) return [];
    return [];
  };
  const board = await repository.getBoardSettings("1", "17");
  assert.equal(board?.physical_kiosk_id, "7");
  assert.equal(board?.runtime_kiosk_id, "17");
  assert.equal(board?.bridge_attached, true);
  assert.equal(board?.can_change_bridge, false);
});
''')
          PY
      - name: Build and run focused tests
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run backend-v2:build
          node --test apps/backend-v2/test/equipment-hardware-guard.test.mjs apps/backend-v2/test/scolia-bridge-ownership.test.mjs
      - name: Commit tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backend-v2/src/mysql/scolia-admin-repository.ts apps/backend-v2/test/scolia-bridge-ownership.test.mjs apps/admin/scolia-release-control.js
          git commit -m 'Move Scolia bridge ownership to backend-v2'
          git push origin HEAD:feat/backend-v2-scolia-ownership-delete-parity
