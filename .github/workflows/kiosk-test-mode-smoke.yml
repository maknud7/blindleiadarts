name: Kiosk Test Mode Smoke

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Deploy Test cancels superseded develop commits. Mirror that behaviour here so
# a smoke run never keeps waiting for a release SHA that the deploy workflow has
# intentionally skipped in favour of a newer develop commit.
concurrency:
  group: kiosk-test-mode-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://test.blindleiadarts.ingenting.org
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Wait for matching test release
        shell: bash
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 40); do
            release="$(curl -fsS --connect-timeout 5 --max-time 15 "$base/release.json?cb=$RANDOM" || true)"
            if grep -Fq "$EXPECTED_SHA" <<<"$release"; then
              exit 0
            fi
            sleep 10
          done
          echo "Kiosk smoke failed: expected release did not become live." >&2
          exit 1

      - name: Verify canonical physical board chooser and clubadmin parity
        shell: bash
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          chooser="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/api/kiosk-test-mode.php?cb=$RANDOM")"
          clubs="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/api/v1/clubs?cb=$RANDOM")"

          jq -e '.ok == true' <<<"$chooser" >/dev/null
          jq -e '.data.source == "canonical_physical_board_registry"' <<<"$chooser" >/dev/null
          jq -e 'all(.data.items[]; .source == "physical")' <<<"$chooser" >/dev/null
          jq -e 'any(.data.items[]; .club_slug == "blindleia-dartklubb")' <<<"$chooser" >/dev/null
          jq -e '.ok == true' <<<"$clubs" >/dev/null

          club_id="$(jq -r '.data.items[] | select(.slug == "blindleia-dartklubb") | .id' <<<"$clubs" | head -n1)"
          if [[ ! "$club_id" =~ ^[0-9]+$ ]] || [[ "$club_id" -le 0 ]]; then
            echo "Could not resolve Blindleia club id in TEST." >&2
            exit 1
          fi

          equipment="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/api/v1/clubs/$club_id/kiosks?cb=$RANDOM")"
          jq -e '.ok == true' <<<"$equipment" >/dev/null
          jq -e '.data.configuration_scope == "production_hardware"' <<<"$equipment" >/dev/null
          jq -e '.data.shared_across_environments == true' <<<"$equipment" >/dev/null

          duplicates="$(jq -r '
            [.data.items[] | "\(.club_slug):\(.board_number)"]
            | group_by(.)
            | map(select(length > 1) | .[0])
            | join(",")
          ' <<<"$chooser")"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate canonical physical boards in kiosk chooser: $duplicates" >&2
            exit 1
          fi

          chooser_boards="$(jq -c '[.data.items[] | select(.club_slug == "blindleia-dartklubb") | .board_number] | sort' <<<"$chooser")"
          equipment_boards="$(jq -c '[.data.items[].board_number] | sort' <<<"$equipment")"
          if [[ "$chooser_boards" != "$equipment_boards" ]]; then
            echo "Clubadmin and kiosk test mode are not 1:1." >&2
            echo "chooser=$chooser_boards" >&2
            echo "equipment=$equipment_boards" >&2
            exit 1
          fi

          echo "$chooser" | jq -r '.data.items[] | select(.club_slug == "blindleia-dartklubb") | [.board_number, .source, .scoring_mode] | @tsv'
          echo "CLUBADMIN_BOARDS=$equipment_boards"
          echo "KIOSK_TEST_MODE_CANONICAL_BOARDS_OK=yes"
          echo "CLUBADMIN_KIOSK_BOARD_PARITY_OK=yes"

      - name: Verify TEST hardware mutations are blocked
        shell: bash
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          clubs="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/api/v1/clubs?cb=$RANDOM")"
          club_id="$(jq -r '.data.items[] | select(.slug == "blindleia-dartklubb") | .id' <<<"$clubs" | head -n1)"

          create_status="$(curl -sS -o /tmp/hardware-create.json -w '%{http_code}' \
            -X POST "$base/api/v1/clubs/$club_id/kiosks" \
            -H 'Content-Type: application/json' \
            --data '{"board_number":9999,"name":"SHOULD-NOT-CREATE","scoring_mode":"manual"}')"
          test "$create_status" = "403"
          jq -e '.error.code == "production_hardware_read_only"' /tmp/hardware-create.json >/dev/null

          board_id="$(jq -r '.data.items[0].id' <<<"$(curl -fsS "$base/api/v1/clubs/$club_id/kiosks?cb=$RANDOM")")"
          patch_status="$(curl -sS -o /tmp/hardware-patch.json -w '%{http_code}' \
            -X PATCH "$base/api/v1/clubs/$club_id/kiosks/$board_id" \
            -H 'Content-Type: application/json' \
            --data '{"name":"SHOULD-NOT-CHANGE"}')"
          test "$patch_status" = "403"
          jq -e '.error.code == "production_hardware_read_only"' /tmp/hardware-patch.json >/dev/null

          scolia_status="$(curl -sS -o /tmp/hardware-scolia.json -w '%{http_code}' \
            -X PATCH "$base/api/v1/clubs/$club_id/scolia/settings" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":false}')"
          test "$scolia_status" = "403"
          jq -e '.error.code == "production_hardware_read_only"' /tmp/hardware-scolia.json >/dev/null

          admin_html="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/admin/?cb=$RANDOM")"
          grep -Fq 'test-hardware-readonly.js' <<<"$admin_html"
          readonly_js="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/admin/test-hardware-readonly.js?cb=$RANDOM")"
          grep -Fq 'Fysiske skiver administreres kun i PROD' <<<"$readonly_js"

          echo "TEST_HARDWARE_READ_ONLY_OK=yes"
