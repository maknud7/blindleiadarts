name: TEMP equipment delete parity

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-v2-scolia-ownership-delete-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply delete parity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('apps/backend-v2/src/mysql/equipment-admin-repository.ts')
          text = repo.read_text()
          marker = '''  async ensureRuntimeAlias(environmentClubIdInput: unknown, physicalIdInput: unknown): Promise<string> {
'''
          method = '''  async deleteBoard(environmentClubIdInput: unknown, physicalIdInput: unknown): Promise<boolean> {
    const environmentClubId = requiredId(environmentClubIdInput, "club_id");
    const physicalId = requiredId(physicalIdInput, "kiosk_id");
    return this.sessions.withTransaction(async (db) => {
      const canonicalClubId = await this.canonicalClubIdWith(db, environmentClubId);
      const board = await this.findPhysicalBoardWith(db, canonicalClubId, physicalId);
      if (!board) return false;

      const matchCount = await this.countBoardMatchesWith(db, environmentClubId, physicalId);
      if (matchCount > 0) {
        throw new DomainValidationError(
          "board_has_match_history",
          `Skiva er brukt i ${matchCount} kamp${matchCount === 1 ? "" : "er"} og kan ikke slettes. Deaktiver den i stedet.`,
          409,
        );
      }

      if (this.runtimePrefix !== this.hardwarePrefix) {
        const runtime = await this.runtimeBoardWith(db, environmentClubId, physicalId);
        if (runtime) {
          const runtimeId = requiredId(runtime.id, "runtime_kiosk_id");
          await this.deleteBoardReferencesWith(db, this.runtimePrefix, runtimeId);
          await db.execute(
            `DELETE FROM \\`${this.runtimePrefix}kiosks\\` WHERE id=? AND club_id=?`,
            [runtimeId, environmentClubId],
          );
        }
      }

      await this.deleteBoardReferencesWith(db, this.hardwarePrefix, physicalId);
      const deleted = await db.execute(
        `DELETE FROM \\`${this.hardwarePrefix}kiosks\\` WHERE id=? AND club_id=?`,
        [physicalId, canonicalClubId],
      );
      return deleted.affectedRows > 0;
    });
  }

'''
          if marker not in text:
              raise SystemExit('ensureRuntimeAlias insertion point not found')
          text = text.replace(marker, method + marker, 1)

          marker = '''  private async generateKioskCodeWith(db: SqlExecutor, clubKey: string, boardNumber: number): Promise<string> {
'''
          helpers = '''  private async countBoardMatchesWith(db: SqlExecutor, environmentClubId: string, physicalId: string): Promise<number> {
    const physicalRows = await db.query<QueryResultRow>(
      `SELECT COUNT(*) AS c FROM \\`${this.hardwarePrefix}matches\\` WHERE kiosk_id=?`,
      [physicalId],
    );
    let count = numberValue(physicalRows[0]?.c);
    if (this.runtimePrefix !== this.hardwarePrefix) {
      const runtimeRows = await db.query<QueryResultRow>(
        `SELECT COUNT(*) AS c FROM \\`${this.runtimePrefix}matches\\` m
           INNER JOIN \\`${this.runtimePrefix}kiosks\\` k ON k.id=m.kiosk_id
          WHERE k.club_id=? AND (k.source_kiosk_id=? OR k.id=?)`,
        [environmentClubId, physicalId, physicalId],
      );
      count += numberValue(runtimeRows[0]?.c);
    }
    return count;
  }

  private async deleteBoardReferencesWith(db: SqlExecutor, prefix: TablePrefix, kioskId: string): Promise<void> {
    for (const table of ["tournament_board_reservations", "tournament_kiosks", "kiosk_sessions"] as const) {
      await db.execute(`DELETE FROM \\`${prefix}${table}\\` WHERE kiosk_id=?`, [kioskId]);
    }
    await db.execute(
      `UPDATE \\`${prefix}kiosk_pairing_requests\\` SET approved_kiosk_id=NULL WHERE approved_kiosk_id=?`,
      [kioskId],
    );
  }

'''
          if marker not in text:
              raise SystemExit('generateKioskCode insertion point not found')
          text = text.replace(marker, helpers + marker, 1)
          repo.write_text(text)

          router = Path('apps/backend-v2/src/runtime/equipment-admin-router.ts')
          text = router.read_text()
          marker = '''    const kiosk = /^\\/v1\\/clubs\\/([1-9][0-9]*)\\/kiosks\\/([1-9][0-9]*)$/.exec(path);
    if (kiosk && (method === "PATCH" || method === "PUT")) {
'''
          replacement = '''    const kiosk = /^\\/v1\\/clubs\\/([1-9][0-9]*)\\/kiosks\\/([1-9][0-9]*)$/.exec(path);
    if (kiosk && method === "DELETE") {
      const clubId = capture(kiosk, 1);
      const kioskId = capture(kiosk, 2);
      await this.requireSuperAdmin(request);
      assertProductionHardwareMutationAllowed(this.config);
      const deleted = await this.equipment.deleteBoard(clubId, kioskId);
      if (!deleted) throw new DomainValidationError("board_not_found", "Skiva ble ikke funnet i valgt klubb.", 404);
      return ok({ deleted: true, kind: "board", id: kioskId, ...this.equipment.scope() });
    }
    if (kiosk && (method === "PATCH" || method === "PUT")) {
'''
          if marker not in text:
              raise SystemExit('router kiosk insertion point not found')
          text = text.replace(marker, replacement, 1)
          router.write_text(text)

          proxy = Path('apps/api/src/BackendV2EquipmentProxyApplication.php')
          text = proxy.read_text()
          old = '''        // Physical board deletion remains on PHP until Node has identical match
        // history and reference cleanup protection. Do not add DELETE here yet.
        if (preg_match('#^/v1/clubs/\\d+/kiosks/\\d+$#', $path) === 1) {
            return in_array($method, ['PUT', 'PATCH'], true);
        }
'''
          new = '''        // Physical board delete has the same history/reference safety contract in Node.
        // TEST still fails closed before any canonical hardware mutation is attempted.
        if (preg_match('#^/v1/clubs/\\d+/kiosks/\\d+$#', $path) === 1) {
            return in_array($method, ['PUT', 'PATCH', 'DELETE'], true);
        }
'''
          if old not in text:
              raise SystemExit('proxy delete guard block not found')
          proxy.write_text(text.replace(old, new, 1))

          routing = Path('apps/api/tests/backend_v2_equipment_proxy_routing_test.php')
          text = routing.read_text()
          text = text.replace("    ['PATCH', '/v1/clubs/1/kiosks/9'],\n", "    ['PATCH', '/v1/clubs/1/kiosks/9'],\n    ['DELETE', '/v1/clubs/1/kiosks/9'],\n", 1)
          old = '''// Irreversible physical delete stays on the PHP safety implementation until
// Node has identical historical-reference checks and cleanup semantics.
$assert(!$proxy->handles('DELETE', '/v1/clubs/1/kiosks/9'), 'Physical board delete must remain outside Node cutover.');
'''
          if old not in text:
              raise SystemExit('routing negative delete assertion not found')
          routing.write_text(text.replace(old, "", 1))

          workflow = Path('.github/workflows/backend-v2-equipment-frontdoor.yml')
          text = workflow.read_text()
          old = '''          grep -Fq "!\\$proxy->handles('DELETE', '/v1/clubs/1/kiosks/9')" apps/api/tests/backend_v2_equipment_proxy_routing_test.php
'''
          new = '''          grep -Fq "['DELETE', '/v1/clubs/1/kiosks/9']" apps/api/tests/backend_v2_equipment_proxy_routing_test.php
'''
          if old not in text:
              raise SystemExit('frontdoor delete grep not found')
          workflow.write_text(text.replace(old, new, 1))

          # Cosmetic cleanup from the first generated patch.
          scolia = Path('apps/backend-v2/src/mysql/scolia-admin-repository.ts')
          text = scolia.read_text()
          text = text.replace('\nthrow new DomainValidationError("bridge_attached_required"', '\n          throw new DomainValidationError("bridge_attached_required"')
          text = text.replace("\n(kiosk_id,connection_state,board_status,board_phase,error_type,last_disconnect_reason,last_disconnect_at,connected_at)", "\n          (kiosk_id,connection_state,board_status,board_phase,error_type,last_disconnect_reason,last_disconnect_at,connected_at)")
          text = text.replace("\n last_disconnect_reason=VALUES(last_disconnect_reason)", "\n           last_disconnect_reason=VALUES(last_disconnect_reason)")
          text = text.replace("\n  SET status='expired'", "\n            SET status='expired'")
          text = text.replace("\nWHERE kiosk_id=?", "\n          WHERE kiosk_id=?")
          scolia.write_text(text)

          test_file = Path('apps/backend-v2/test/equipment-delete-parity.test.mjs')
          test_file.write_text(r'''import assert from "node:assert/strict";
import test from "node:test";

import { MySqlEquipmentAdminRepository } from "../dist/mysql/equipment-admin-repository.js";

class FakeSessions {
  constructor(db) { this.db = db; }
  async withConnection(callback) { return callback(this.db); }
  async withTransaction(callback) { return callback(this.db); }
}

function fakeDb(matchCount = 0) {
  const executed = [];
  return {
    executed,
    async query(sql) {
      if (sql.includes("SELECT id,club_id,code,name") && sql.includes("FROM `bd_prod_kiosks`")) {
        return [{ id: "9", club_id: "1", code: "BOARD-9", name: "Skive 9", board_number: 9, scoring_mode: "scolia", is_active: 1 }];
      }
      if (sql.includes("SELECT COUNT(*) AS c FROM `bd_prod_matches`")) return [{ c: String(matchCount) }];
      return [];
    },
    async execute(sql, params = []) {
      executed.push({ sql, params });
      if (sql.includes("DELETE FROM `bd_prod_kiosks`")) return { affectedRows: 1, insertId: 0 };
      return { affectedRows: 1, insertId: 0 };
    },
  };
}

test("board delete refuses canonical match history", async () => {
  const db = fakeDb(2);
  const repository = new MySqlEquipmentAdminRepository(new FakeSessions(db), "bd_prod_", "bd_prod_");
  await assert.rejects(
    () => repository.deleteBoard("1", "9"),
    (error) => error?.code === "board_has_match_history" && error?.statusCode === 409,
  );
  assert.ok(!db.executed.some(({ sql }) => sql.includes("DELETE FROM `bd_prod_kiosks`")));
});

test("safe board delete clears references before canonical hardware row", async () => {
  const db = fakeDb(0);
  const repository = new MySqlEquipmentAdminRepository(new FakeSessions(db), "bd_prod_", "bd_prod_");
  assert.equal(await repository.deleteBoard("1", "9"), true);

  const statements = db.executed.map(({ sql }) => sql);
  for (const table of ["tournament_board_reservations", "tournament_kiosks", "kiosk_sessions"]) {
    assert.ok(statements.some((sql) => sql.includes(`DELETE FROM \\`bd_prod_${table}\\``)));
  }
  assert.ok(statements.some((sql) => sql.includes("UPDATE `bd_prod_kiosk_pairing_requests` SET approved_kiosk_id=NULL")));
  const boardDeleteIndex = statements.findIndex((sql) => sql.includes("DELETE FROM `bd_prod_kiosks`"));
  assert.ok(boardDeleteIndex > 0);
});
''')
          PY
      - name: Build and run focused contracts
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run backend-v2:build
          node --test apps/backend-v2/test/equipment-hardware-guard.test.mjs apps/backend-v2/test/scolia-bridge-ownership.test.mjs apps/backend-v2/test/equipment-delete-parity.test.mjs
          php apps/api/tests/backend_v2_equipment_proxy_routing_test.php
      - name: Commit tested delete parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backend-v2/src/mysql/equipment-admin-repository.ts apps/backend-v2/src/runtime/equipment-admin-router.ts apps/backend-v2/src/mysql/scolia-admin-repository.ts apps/backend-v2/test/equipment-delete-parity.test.mjs apps/api/src/BackendV2EquipmentProxyApplication.php apps/api/tests/backend_v2_equipment_proxy_routing_test.php .github/workflows/backend-v2-equipment-frontdoor.yml
          git commit -m 'Move physical board delete safety to backend-v2'
          git push origin HEAD:feat/backend-v2-scolia-ownership-delete-parity
