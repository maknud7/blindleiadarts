name: Probe Webhotel Paths 2026-08-24

on:
  push:
    branches:
      - release/dartsatlas-screen-prod-20260824

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Probe SFTP paths
        env:
          GH_TOKEN: ${{ github.token }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          post() {
            local state="$1" context="$2"
            curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"Webhotel path permission probe\"}"
          }
          check() {
            local command="$1" context="$2"
            printf '%s\nquit\n' "$command" > probe.txt
            if sshpass -p "$SFTP_PASSWORD" sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -b probe.txt "${SFTP_USERNAME}@${SFTP_HOST}" >/dev/null 2>&1; then post success "$context"; else post failure "$context"; fi
          }
          check 'ls /www/blindleiadarts/test' 'prod/webhotel/test-path'
          check 'ls /www/blindleiadarts' 'prod/webhotel/parent-path'
          check 'mkdir /www/blindleiadarts/prod' 'prod/webhotel/create-prod'
          check 'ls /www/blindleiadarts/prod' 'prod/webhotel/prod-path'
