name: Scolia Release Control Contract

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/src/mysql/scolia-admin-repository.ts'
      - 'apps/backend-v2/src/runtime/equipment-admin-router.ts'
      - 'apps/admin/scolia-release-control.js'
      - 'apps/admin/test-hardware-readonly.js'
      - 'apps/admin/index.html'
      - 'infra/tests/scolia_release_control_contract_test.mjs'
      - '.github/workflows/scolia-release-control-contract.yml'
  push:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/src/mysql/scolia-admin-repository.ts'
      - 'apps/backend-v2/src/runtime/equipment-admin-router.ts'
      - 'apps/admin/scolia-release-control.js'
      - 'apps/admin/test-hardware-readonly.js'
      - 'apps/admin/index.html'
      - 'infra/tests/scolia_release_control_contract_test.mjs'
      - '.github/workflows/scolia-release-control-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify backend-v2 release API and admin control
        run: |
          set -Eeuo pipefail
          node --check apps/admin/scolia-release-control.js
          node --check apps/admin/test-hardware-readonly.js
          node infra/tests/scolia_release_control_contract_test.mjs
