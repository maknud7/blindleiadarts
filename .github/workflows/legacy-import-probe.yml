name: Legacy Import Probe

on:
  push:
    branches:
      - develop
    paths:
      - infra/import/run-probe.flag

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring
          coverage: none

      - name: Probe current historical season
        env:
          LEGACY_SEASON_ID: rFByCgOqI1rq
        run: php infra/import/legacy_atlas_probe.php
