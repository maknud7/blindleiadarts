name: Verify Core Test DB

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/kiosk/**'
      - 'apps/live/**'
      - 'apps/player/**'
      - 'apps/onboarding/**'
      - 'packages/**'
      - 'infra/sql/**'
      - 'infra/deploy/**'
      - '.github/workflows/core-verify.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: PHP syntax check
        run: |
          find apps packages infra -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run test migrations
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify tournament registration and group schema
        run: php infra/sql/tournament_groups_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify player portal content schema
        run: php infra/sql/player_portal_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify ELO ledger schema
        run: php infra/sql/elo_ledger_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify tournament operations schema
        run: php infra/sql/tournament_operations_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify player break schema
        run: php infra/sql/player_breaks_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify tournament playoff schema
        run: php infra/sql/tournament_playoffs_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify account-player-member identity
        run: php infra/sql/identity_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify member onboarding model
        run: php infra/sql/onboarding_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Seed pilot superadmin onboarding invite
        run: php infra/sql/seed_first_superadmin_onboarding.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify completed pilot onboarding
        run: php infra/sql/post_onboarding_pilot_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Generate test API config
        run: php infra/deploy/generate_api_config.php --output=apps/api/config.php
        env:
          APP_ENV: test
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          STATIC_BASE_URL: ${{ vars.TEST_STATIC_BASE_URL || vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          SCREEN_DEFAULT_CLUB_SLUG: blindleia-dartklubb
          REALTIME_WEBSOCKET_URL: ${{ vars.TEST_REALTIME_WEBSOCKET_URL }}
          REALTIME_PUBLISH_URL: ${{ vars.TEST_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          MEMBERS_SQLCONNECT_PATH: /home/1/i/ingenting/dart/sqlconnect.php
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
          CHALLONGE_DEFAULT_SCOPES: ${{ vars.CHALLONGE_DEFAULT_SCOPES }}
          CHALLONGE_REDIRECT_URI: ${{ vars.TEST_CHALLONGE_REDIRECT_URI }}

      - name: Exercise ELO ledger apply and replay
        run: php infra/sql/elo_ledger_smoke.php

      - name: Exercise tournament operations queue and lifecycle
        run: php infra/sql/tournament_operations_smoke.php

      - name: Exercise seven minute player breaks
        run: php infra/sql/player_breaks_smoke.php

      - name: Exercise single elimination playoff lifecycle
        run: php infra/sql/tournament_playoffs_smoke.php

      - name: Exercise canonical match scoring
        run: php infra/sql/match_scoring_smoke.php

      - name: Exercise full onboarding lifecycle
        run: php infra/sql/onboarding_flow_smoke.php

      - name: Re-verify onboarding state after smoke cleanup
        run: php infra/sql/onboarding_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Release package smoke test
        run: |
          bash infra/deploy/build-release.sh test
          test -f dist/test/onboarding/index.html
          test -f dist/test/onboarding/app.js
          test -f dist/test/api/member-onboarding.php
          test -f dist/test/player/portal-content.js
          test -f dist/test/player/player-breaks.js
          test -f dist/test/player/portal-playoffs.js
          test -f dist/test/live/index.html
          test -f dist/test/live/app.js
          test -f dist/test/admin/tournament-summary-admin.js
          test -f dist/test/admin/tournament-elo-admin.js
          test -f dist/test/admin/tournament-operations-admin.js
          test -f dist/test/admin/tournament-playoff-admin.js
          test -f dist/test/kiosk/operations-runtime.js
          test -f dist/test/api/src/MatchScoringApplication.php
          test -f dist/test/api/src/Repository/MatchScoringRepository.php
          test -f dist/test/api/src/Service/Dart501Rules.php
          test -f dist/test/api/src/EloApplication.php
          test -f dist/test/api/src/Repository/EloLedgerRepository.php
          test -f dist/test/api/src/Repository/EloReadRepository.php
          test -f dist/test/api/src/Service/EloCalculator.php
          test -f dist/test/api/src/Service/EloLedgerService.php
          test -f dist/test/api/src/Service/EloReconciliationService.php
          test -f dist/test/api/src/TournamentOperationsApplication.php
          test -f dist/test/api/src/Repository/TournamentOperationsRepository.php
          test -f dist/test/api/src/Repository/TournamentLiveRepository.php
          test -f dist/test/api/src/PlayerBreakApplication.php
          test -f dist/test/api/src/Repository/PlayerBreakRepository.php
          test -f dist/test/api/src/TournamentPlayoffApplication.php
          test -f dist/test/api/src/Repository/TournamentPlayoffRepository.php
          test -f dist/test/api/src/Service/SingleEliminationService.php
          test -f dist/test/api/src/Service/PlayoffReconciliationService.php
