name: Verify Core Test DB

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/kiosk/**'
      - 'apps/live/**'
      - 'apps/player/**'
      - 'apps/onboarding/**'
      - 'apps/scolia-bridge/**'
      - 'packages/**'
      - 'infra/sql/**'
      - 'infra/deploy/**'
      - '.github/workflows/core-verify.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: PHP syntax check
        run: |
          find apps packages infra -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run test migrations
        run: php infra/sql/migrate.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_prod_

      - name: Verify tournament registration and group schema
        run: php infra/sql/tournament_groups_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify player portal content schema
        run: php infra/sql/player_portal_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify ELO ledger schema
        run: php infra/sql/elo_ledger_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify tournament operations schema
        run: php infra/sql/tournament_operations_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify player break schema
        run: php infra/sql/player_breaks_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify tournament playoff schema
        run: php infra/sql/tournament_playoffs_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      - name: Verify Scolia check-in and wizard schema
        run: php infra/sql/scolia_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_

      # TEST authentication and membership are canonical in PROD. This check is
      # deliberately read-only: PR CI must never create or delete canonical accounts,
      # roles, sessions or onboarding invitations just to exercise TEST.
      - name: Verify shared production identity boundary
        run: php infra/sql/shared_identity_doctor.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_prod_

      - name: Create temporary TEST admin browser session
        id: browser_session
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          token="$(openssl rand -hex 32)"
          export BROWSER_TEST_TOKEN="$token"
          php -r '
            mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
            $db=new mysqli(getenv("DB_HOST"),getenv("DB_USERNAME"),getenv("DB_PASSWORD"),getenv("DB_NAME"),(int)(getenv("DB_PORT") ?: 3306));
            $db->set_charset("utf8mb4");
            $row=$db->query("SELECT ua.id FROM bd_prod_user_accounts ua INNER JOIN bd_prod_global_user_roles gur ON gur.user_account_id=ua.id AND gur.role=\"super_admin\" WHERE ua.is_active=1 AND ua.account_status=\"active\" ORDER BY ua.id LIMIT 1")->fetch_assoc();
            if (!$row) {
              $row=$db->query("SELECT ua.id FROM bd_prod_user_accounts ua INNER JOIN bd_prod_club_user_roles cur ON cur.user_account_id=ua.id AND cur.role=\"club_admin\" WHERE ua.is_active=1 AND ua.account_status=\"active\" ORDER BY ua.id LIMIT 1")->fetch_assoc();
            }
            if (!$row) { fwrite(STDERR,"No active admin identity found\n"); exit(2); }
            $userId=(string)$row["id"];
            $hash=hash("sha256",getenv("BROWSER_TEST_TOKEN"));
            $stmt=$db->prepare("INSERT INTO bd_test_auth_sessions (user_account_id,session_token_hash,expires_at,last_used_at) VALUES (?,?,DATE_ADD(NOW(),INTERVAL 30 MINUTE),NOW())");
            $stmt->bind_param("ss",$userId,$hash);
            $stmt->execute();
            $id=$db->insert_id;
            file_put_contents(getenv("GITHUB_OUTPUT"),"token=".getenv("BROWSER_TEST_TOKEN")."\nsession_id=".$id."\n",FILE_APPEND);
          '

      - name: Install Chromium browser probe
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Desktop platform hit-test
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          BROWSER_TEST_TOKEN: ${{ steps.browser_session.outputs.token }}
        run: |
          cat > /tmp/desktop-hit-test.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = process.env.BASE_URL.replace(/\/$/, "");
          const token = process.env.BROWSER_TEST_TOKEN;
          const routes = ["#home", "#tournaments", "#statistics", "#club"];
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await page.addInitScript((value) => localStorage.setItem("bd:token", value), token);

          let failed = false;
          for (const route of routes) {
            await page.goto(base + "/" + route, { waitUntil: "domcontentloaded", timeout: 30000 });
            await page.waitForTimeout(route === "#club" ? 8000 : 5000);

            const result = await page.evaluate(() => {
              const visible = (el) => {
                const cs = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return cs.display !== "none" && cs.visibility !== "hidden" && Number(cs.opacity || "1") > 0.01
                  && r.width > 4 && r.height > 4 && r.bottom > 0 && r.right > 0
                  && r.top < innerHeight && r.left < innerWidth;
              };
              const fullScreen = [...document.querySelectorAll("body *")].filter((el) => {
                if (!visible(el)) return false;
                const cs = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return (cs.position === "fixed" || cs.position === "absolute")
                  && cs.pointerEvents !== "none"
                  && r.width >= innerWidth * 0.8
                  && r.height >= innerHeight * 0.8;
              }).map((el) => ({
                tag: el.tagName,
                id: el.id,
                cls: String(el.className || "").slice(0, 160),
                z: getComputedStyle(el).zIndex,
                pointer: getComputedStyle(el).pointerEvents,
                rect: [Math.round(el.getBoundingClientRect().left), Math.round(el.getBoundingClientRect().top), Math.round(el.getBoundingClientRect().width), Math.round(el.getBoundingClientRect().height)],
              }));

              const controls = [...document.querySelectorAll("a[href],button,select,input")].filter(visible).slice(0, 80);
              const blocked = [];
              for (const el of controls) {
                const r = el.getBoundingClientRect();
                const x = Math.max(0, Math.min(innerWidth - 1, r.left + r.width / 2));
                const y = Math.max(0, Math.min(innerHeight - 1, r.top + r.height / 2));
                const top = document.elementFromPoint(x, y);
                if (!top) continue;
                if (top === el || el.contains(top) || top.contains(el)) continue;
                blocked.push({
                  target: el.id || el.getAttribute("href") || el.textContent?.trim().slice(0, 60) || el.tagName,
                  blocker: top.id || String(top.className || "").slice(0, 100) || top.tagName,
                  targetTag: el.tagName,
                  blockerTag: top.tagName,
                  point: [Math.round(x), Math.round(y)],
                });
              }

              const centerStack = document.elementsFromPoint(innerWidth / 2, innerHeight / 2).slice(0, 8).map((el) => ({
                tag: el.tagName,
                id: el.id,
                cls: String(el.className || "").slice(0, 120),
                pointer: getComputedStyle(el).pointerEvents,
                z: getComputedStyle(el).zIndex,
              }));

              return {
                href: location.href,
                bodyClass: document.body.className,
                bodyActive: document.body.dataset.portalActive || "",
                fullScreen,
                blocked,
                centerStack,
              };
            });

            console.log("\nROUTE", route, JSON.stringify(result, null, 2));
            if (result.fullScreen.length || result.blocked.length) failed = true;
          }

          await browser.close();
          if (failed) process.exit(1);
          EOF
          node /tmp/desktop-hit-test.mjs

      - name: Cleanup temporary TEST admin browser session
        if: always() && steps.browser_session.outputs.session_id != ''
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SESSION_ID: ${{ steps.browser_session.outputs.session_id }}
        run: |
          php -r '
            mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
            $db=new mysqli(getenv("DB_HOST"),getenv("DB_USERNAME"),getenv("DB_PASSWORD"),getenv("DB_NAME"),(int)(getenv("DB_PORT") ?: 3306));
            $stmt=$db->prepare("DELETE FROM bd_test_auth_sessions WHERE id=?");
            $id=(string)getenv("SESSION_ID");
            $stmt->bind_param("s",$id);
            $stmt->execute();
          '

      - name: Generate isolated test API config for domain smoke tests
        run: php infra/deploy/generate_api_config.php --output=apps/api/config.php
        env:
          APP_ENV: test
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          STATIC_BASE_URL: ${{ vars.TEST_STATIC_BASE_URL || vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
          SCREEN_DEFAULT_CLUB_SLUG: blindleia-dartklubb
          REALTIME_WEBSOCKET_URL: ${{ vars.TEST_REALTIME_WEBSOCKET_URL }}
          REALTIME_PUBLISH_URL: ${{ vars.TEST_REALTIME_PUBLISH_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          SCOLIA_BRIDGE_SECRET: test-scolia-bridge-secret
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_test_
          IDENTITY_TABLE_PREFIX: bd_test_
          HARDWARE_TABLE_PREFIX: bd_test_
          MEMBERS_SQLCONNECT_PATH: /home/1/i/ingenting/dart/sqlconnect.php
          CHALLONGE_CLIENT_ID: ${{ secrets.CHALLONGE_CLIENT_ID }}
          CHALLONGE_CLIENT_SECRET: ${{ secrets.CHALLONGE_CLIENT_SECRET }}
          CHALLONGE_DEFAULT_SCOPES: ${{ vars.CHALLONGE_DEFAULT_SCOPES }}
          CHALLONGE_REDIRECT_URI: ${{ vars.TEST_CHALLONGE_REDIRECT_URI }}

      - name: Exercise ELO ledger apply and replay
        run: php infra/sql/elo_ledger_smoke.php

      - name: Exercise season standings and champion
        run: php infra/sql/season_smoke.php

      - name: Exercise tournament operations queue and lifecycle
        run: php infra/sql/tournament_operations_smoke.php

      - name: Exercise seven minute player breaks
        run: php infra/sql/player_breaks_smoke.php

      - name: Exercise single elimination playoff lifecycle
        run: php infra/sql/tournament_playoffs_smoke.php

      - name: Exercise canonical match scoring
        run: php infra/sql/match_scoring_smoke.php

      - name: Exercise Scolia sector mapping
        run: php apps/api/tests/scolia_sector_mapper_test.php

      - name: Exercise Scolia queue shadow live and manual fallback
        run: php infra/sql/scolia_smoke.php

      - name: Exercise onsite check-in and tournament wizard plan
        run: php infra/sql/checkin_smoke.php

      - name: Release package smoke test
        run: |
          bash infra/deploy/build-release.sh test
          test -f dist/test/onboarding/index.html
          test -f dist/test/onboarding/app.js
          test -f dist/test/api/member-onboarding.php
          test -f dist/test/player/portal-content.js
          test -f dist/test/player/player-breaks.js
          test -f dist/test/player/portal-playoffs.js
          test -f dist/test/player/checkin-runtime.js
          test -f dist/test/live/index.html
          test -f dist/test/live/app.js
          test -f dist/test/admin/tournament-summary-admin.js
          test -f dist/test/admin/tournament-elo-admin.js
          test -f dist/test/admin/tournament-operations-admin.js
          test -f dist/test/admin/tournament-playoff-admin.js
          test -f dist/test/admin/tournament-checkin-admin.js
          test -f dist/test/admin/tournament-wizard.js
          test -f dist/test/admin/season-admin.js
          test -f dist/test/admin/scolia-admin.js
          test -f dist/test/kiosk/operations-runtime.js
          test -f dist/test/kiosk/scolia-runtime.js
          test -f dist/test/kiosk/manifest.webmanifest
          test -f dist/test/kiosk/service-worker.js
          test -f dist/test/kiosk/install.js
          test -f dist/test/api/src/SeasonApplication.php
          test -f dist/test/api/src/Repository/SeasonRepository.php
          test -f dist/test/api/src/ScoliaApplication.php
          test -f dist/test/api/src/TournamentCheckinApplication.php
          test -f dist/test/api/src/TournamentWizardApplication.php
          test -f dist/test/api/src/Repository/ScoliaRepository.php
          test -f dist/test/api/src/Repository/TournamentCheckinRepository.php
          test -f dist/test/api/src/Repository/TournamentWizardRepository.php
          test -f dist/test/api/src/Service/ScoliaScoringService.php
          test -f dist/test/api/src/Service/ScoliaSectorMapper.php
          test -f dist/test/api/src/MatchScoringApplication.php
          test -f dist/test/api/src/Repository/MatchScoringRepository.php
          test -f dist/test/api/src/Service/Dart501Rules.php
          test -f dist/test/api/src/EloApplication.php
          test -f dist/test/api/src/Repository/EloLedgerRepository.php
          test -f dist/test/api/src/Repository/EloReadRepository.php
          test -f dist/test/api/src/Service/EloCalculator.php
          test -f dist/test/api/src/Service/EloLedgerService.php
          test -f dist/test/api/src/Service/EloReconciliationService.php
          test -f dist/test/api/src/TournamentOperationsApplication.php
          test -f dist/test/api/src/Repository/TournamentOperationsRepository.php
          test -f dist/test/api/src/Repository/TournamentLiveRepository.php
          test -f dist/test/api/src/PlayerBreakApplication.php
          test -f dist/test/api/src/Repository/PlayerBreakRepository.php
          test -f dist/test/api/src/TournamentPlayoffApplication.php
          test -f dist/test/api/src/Repository/TournamentPlayoffRepository.php
          test -f dist/test/api/src/Service/SingleEliminationService.php
          test -f dist/test/api/src/Service/PlayoffReconciliationService.php