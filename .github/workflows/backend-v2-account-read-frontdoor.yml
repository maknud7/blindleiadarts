name: Backend v2 Account Read Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/src/server.ts'
      - 'apps/backend-v2/test/account-read-side-effects.test.mjs'
      - 'apps/api/index.php'
      - 'apps/api/config.example.php'
      - 'apps/api/src/Support/Config.php'
      - 'apps/api/src/BackendV2AccountReadProxyApplication.php'
      - 'apps/api/tests/backend_v2_account_read_proxy_routing_test.php'
      - 'infra/deploy/generate_api_config.php'
      - '.github/workflows/backend-v2-account-read-frontdoor.yml'
      - '.github/workflows/backend-v2-account-read-prod-frontdoor.yml'
  push:
    branches:
      - develop
    paths:
      - 'apps/backend-v2/src/server.ts'
      - 'apps/backend-v2/test/account-read-side-effects.test.mjs'
      - 'apps/api/index.php'
      - 'apps/api/config.example.php'
      - 'apps/api/src/Support/Config.php'
      - 'apps/api/src/BackendV2AccountReadProxyApplication.php'
      - 'apps/api/tests/backend_v2_account_read_proxy_routing_test.php'
      - 'infra/deploy/generate_api_config.php'
      - '.github/workflows/backend-v2-account-read-frontdoor.yml'
      - '.github/workflows/backend-v2-account-read-prod-frontdoor.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify account read routing contract
        run: |
          set -Eeuo pipefail
          php -l apps/api/src/BackendV2AccountReadProxyApplication.php
          php -l apps/api/src/Support/Config.php
          php apps/api/tests/backend_v2_account_read_proxy_routing_test.php
          node --test apps/backend-v2/test/account-read-side-effects.test.mjs
          grep -Fq 'BackendV2AccountReadProxyApplication' apps/api/index.php
          grep -Fq "'account_read_routing_mode' => 'php'" apps/api/config.example.php

      - name: Verify generated routing defaults
        env:
          DB_HOST: example.invalid
          DB_PORT: '3306'
          DB_NAME: example
          DB_USERNAME: example
          DB_PASSWORD: example
          SCOLIA_BRIDGE_SECRET: example-secret
        run: |
          set -Eeuo pipefail
          APP_ENV=test DB_TABLE_PREFIX=bd_test_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            php infra/deploy/generate_api_config.php --output=/tmp/account-read-test.php
          APP_ENV=prod DB_TABLE_PREFIX=bd_prod_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            php infra/deploy/generate_api_config.php --output=/tmp/account-read-prod.php
          php -r '$c=require "/tmp/account-read-test.php"; if (($c["backend_v2"]["account_read_routing_mode"]??null)!=="node") exit(1);'
          php -r '$c=require "/tmp/account-read-prod.php"; if (($c["backend_v2"]["account_read_routing_mode"]??null)!=="php") exit(1);'

  runtime-smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Wait for matching Deploy Test success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-test.yml/runs?head_sha=${EXPECTED_SHA}&per_page=10"
          for attempt in $(seq 1 120); do
            runs="$(curl -fsS --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            conclusion="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .conclusion // empty' <<<"$runs")"
            status="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .status // empty' <<<"$runs")"
            if [[ "$conclusion" == "success" ]]; then
              release="$(curl -fsS --max-time 15 "${BASE_URL%/}/release.json?cb=$RANDOM")"
              grep -Fq "$EXPECTED_SHA" <<<"$release"
              exit 0
            fi
            if [[ "$status" == "completed" && -n "$conclusion" ]]; then
              echo "Matching Deploy Test completed with conclusion: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for successful Deploy Test for $EXPECTED_SHA" >&2
          exit 1

      - name: Verify account reads route to backend-v2
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          for path in \
            /api/v1/auth/me \
            /api/v1/me/profile \
            /api/v1/me/payments \
            /api/v1/me/eligibility
          do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --max-time 20 \
              -H 'Authorization: Bearer definitely-invalid-account-read-probe' \
              -D "$headers" -o "$body" -w '%{http_code}' "$base$path" || true)"
            if [[ "$status" != "401" ]]; then
              echo "$path returned HTTP ${status:-unknown}; expected 401." >&2
              cat "$body" >&2
              exit 1
            fi
            if ! grep -Eiq '^X-BD-Backend-V2:[[:space:]]*account-read' "$headers"; then
              echo "$path did not traverse the backend-v2 account-read front door." >&2
              cat "$headers" >&2
              exit 1
            fi
            error_code="$(jq -r '.error.code // empty' "$body" 2>/dev/null || true)"
            if [[ "$error_code" != "invalid_session" && "$error_code" != "authentication_required" ]]; then
              echo "$path did not return the expected backend-v2 authentication error." >&2
              cat "$body" >&2
              exit 1
            fi
            rm -f "$headers" "$body"
          done
