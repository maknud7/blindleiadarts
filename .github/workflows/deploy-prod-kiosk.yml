name: Deploy Production Kiosk

on:
  push:
    branches:
      - develop
    paths:
      - '.github/prod-kiosk-release-request'

permissions:
  contents: read

concurrency:
  group: deploy-production-kiosk
  cancel-in-progress: false

jobs:
  deploy-kiosk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate kiosk release request
        id: request
        run: |
          set -Eeuo pipefail
          test -f .github/prod-kiosk-release-request
          release_sha="$(awk -F= '$1=="release_sha" {print $2}' .github/prod-kiosk-release-request | tail -1 | tr -d '[:space:]')"
          scope="$(awk -F= '$1=="scope" {print $2}' .github/prod-kiosk-release-request | tail -1 | tr -d '[:space:]')"

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Kiosk production release requires an exact 40-character tested SHA."
            exit 1
          fi
          if [[ "$scope" != "kiosk-static-only" ]]; then
            echo "::error::Only kiosk-static-only scope is allowed in this workflow."
            exit 1
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Kiosk-only release request accepted for $release_sha."

      - name: Checkout exact tested kiosk release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.release_sha }}
          fetch-depth: 1

      - name: Verify exact checkout and allowed files
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          for file in \
            apps/kiosk/index.html \
            apps/kiosk/kiosk-fine-polish.css \
            apps/kiosk/kiosk-fine-polish.js \
            apps/kiosk/service-worker.js; do
            test -f "$file"
          done
          grep -Fq 'kiosk-fine-polish.css?v=20260902-02' apps/kiosk/index.html
          grep -Fq 'kiosk-fine-polish.js?v=20260903-undo-01' apps/kiosk/index.html
          grep -Fq 'const POLISH_VERSION = "1.1"' apps/kiosk/kiosk-fine-polish.js
          grep -Fq 'bd-kiosk-shell-v35' apps/kiosk/service-worker.js
          echo "KIOSK_RELEASE_SCOPE_OK=yes"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Build exact TEST and PROD kiosk packages
        run: |
          set -Eeuo pipefail
          bash infra/deploy/build-release.sh test
          bash infra/deploy/build-release.sh prod

          grep -Fq 'data-bd-surface="kiosk"' dist/test/kiosk/index.html
          grep -Fq 'data-app-env="test"' dist/test/kiosk/index.html
          grep -Fq 'data-bd-surface="kiosk"' dist/prod/kiosk/index.html
          grep -Fq 'data-app-env="prod"' dist/prod/kiosk/index.html
          grep -Fq 'kiosk-fine-polish.js?v=20260903-undo-01' dist/test/kiosk/index.html
          grep -Fq 'kiosk-fine-polish.js?v=20260903-undo-01' dist/prod/kiosk/index.html

      - name: Verify exact built kiosk assets are currently on TEST
        env:
          TEST_BASE_URL: https://test.blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          declare -a files=(
            index.html
            kiosk-fine-polish.css
            kiosk-fine-polish.js
            service-worker.js
          )
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
              "$TEST_BASE_URL/kiosk/$file?cb=$RANDOM" -o "/tmp/test-$file"
            expected="$(sha256sum "dist/test/kiosk/$file" | awk '{print $1}')"
            actual="$(sha256sum "/tmp/test-$file" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::TEST kiosk asset does not match the built kiosk release: $file"
              exit 1
            fi
          done
          echo "TEST_KIOSK_ASSETS_MATCH=yes"

      - name: Read-only production preflight
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_TABLE_PREFIX: bd_prod_
          HARDWARE_TABLE_PREFIX: bd_prod_
        run: |
          set +e
          php infra/sql/prod_preflight.php | tee /tmp/prod-kiosk-preflight.txt
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            echo "::error::Production preflight is not safe for kiosk-only deployment."
            exit "$status"
          fi
          echo "KIOSK_PROD_PREFLIGHT_OK=yes"

      - name: Snapshot current production kiosk for rollback
        env:
          PROD_BASE_URL: https://blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/prod-kiosk-rollback

          for file in index.html service-worker.js; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
              "$PROD_BASE_URL/kiosk/$file?cb=$RANDOM" -o "/tmp/prod-kiosk-rollback/$file"
          done

          for file in kiosk-fine-polish.css kiosk-fine-polish.js; do
            if curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 \
              "$PROD_BASE_URL/kiosk/$file?cb=$RANDOM" -o "/tmp/prod-kiosk-rollback/$file"; then
              echo "$file present on production before release."
            else
              rm -f "/tmp/prod-kiosk-rollback/$file"
              printf '%s\n' "ABSENT_BEFORE_RELEASE" > "/tmp/prod-kiosk-rollback/$file.absent"
              echo "$file is new in this release; absence recorded in rollback snapshot."
            fi
          done

          (
            cd /tmp/prod-kiosk-rollback
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )
          echo "KIOSK_PROD_ROLLBACK_SNAPSHOT_READY=yes"

      - name: Store production kiosk rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: prod-kiosk-before-${{ steps.request.outputs.release_sha }}
          path: /tmp/prod-kiosk-rollback
          if-no-files-found: error
          retention-days: 30

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy only built kiosk static assets to production
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_KIOSK: /www/blindleiadarts/prod/kiosk
        run: |
          set -Eeuo pipefail
          for name in SFTP_HOST SFTP_USERNAME SFTP_PASSWORD REMOTE_KIOSK; do
            test -n "${!name:-}"
          done
          cat > /tmp/kiosk-sftp.txt <<EOF
          put dist/prod/kiosk/index.html ${REMOTE_KIOSK}/index.html
          put dist/prod/kiosk/kiosk-fine-polish.css ${REMOTE_KIOSK}/kiosk-fine-polish.css
          put dist/prod/kiosk/kiosk-fine-polish.js ${REMOTE_KIOSK}/kiosk-fine-polish.js
          put dist/prod/kiosk/service-worker.js ${REMOTE_KIOSK}/service-worker.js
          quit
          EOF
          sed -i 's/^          //' /tmp/kiosk-sftp.txt
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -b /tmp/kiosk-sftp.txt "${SFTP_USERNAME}@${SFTP_HOST}"

      - name: Verify exact built kiosk assets on production
        env:
          PROD_BASE_URL: https://blindleiadart.ingenting.org
        run: |
          set -Eeuo pipefail
          declare -a files=(
            index.html
            kiosk-fine-polish.css
            kiosk-fine-polish.js
            service-worker.js
          )
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
              "$PROD_BASE_URL/kiosk/$file?cb=$RANDOM" -o "/tmp/prod-$file"
            expected="$(sha256sum "dist/prod/kiosk/$file" | awk '{print $1}')"
            actual="$(sha256sum "/tmp/prod-$file" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::Production kiosk verification failed for $file"
              exit 1
            fi
          done
          grep -Fq 'data-bd-surface="kiosk"' /tmp/prod-index.html
          grep -Fq 'data-app-env="prod"' /tmp/prod-index.html
          grep -Fq 'kiosk-fine-polish.css?v=20260902-02' /tmp/prod-index.html
          grep -Fq 'kiosk-fine-polish.js?v=20260903-undo-01' /tmp/prod-index.html
          grep -Fq 'const POLISH_VERSION = "1.1"' /tmp/prod-kiosk-fine-polish.js
          grep -Fq 'bd-kiosk-shell-v35' /tmp/prod-service-worker.js
          echo "KIOSK_PROD_DEPLOY_OK=yes"
