name: Verify Retired Kiosk SSE

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/.htaccess'
      - '.github/workflows/kiosk-sse-retirement-smoke.yml'
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify kiosk SSE retirement contract
        run: |
          set -Eeuo pipefail
          grep -Fq 'RewriteRule ^v1/kiosks/[^/]+/live$ - [G,L]' apps/api/.htaccess
          if grep -Eq 'RewriteRule .*kiosks/.*/state.*\[G' apps/api/.htaccess; then
            echo 'Canonical kiosk /state must not be retired.' >&2
            exit 1
          fi

  runtime-smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Wait for matching Deploy Test success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-test.yml/runs?head_sha=${EXPECTED_SHA}&per_page=10"
          for attempt in $(seq 1 120); do
            runs="$(curl -fsS --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            conclusion="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .conclusion // empty' <<<"$runs")"
            status="$(jq -r '.workflow_runs | map(select(.event == "push")) | first | .status // empty' <<<"$runs")"
            if [[ "$conclusion" == "success" ]]; then
              release="$(curl -fsS --max-time 15 "${BASE_URL%/}/release.json?cb=$RANDOM")"
              grep -Fq "$EXPECTED_SHA" <<<"$release"
              exit 0
            fi
            if [[ "$status" == "completed" && -n "$conclusion" ]]; then
              echo "Matching Deploy Test completed with conclusion: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for successful Deploy Test for $EXPECTED_SHA" >&2
          exit 1

      - name: Verify retired kiosk SSE and canonical state front door
        env:
          BASE_URL: ${{ vars.TEST_BASE_URL || 'https://test.blindleiadarts.ingenting.org' }}
        run: |
          set -Eeuo pipefail
          base="${BASE_URL%/}"
          probe="__retired_sse_probe__"

          live_status="$(curl -sS --max-time 15 -o /tmp/live-body -w '%{http_code}' "$base/api/v1/kiosks/$probe/live" || true)"
          if [[ "$live_status" != "410" ]]; then
            echo "Retired kiosk SSE endpoint returned HTTP ${live_status:-unknown}; expected 410." >&2
            cat /tmp/live-body >&2 || true
            exit 1
          fi

          state_status="$(curl -sS --max-time 15 -D /tmp/state-headers -o /tmp/state-body -w '%{http_code}' "$base/api/v1/kiosks/$probe/state" || true)"
          if [[ "$state_status" != "404" ]]; then
            echo "Canonical kiosk state probe returned HTTP ${state_status:-unknown}; expected routed 404 for missing kiosk." >&2
            cat /tmp/state-body >&2 || true
            exit 1
          fi
          grep -Fqi 'X-BD-Backend-V2: scolia' /tmp/state-headers
          grep -Fq 'kiosk_not_found' /tmp/state-body
