name: Verify DartsAtlas Screen Production 2026-08-24

on:
  push:
    branches:
      - release/dartsatlas-screen-prod-20260824

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify deployed files and scraper
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          ROOT="${PROD_BASE_URL%/}"
          post_status() {
            local state="$1" context="$2" description="$3"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}"
          }

          if [ -z "$ROOT" ]; then
            post_status failure prod/dartsatlas-screen/files "PROD_BASE_URL missing"
            post_status failure prod/dartsatlas-screen/scraper "PROD_BASE_URL missing"
            exit 0
          fi

          FILES_OK=1
          curl --fail --silent --show-error --max-time 30 "$ROOT/screen/" -o screen.html || FILES_OK=0
          curl --fail --silent --show-error --max-time 30 "$ROOT/screen/live.js?v=20260824-1" -o live.js || FILES_OK=0
          if [ "$FILES_OK" = "1" ] && grep -q "BLINDLEIA" screen.html && grep -q "dartsatlas-screen.php" live.js; then
            post_status success prod/dartsatlas-screen/files "Production screen files point to standalone scraper"
          else
            post_status failure prod/dartsatlas-screen/files "Production screen files missing or old"
          fi

          HTTP=$(curl --silent --show-error --max-time 90 --output payload.json --write-out "%{http_code}" "$ROOT/api/dartsatlas-screen.php" || echo 000)
          echo "Scraper HTTP: $HTTP"
          cat payload.json 2>/dev/null || true
          if [ "$HTTP" = "200" ] && php -r '$d=json_decode(file_get_contents("payload.json"),true); exit(is_array($d) && ($d["ok"]??false) && !empty($d["tournament"]) ? 0 : 1);'; then
            post_status success prod/dartsatlas-screen/scraper "DartsAtlas scraper returns a tournament"
          else
            post_status failure prod/dartsatlas-screen/scraper "DartsAtlas scraper unavailable or no tournament"
          fi
