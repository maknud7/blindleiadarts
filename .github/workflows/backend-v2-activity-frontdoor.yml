name: Backend v2 Activity Frontdoor

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/api/src/BackendV2ActivityProxyApplication.php'
      - 'apps/api/src/Support/Config.php'
      - 'apps/api/index.php'
      - 'apps/api/config.example.php'
      - 'apps/api/tests/backend_v2_activity_proxy_routing_test.php'
      - 'infra/deploy/generate_api_config.php'
      - '.github/workflows/backend-v2-activity-frontdoor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, dom
          coverage: none

      - name: Verify fail-closed activity frontdoor
        run: |
          set -Eeuo pipefail
          php -l apps/api/src/BackendV2ActivityProxyApplication.php
          php -l apps/api/src/Support/Config.php
          php -l apps/api/index.php
          php -l apps/api/tests/backend_v2_activity_proxy_routing_test.php
          php apps/api/tests/backend_v2_activity_proxy_routing_test.php
          grep -Fq 'backendV2ActivityRoutingMode()' apps/api/src/BackendV2ActivityProxyApplication.php
          grep -Fq 'PHP fallback is disabled' apps/api/src/BackendV2ActivityProxyApplication.php
          grep -Fq 'BackendV2ActivityProxyApplication' apps/api/index.php

      - name: Verify TEST-only activity routing default
        env:
          SCOLIA_BRIDGE_SECRET: activity-routing-contract
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: test
          DB_USERNAME: test
          DB_PASSWORD: test
        run: |
          set -Eeuo pipefail
          APP_ENV=test BASE_URL=https://test.blindleiadarts.ingenting.org STATIC_BASE_URL=https://test.blindleiadarts.ingenting.org \
            DB_TABLE_PREFIX=bd_test_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            BACKEND_V2_BASE_URL=https://blindleia-backend-v2-test.onrender.com \
            php infra/deploy/generate_api_config.php --output=/tmp/activity-test.php
          php -r '$c=require "/tmp/activity-test.php"; $b=$c["backend_v2"]??[]; if (($b["activity_routing_mode"]??null)!=="node") exit(1);'

          APP_ENV=prod BASE_URL=https://blindleiadarts.ingenting.org STATIC_BASE_URL=https://blindleiadarts.ingenting.org \
            DB_TABLE_PREFIX=bd_prod_ IDENTITY_TABLE_PREFIX=bd_prod_ HARDWARE_TABLE_PREFIX=bd_prod_ \
            php infra/deploy/generate_api_config.php --output=/tmp/activity-prod.php
          php -r '$c=require "/tmp/activity-prod.php"; $b=$c["backend_v2"]??[]; if (($b["activity_routing_mode"]??null)!=="php") exit(1);'

      - name: Verify activity proxy precedes legacy PHP
        run: |
          set -Eeuo pipefail
          php -r '$s=file_get_contents("apps/api/index.php"); $n=strpos($s,"$activityV2 = new BackendV2ActivityProxyApplication"); $p=strpos($s,"$activity = new ActivityApplication"); if ($n===false||$p===false||$n>=$p) exit(1);'
