name: Probe Atlas Series Two

on:
  push:
    branches: [develop]
    paths:
      - infra/sql/run-probe-atlas-series-two-test.flag

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for generic probe on test
        run: |
          set -Eeuo pipefail
          url='https://test.blindleiadarts.ingenting.org/api/atlas-tournament-probe.php?tournament=x'
          for attempt in $(seq 1 80); do
            status="$(curl -sS -o /tmp/check.json -w '%{http_code}' --max-time 20 "$url" || true)"
            if [[ "$status" == '400' ]] && grep -Fq 'invalid_tournament_id' /tmp/check.json; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Cool down Atlas
        run: sleep 60
      - name: Fetch Mandagsserien two source
        run: |
          set -Eeuo pipefail
          url='https://test.blindleiadarts.ingenting.org/api/atlas-tournament-probe.php?tournament=FHHAnnuO8txa'
          for attempt in $(seq 1 8); do
            status="$(curl -sS -o /tmp/series-two.json -w '%{http_code}' --max-time 120 "$url" || true)"
            echo "attempt=${attempt} status=${status}"
            if [[ "$status" == '200' ]]; then break; fi
            sleep 90
          done
          php -r '
            $d=json_decode(file_get_contents("/tmp/series-two.json"),true,512,JSON_THROW_ON_ERROR);
            if(($d["tournament_external_id"]??"")!=="FHHAnnuO8txa") exit(2);
            foreach($d["pages"] as $name=>$p){
              echo "PAGE {$name} status=".($p["status"]??0)." players=".count($p["players"]??[])." matches=".count($p["matches"]??[]).PHP_EOL;
              if(in_array($name,["root","groups","group-1","group-2","group-3","group-4","results"],true)){
                foreach(($p["players"]??[]) as $id=>$player) echo "PLAYER {$name} {$id} {$player}".PHP_EOL;
                foreach(($p["matches"]??[]) as $id=>$label) echo "MATCH {$name} {$id} {$label}".PHP_EOL;
              }
            }
          '
