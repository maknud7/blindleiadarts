name: One-off tiebreak order patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/oneoff-tiebreak-order-request-main'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch canonical group tiebreak order
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          php_path = Path('apps/api/src/Repository/PlayerPortalRepository.php')
          text = php_path.read_text(encoding='utf-8')
          old_order = "            'tie_break_order' => ['leg_difference', 'three_dart_average', 'head_to_head'],"
          new_order = "            'tie_break_order' => ['leg_difference', 'head_to_head', 'three_dart_average'],"
          if text.count(old_order) != 1:
              raise SystemExit(f'Expected exactly one old tie_break_order, found {text.count(old_order)}')
          text = text.replace(old_order, new_order, 1)

          function_marker = '    private function normalizeTableRows(array $rows, int $tournamentId, ?int $groupId): array'
          function_pos = text.index(function_marker)
          start_marker = '        usort($rows, static function (array $a, array $b): int {'
          end_marker = '        foreach ($ranked as $index => &$row) {'
          block_start = text.index(start_marker, function_pos)
          block_end = text.index(end_marker, block_start)
          new_lines = [
              '        // Table points are primary. Ties are resolved by leg difference,',
              '        // then the mini-table/head-to-head result, then 3-dart average.',
              '        usort($rows, static function (array $a, array $b): int {',
              "            $cmp = ((int) $b['points']) <=> ((int) $a['points']);",
              '            if ($cmp !== 0) return $cmp;',
              "            $cmp = ((int) $b['leg_diff']) <=> ((int) $a['leg_diff']);",
              "            return $cmp !== 0 ? $cmp : strcasecmp((string) $a['display_name'], (string) $b['display_name']);",
              '        });',
              '',
              '        $ranked = [];',
              '        for ($index = 0, $count = count($rows); $index < $count;) {',
              '            $bucket = [$rows[$index]];',
              '            $cursor = $index + 1;',
              '            while ($cursor < $count',
              "                && (int) $rows[$cursor]['points'] === (int) $rows[$index]['points']",
              "                && (int) $rows[$cursor]['leg_diff'] === (int) $rows[$index]['leg_diff']) {",
              '                $bucket[] = $rows[$cursor];',
              '                $cursor++;',
              '            }',
              '',
              '            if (count($bucket) > 1) {',
              '                $headToHead = $this->headToHeadPoints(',
              '                    $tournamentId,',
              "                    array_map(static fn (array $row): int => (int) $row['player_id'], $bucket),",
              '                    $groupId',
              '                );',
              '                foreach ($bucket as &$row) {',
              "                    $row['head_to_head_points'] = (int) ($headToHead[(int) $row['player_id']] ?? 0);",
              '                }',
              '                unset($row);',
              '                usort($bucket, static function (array $a, array $b): int {',
              "                    $cmp = ((int) $b['head_to_head_points']) <=> ((int) $a['head_to_head_points']);",
              '                    if ($cmp !== 0) return $cmp;',
              "                    $cmp = ((float) $b['three_dart_average']) <=> ((float) $a['three_dart_average']);",
              "                    return $cmp !== 0 ? $cmp : strcasecmp((string) $a['display_name'], (string) $b['display_name']);",
              '                });',
              '            }',
              '',
              '            array_push($ranked, ...$bucket);',
              '            $index = $cursor;',
              '        }',
              '',
          ]
          text = text[:block_start] + '\n'.join(new_lines) + text[block_end:]
          php_path.write_text(text, encoding='utf-8')

          js_path = Path('apps/player/tournament-groups-detail.js')
          js = js_path.read_text(encoding='utf-8')
          old_label = 'Ved likt: legdiff → 3DA → innbyrdes'
          new_label = 'Ved likt: legdiff → innbyrdes → 3DA'
          if js.count(old_label) != 1:
              raise SystemExit(f'Expected exactly one old player label, found {js.count(old_label)}')
          js_path.write_text(js.replace(old_label, new_label, 1), encoding='utf-8')
          PY

          php -l apps/api/src/Repository/PlayerPortalRepository.php
          grep -Fq "'tie_break_order' => ['leg_difference', 'head_to_head', 'three_dart_average']" apps/api/src/Repository/PlayerPortalRepository.php
          grep -Fq 'Ved likt: legdiff → innbyrdes → 3DA' apps/player/tournament-groups-detail.js

      - name: Commit patch to develop
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/Repository/PlayerPortalRepository.php apps/player/tournament-groups-detail.js
          git commit -m 'Use head-to-head before 3DA in group tiebreaks'
          git push origin HEAD:develop
