name: Apply realtime latency patch once

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: realtime-latency-patch-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time realtime latency patch workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply targeted latency changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {found}")
              p.write_text(text.replace(old, new))

          app = 'apps/api/src/Application.php'
          replace_exact(
              app,
              "use Blindleia\\Dartkiosk\\Api\\Repository\\TournamentRepository;\n",
              "use Blindleia\\Dartkiosk\\Api\\Repository\\TournamentLiveRepository;\nuse Blindleia\\Dartkiosk\\Api\\Repository\\TournamentRepository;\n",
          )
          replace_exact(
              app,
              "final class Application\n{\n    private string $rootPath;\n",
              "final class Application\n{\n    private string $rootPath;\n\n    /** @var array<int, callable(): void> */\n    private array $afterResponse = [];\n",
          )
          replace_exact(
              app,
              "        $response->send();\n    }\n\n    private function dispatch",
              "        $response->send();\n        $this->flushAfterResponse();\n    }\n\n    private function dispatch",
          )
          replace_exact(
              app,
              "            $this->publishKioskAndClubSnapshots($config, $database, $state);",
              "            $this->deferKioskAndClubSnapshots($config, $database, $state);",
              expected=3,
          )
          replace_exact(
              app,
              "        $clubRepository = new ClubRepository($database);\n        $tournamentRepository = new TournamentRepository($database);\n        $dashboard = $clubRepository->getDashboard($clubId);\n",
              "        $clubRepository = new ClubRepository($database);\n        $tournamentRepository = new TournamentRepository($database);\n        $liveRepository = new TournamentLiveRepository($database);\n        $dashboard = $clubRepository->getDashboard($clubId);\n        $club = $clubRepository->findById($clubId);\n        $live = $club !== null && isset($club['slug'])\n            ? $liveRepository->byClubSlug((string) $club['slug'])\n            : null;\n",
          )
          replace_exact(
              app,
              "                'screen' => $this->buildScreenPayload($database, $config, null, $clubId),\n                'server_time' => gmdate(DATE_ATOM),",
              "                'screen' => $this->buildScreenPayload($database, $config, null, $clubId),\n                'live' => $live,\n                'server_time' => gmdate(DATE_ATOM),",
          )
          marker = "    /**\n     * @param array<string, mixed> $state\n     */\n    private function publishKioskAndClubSnapshots(Config $config, Database $database, array $state): void\n"
          insert = """    /**\n     * @param array<string, mixed> $state\n     */\n    private function deferKioskAndClubSnapshots(Config $config, Database $database, array $state): void\n    {\n        if (!$config->realtimePublishEnabled()) {\n            return;\n        }\n\n        $this->afterResponse[] = function () use ($config, $database, $state): void {\n            $this->publishKioskAndClubSnapshots($config, $database, $state);\n        };\n    }\n\n    private function flushAfterResponse(): void\n    {\n        if ($this->afterResponse === []) {\n            return;\n        }\n\n        ignore_user_abort(true);\n\n        if (function_exists('fastcgi_finish_request')) {\n            @fastcgi_finish_request();\n        } else {\n            while (ob_get_level() > 0) {\n                @ob_end_flush();\n            }\n            @flush();\n        }\n\n        $callbacks = $this->afterResponse;\n        $this->afterResponse = [];\n\n        foreach ($callbacks as $callback) {\n            try {\n                $callback();\n            } catch (Throwable) {\n                // Realtime fanout happens after the response and must never affect scoring.\n            }\n        }\n    }\n\n""" + marker
          replace_exact(app, marker, insert)

          live = 'apps/live/app.js'
          replace_exact(
              live,
              "        if (message?.type === \"event\" && message?.event === \"snapshot\") load().catch(() => undefined);",
              "        if (message?.type === \"event\" && message?.event === \"snapshot\") {\n          const live = message?.payload?.live || null;\n          if (live && livePayloadIsRelevant(live)) {\n            render(live);\n            setPhase(\"live\");\n            return;\n          }\n          load().catch(() => undefined);\n        }",
          )

          kiosk = 'apps/kiosk/app.js'
          replace_exact(
              kiosk,
              "  liveSource: null,\n  reconnectHandle: null,",
              "  liveSource: null,\n  socket: null,\n  realtime: null,\n  reconnectHandle: null,",
          )
          old_live = """function startPolling() {\n  clearInterval(state.pollHandle);\n  state.pollHandle = setInterval(() => {\n    if (state.mutating) return;\n    if (state.kioskCode) loadState().catch(() => undefined);\n    else if (state.pairingRequestCode) checkPairing().catch(() => undefined);\n  }, 1500);\n}\nfunction closeLive() {\n  if (state.liveSource) { state.liveSource.close(); state.liveSource = null; }\n  clearTimeout(state.reconnectHandle);\n  clearInterval(state.pollHandle);\n  state.pollHandle = null;\n}\nasync function startLive() {\n  closeLive();\n  if (!state.kioskCode) { startPolling(); return; }\n  if (typeof EventSource !== \"function\") { startPolling(); return; }\n  const url = `${API_ROOT}/kiosks/${encodeURIComponent(state.kioskCode)}/live?pairing_token=${encodeURIComponent(state.pairingToken)}`;\n  const source = new EventSource(url); state.liveSource = source;\n  source.addEventListener(\"snapshot\", (event) => { if (state.mutating) return; try { state.snapshot = JSON.parse(event.data); render(); } catch {} });\n  source.onerror = () => { if (state.liveSource === source) state.liveSource = null; source.close(); startPolling(); clearTimeout(state.reconnectHandle); state.reconnectHandle = setTimeout(() => startLive().catch(() => undefined), 2500); };\n}\n"""
          new_live = """function startPolling() {\n  clearInterval(state.pollHandle);\n  state.pollHandle = setInterval(() => {\n    if (state.mutating) return;\n    if (state.kioskCode) loadState().catch(() => undefined);\n    else if (state.pairingRequestCode) checkPairing().catch(() => undefined);\n  }, 1500);\n}\nasync function realtimeConfig() {\n  if (state.realtime) return state.realtime;\n  try { state.realtime = await api(\"/realtime/config\"); }\n  catch { state.realtime = { enabled: false }; }\n  return state.realtime;\n}\nfunction closeLive() {\n  if (state.socket) { const socket = state.socket; state.socket = null; socket.close(); }\n  if (state.liveSource) { state.liveSource.close(); state.liveSource = null; }\n  clearTimeout(state.reconnectHandle);\n  clearInterval(state.pollHandle);\n  state.pollHandle = null;\n}\nfunction startSseLive() {\n  if (!state.kioskCode) { startPolling(); return; }\n  if (typeof EventSource !== \"function\") { startPolling(); return; }\n  const url = `${API_ROOT}/kiosks/${encodeURIComponent(state.kioskCode)}/live?pairing_token=${encodeURIComponent(state.pairingToken)}`;\n  const source = new EventSource(url); state.liveSource = source;\n  source.addEventListener(\"snapshot\", (event) => { if (state.mutating) return; try { state.snapshot = JSON.parse(event.data); render(); } catch {} });\n  source.onerror = () => {\n    if (state.liveSource !== source) return;\n    state.liveSource = null;\n    source.close();\n    startPolling();\n    clearTimeout(state.reconnectHandle);\n    state.reconnectHandle = setTimeout(() => startLive().catch(() => undefined), 2500);\n  };\n}\nasync function startLive() {\n  closeLive();\n  if (!state.kioskCode) { startPolling(); return; }\n  const config = await realtimeConfig();\n  if (!config?.enabled || !config.websocket_url || typeof WebSocket !== \"function\") { startSseLive(); return; }\n  try {\n    const socket = new WebSocket(config.websocket_url);\n    state.socket = socket;\n    socket.addEventListener(\"open\", () => {\n      if (state.socket !== socket) return;\n      socket.send(JSON.stringify({ type: \"subscribe\", channels: [`kiosk:${state.kioskCode}`] }));\n    });\n    socket.addEventListener(\"message\", (event) => {\n      if (state.mutating) return;\n      try {\n        const message = JSON.parse(event.data);\n        if (message?.type === \"event\" && message?.event === \"snapshot\" && message?.payload) {\n          state.snapshot = message.payload;\n          render();\n        }\n      } catch {}\n    });\n    socket.addEventListener(\"close\", () => {\n      if (state.socket !== socket) return;\n      state.socket = null;\n      startSseLive();\n      clearTimeout(state.reconnectHandle);\n      state.reconnectHandle = setTimeout(() => startLive().catch(() => undefined), 2500);\n    });\n    socket.addEventListener(\"error\", () => socket.close());\n  } catch { startSseLive(); }\n}\n"""
          replace_exact(kiosk, old_live, new_live)
          PY

      - name: Verify syntax
        run: |
          php -l apps/api/src/Application.php
          node --check apps/live/app.js
          node --check apps/kiosk/app.js
          php apps/api/tests/dart501_rules_test.php

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/realtime-latency-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/Application.php apps/live/app.js apps/kiosk/app.js
          git commit -m "Speed up realtime score propagation"
          git push origin HEAD:develop
