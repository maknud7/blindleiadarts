name: Platform v2

on:
  pull_request:
    branches: [develop]
    paths:
      - 'package.json'
      - 'apps/platform-v2/**'
      - 'apps/admin/platform-v2-test-routing.js'
      - 'apps/kiosk/prod-test-entry.js'
      - 'infra/deploy/build-release.sh'
      - '.github/workflows/platform-v2.yml'
  push:
    branches: [develop]
    paths:
      - 'package.json'
      - 'apps/platform-v2/**'
      - 'apps/admin/platform-v2-test-routing.js'
      - 'apps/kiosk/prod-test-entry.js'
      - 'infra/deploy/build-release.sh'
      - '.github/workflows/platform-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck platform v2
        run: npm run v2:typecheck

      - name: Enforce v2 architecture boundaries
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -R -n -F 'MutationObserver' apps/platform-v2/src --include='*.ts' --include='*.tsx'; then
            echo 'Platform v2 must not compose features through MutationObserver.' >&2
            exit 1
          fi

          direct_fetch="$(grep -R -n -F 'fetch(' apps/platform-v2/src --include='*.ts' --include='*.tsx' \
            | grep -v '^apps/platform-v2/src/shared/api.ts:' || true)"
          if [[ -n "$direct_fetch" ]]; then
            printf '%s\n' "$direct_fetch"
            echo 'Platform v2 HTTP traffic must go through src/shared/api.ts.' >&2
            exit 1
          fi

      - name: Verify connected TEST navigation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'equipment: "/v2/equipment/"' apps/admin/platform-v2-test-routing.js
          grep -Fq 'kiosk: prodKioskUrl()' apps/admin/platform-v2-test-routing.js
          grep -Fq 'const kioskHref = testHost ? prodKioskHref() : routes.kiosk' apps/platform-v2/src/shared/PlatformNav.tsx
          grep -Fq 'new URL("/v2/kiosk/", testOrigin())' apps/kiosk/prod-test-entry.js
          grep -Fq 'initializeTestHandoff()' apps/platform-v2/src/kiosk/main.tsx
          grep -Fq 'embeddedLaunch' apps/platform-v2/src/kiosk/testHandoff.ts
          grep -Fq 'cleanLaunchUrl()' apps/platform-v2/src/kiosk/testHandoff.ts
          grep -Fq 'window.location.replace(prodKioskUrl())' apps/platform-v2/src/kiosk/testHandoff.ts
          grep -Fq 'bd:kiosk-test-exit' apps/platform-v2/src/kiosk/testHandoff.ts
          grep -Fq 'searchParams.delete("pairing")' apps/platform-v2/src/equipment/EquipmentWorkspace.tsx
          grep -Fq 'get("pairing")' apps/platform-v2/src/equipment/EquipmentWorkspace.tsx

      - name: Verify club-independent tablet pairing contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'GlobalPairingClaim' apps/platform-v2/src/equipment/EquipmentWorkspace.tsx
          grep -Fq '1. Klubb' apps/platform-v2/src/equipment/GlobalPairingClaim.tsx
          grep -Fq 'kiosk-pairing.php?action=admin-info' apps/platform-v2/src/equipment/GlobalPairingClaim.tsx
          grep -Fq 'kiosk-pairing.php?action=claim' apps/platform-v2/src/equipment/GlobalPairingClaim.tsx
          grep -Fq 'Kode fra nettbrett' apps/platform-v2/src/equipment/BoardEditor.tsx
          if grep -Fq '/kiosk-pairing-requests' apps/platform-v2/src/equipment/EquipmentWorkspace.tsx; then
            echo 'Equipment v2 must not expose the club-scoped pending tablet queue.' >&2
            exit 1
          fi

      - name: Verify tablet-first kiosk parity contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f apps/platform-v2/src/kiosk/kiosk-tablet.css
          test -f apps/platform-v2/src/kiosk/kiosk-interactions.css
          test -f apps/platform-v2/src/kiosk/KioskErrorBoundary.tsx
          grep -Fq 'overflow: hidden' apps/platform-v2/src/kiosk/kiosk-tablet.css
          grep -Fq 'grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr)' apps/platform-v2/src/kiosk/kiosk-tablet.css
          grep -Fq 'aspect-ratio: 3 / 4' apps/platform-v2/src/kiosk/kiosk-tablet.css
          grep -Fq '"per_dart"' apps/platform-v2/src/kiosk/KioskWorkspace.tsx
          grep -Fq '>Per pil<' apps/platform-v2/src/kiosk/KioskWorkspace.tsx
          grep -Fq 'kiosk-settings-button' apps/platform-v2/src/kiosk/KioskWorkspace.tsx
          grep -Fq 'KioskErrorBoundary' apps/platform-v2/src/kiosk/main.tsx
          grep -Fq 'leg_number' apps/platform-v2/src/shared/api.ts
          grep -Fq 'normalizeKioskSnapshot' apps/platform-v2/src/shared/api.ts
          if grep -Fq 'PlatformNav' apps/platform-v2/src/kiosk/main.tsx; then
            echo 'Kiosk v2 must be a full-screen terminal surface, not a portal page.' >&2
            exit 1
          fi

      - name: Build platform v2
        run: npm run v2:build

      - name: Verify v2 release surface
        run: |
          set -Eeuo pipefail
          test -f apps/platform-v2-dist/equipment/index.html
          test -f apps/platform-v2-dist/kiosk/index.html
          test -d apps/platform-v2-dist/assets
          grep -Fq '/v2/assets/' apps/platform-v2-dist/equipment/index.html
          grep -Fq '/v2/assets/' apps/platform-v2-dist/kiosk/index.html
          if find apps/platform-v2-dist -type f \( -name '*.ts' -o -name '*.tsx' \) | grep -q .; then
            echo 'TypeScript source leaked into built v2 release.' >&2
            exit 1
          fi
